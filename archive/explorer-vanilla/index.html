<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capex Ledger Explorer</title>
  <meta name="description" content="Revenue, capex and opex for AI-trade companies, pulled from SEC EDGAR, cleaned and normalized to calendar quarters, with the source of every number.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"><noscript><p style="padding:24px">The explorer needs JavaScript. The cleaned data is also in data/clean/facts.csv.</p></noscript></div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1"></aside>
  <div class="tip" id="tip" role="status" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
