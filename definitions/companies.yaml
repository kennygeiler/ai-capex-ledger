# Per-company definitions: the judgements a person made once about what a field means for a company. Code applies
# them on every run, so no one is asked again. Each entry says who decided and why. Add an entry here instead of
# accepting the same exception release after release; the file is versioned with the repo.
#
#   revenue:    the 10-K line is the ledger's revenue and the SEC's XBRL tag measures something wider; the gap is the
#               definition, not a misread, so the value is labelled definition_gap instead of blocking.
#   cost_lines: the company reports no total cost-of-revenue line; these row labels are its costs of delivering
#               revenue and are added up. The cost_lines_summed rule stays quiet while the agent's lines are all here.

XOM:
  revenue:
    line: Sales and other operating revenue
    why: The SEC's Revenues tag is total revenues and other income (sales plus income from equity affiliates plus other
      income); the sales line has had no us-gaap tag since FY2022. A gap of a few percent is the definition.
    by: Kenny Geiler
    at: 2026-10-28
  cost_lines:
    lines: [Crude oil and product purchases, Production and manufacturing expenses]
    why: ExxonMobil reports no cost-of-revenue total; these are its costs of delivering revenue.
    by: Kenny Geiler
    at: 2026-10-28

ORCL:
  cost_lines:
    lines: [Cloud services and license support(1), Hardware(1), Services(1), Cloud and software(1), Services]
    why: Oracle's own cost section (cloud services and license support, hardware, services); the SEC's opex tag has no
      cost-of-revenue split. Older 10-Ks label the lines without the footnote mark.
    by: Kenny Geiler
    at: 2026-10-28

APLD:
  cost_lines:
    lines: [Data center rental and other cost of revenue, Services cost of revenue]
    why: The two cost lines above gross profit.
    by: Kenny Geiler
    at: 2026-10-28

COMP:
  cost_lines:
    lines: [Commissions and other related expense]
    why: Compass's cost of delivering a transaction; the SEC's opex tag includes commissions, so opex differs by
      definition.
    by: Kenny Geiler
    at: 2026-10-28

CDNS:
  cost_lines:
    lines: [Cost of product and maintenance, Cost of services]
    why: Cadence reports no cost-of-revenue total; these are its two cost lines above gross margin.
    by: Kenny Geiler
    at: 2026-10-30

DLR:
  cost_lines:
    lines: [Rental property operating and maintenance, Property taxes and insurance]
    why: Digital Realty reports no cost-of-revenue total; property operating costs and property taxes are its costs of delivering rental revenue.
    by: Kenny Geiler
    at: 2026-10-30

GEV:
  cost_lines:
    lines: [Cost of equipment, Cost of services]
    why: GE Vernova reports cost of equipment and cost of services with no total line.
    by: Kenny Geiler
    at: 2026-10-30

IRM:
  opex:
    why: Iron Mountain's XBRL OperatingExpenses tag is total operating costs including cost of sales and depreciation; our opex is revenue minus cost of sales minus operating income, so the two differ by cost of sales every year while revenue and operating income agree.
    by: Kenny Geiler
    at: 2026-10-30

CEG:
  cost_lines:
    lines: [Purchased power and fuel, Purchased power and fuel from affiliates]
    why: Constellation reports no cost-of-revenue total; purchased power and fuel, including from affiliates, is its cost of delivering energy.
    by: Kenny Geiler
    at: 2026-10-31

HPE:
  cost_lines:
    lines: [Cost of products, Cost of services, Financing cost, Cost of products (exclusive of amortization shown separately below), Cost of services (exclusive of amortization shown separately below)]
    why: HPE reports cost of products, cost of services and financing cost with no total; newer filings add the amortization qualifier to the labels.
    by: Kenny Geiler
    at: 2026-10-31

RIOT:
  cost_lines:
    lines: [Bitcoin Mining, Engineering, Data Center Hosting, Other]
    why: Riot's cost of revenues is split by business line (bitcoin mining, engineering, data center hosting, other) with no total.
    by: Kenny Geiler
    at: 2026-10-31

SLNH:
  cost_lines:
    lines: [Total cost of cryptocurrency mining revenue, Cost of data hosting revenue]
    why: Soluna reports the cost of mining revenue and of data-hosting revenue separately with no total.
    by: Kenny Geiler
    at: 2026-10-31

VST:
  opex:
    why: Vistra's XBRL OperatingExpenses tag is total operating costs including fuel and purchased power; our opex excludes those lines, so the two differ by them while revenue and operating income agree.
    by: Kenny Geiler
    at: 2026-10-31
  cost_lines:
    lines: ["Fuel, purchased power costs and delivery fees", "Fuel, purchased power costs, and delivery fees", Operating costs]
    why: Vistra reports fuel and purchased power (the label gains a comma in later filings) and operating costs with no cost-of-revenue total.
    by: Kenny Geiler
    at: 2026-10-31

VZ:
  cost_lines:
    lines: [Cost of services (exclusive of items shown below), Cost of wireless equipment]
    why: Verizon reports cost of services and cost of wireless equipment with no total.
    by: Kenny Geiler
    at: 2026-10-31

LITE:
  opex:
    why: Lumentum's XBRL OperatingExpenses tag is narrower than revenue minus cost of revenue minus operating income by a stable 60 to 85 million every year while revenue and operating income agree; the tag excludes amortization and restructuring lines the income statement puts below gross profit.
    by: Kenny Geiler
    at: 2026-10-31

UBER:
  opex:
    why: Uber's XBRL OperatingExpenses tag is total costs and expenses including cost of revenue; our opex is revenue minus cost of revenue minus operating income, so the two differ by cost of revenue while revenue and operating income agree.
    by: Kenny Geiler
    at: 2026-10-31

TLN:
  opex:
    why: Talen's XBRL OperatingExpenses tag is total operating expenses including fuel and purchased power; our opex excludes those cost lines, so the two differ by them while revenue and operating income agree.
    by: Kenny Geiler
    at: 2026-10-31

BTBT:
  cost_lines:
    lines: [Cloud services, Colocation services, Digital asset mining, ETH staking]
    why: Bit Digital reports cost of revenue by business line (cloud, colocation, mining, staking) with no total.
    by: Kenny Geiler
    at: 2026-10-31

GLXY:
  cost_lines:
    lines: [Transaction expenses]
    why: Galaxy's one cost-of-revenue line is transaction expenses; the rest of its costs are operating expenses.
    by: Kenny Geiler
    at: 2026-10-31

T:
  cost_lines:
    lines: [Equipment, "Other cost of revenues (exclusive of depreciationand amortization shown separately below)", "Broadcast, programming and operations"]
    why: AT&T reports equipment cost, other cost of revenues and (until 2022) broadcast and programming cost with no total; the filing's own label runs "depreciationand" together.
    by: Kenny Geiler
    at: 2026-10-31
  opex:
    why: AT&T's XBRL OperatingExpenses tag is total operating expenses including cost of revenues and depreciation; our opex excludes the cost lines, so the two differ by them while revenue and operating income agree.
    by: Kenny Geiler
    at: 2026-10-31

TMUS:
  cost_lines:
    lines: ["Cost of services, exclusive of depreciation and amortization shown separately below", "Cost of equipment sales, exclusive of depreciation and amortization shown separately below"]
    why: T-Mobile reports cost of services and cost of equipment sales, each excluding depreciation, with no total.
    by: Kenny Geiler
    at: 2026-10-31
  opex:
    why: T-Mobile's XBRL OperatingExpenses tag is total operating expenses including cost of services and equipment; our opex excludes those lines, so the two differ by them while revenue and operating income agree.
    by: Kenny Geiler
    at: 2026-10-31

