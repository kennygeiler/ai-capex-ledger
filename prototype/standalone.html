/* hallmark-lite · genre: editorial · data: sample · prototype harness (4 variants) · skill read from nutlope/hallmark, not installed; sloplint not run */
/* critique: one accent per role (buyers blue, sellers orange), hairlines over cards, tabular figures everywhere */

:root {
  color-scheme: light;
  --paper: #f7f6f2;
  --paper-2: #efede6;
  --ink: #16150f;
  --muted: #5d5b53;
  --rule: #dcd9cf;
  --buyer: #2a78d6;
  --buyer-soft: #cde2fb;
  --seller: #eb6834;
  --seller-soft: #fbd9c9;
  --focus: #16150f;
  --font-display: "Source Serif 4", Georgia, serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, monospace;
  --measure: 1180px;
  --gutter: 16px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #121210;
    --paper-2: #1b1b18;
    --ink: #f0efec;
    --muted: #a9a79d;
    --rule: #2e2d29;
    --buyer: #3987e5;
    --buyer-soft: #1c3557;
    --seller: #d95926;
    --seller-soft: #4a2414;
    --focus: #f0efec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #121210;
  --paper-2: #1b1b18;
  --ink: #f0efec;
  --muted: #a9a79d;
  --rule: #2e2d29;
  --buyer: #3987e5;
  --buyer-soft: #1c3557;
  --seller: #d95926;
  --seller-soft: #4a2414;
  --focus: #f0efec;
}

* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; margin: 0; overflow-wrap: break-word; min-width: 0; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, .code { font-family: var(--font-code); font-size: 13px; }

.wrap { max-width: var(--measure); margin: 0 auto; padding: 0 var(--gutter); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }

/* Sample notice: the one honest label every variant carries */
.sample-note {
  border-bottom: 1px solid var(--rule);
  background: var(--paper-2);
  font-size: 14px;
  color: var(--muted);
}
.sample-note .wrap { padding-top: 8px; padding-bottom: 8px; }

/* Masthead */
.mast { border-bottom: 1px solid var(--rule); }
.mast .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-top: 18px; padding-bottom: 14px; }
.wordmark { white-space: nowrap; font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.mast nav { display: flex; gap: 20px; font-size: 14px; }
.mast nav a { text-decoration: none; color: var(--muted); }
.mast nav a:hover { color: var(--ink); }

.btn {
  display: inline-flex; align-items: center; height: 40px; padding: 0 16px;
  border: 1px solid var(--ink); border-radius: 999px; background: transparent;
  text-decoration: none; font-size: 15px; cursor: pointer;
  transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:active { transform: scale(0.97); }

.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: baseline; margin-right: 6px; }
.swatch.buyer { background: var(--buyer); }
.swatch.seller { background: var(--seller); }

/* Charts */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font-body); font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .bar { transition: opacity 120ms var(--ease-out); }
.chart:hover .bar.dim { opacity: 0.35; }

.tip {
  position: fixed; z-index: 1000; pointer-events: none;
  min-width: 160px; padding: 8px 10px; border-radius: 6px;
  background: var(--ink); color: var(--paper);
  font-size: 13px; line-height: 1.4;
  opacity: 0; transition: opacity 100ms var(--ease-out);
}
.tip[data-show] { opacity: 1; }
.tip .tip-title { font-weight: 600; margin-bottom: 2px; }
.tip .row { display: flex; justify-content: space-between; gap: 16px; }
.tip .row span:last-child { font-variant-numeric: tabular-nums; }
.tip .sub { opacity: 0.7; font-size: 12px; margin-top: 4px; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--ink); white-space: nowrap; }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
td.r, th.r { text-align: right; }
.table-scroll { overflow-x: auto; }

/* ───────── Variant 1: Report ───────── */
.report-hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; padding: 56px 0 48px; align-items: end; }
.hero-figure { font-family: var(--font-display); font-size: clamp(64px, 9vw, 120px); line-height: 0.95; letter-spacing: -0.03em; font-weight: 500; }
.hero-head { font-size: clamp(26px, 3vw, 36px); line-height: 1.15; margin-top: 12px; max-width: 14ch; }
.hero-sub { margin-top: 16px; max-width: 40ch; color: var(--muted); }
.hero-actions { margin-top: 24px; }
.section { border-top: 1px solid var(--rule); padding: 40px 0 48px; }
.section-head { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; margin-bottom: 28px; }
.section-head h2 { font-size: 28px; line-height: 1.2; }
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 32px 32px; }
.multiple h3 { font-family: var(--font-body); font-size: 15px; font-weight: 600; }
.multiple .stat { display: flex; gap: 16px; margin: 2px 0 10px; font-size: 14px; color: var(--muted); }
.methods { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 24px; font-size: 14px; }
.methods dt { font-weight: 600; }
.methods dd { margin: 4px 0 0; color: var(--muted); }
.foot { border-top: 1px solid var(--ink); padding: 24px 0 120px; font-size: 14px; color: var(--muted); }

/* ───────── Variant 2: Desk ───────── */
.desk { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 110px); }
.rail { border-right: 1px solid var(--rule); padding: 12px 0 96px; }
.rail-group { padding: 16px 16px 6px; font-size: 13px; color: var(--muted); }
.rail-item {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) 64px; align-items: center; gap: 10px;
  width: 100%; padding: 8px 16px; border: 0; background: transparent; text-align: left; cursor: pointer;
  transition: background-color 120ms var(--ease-out);
}
.rail-item:hover { background: var(--paper-2); }
.rail-item[aria-current="true"] { background: var(--paper-2); box-shadow: inset 2px 0 0 var(--ink); }
.rail-item[disabled] { cursor: default; opacity: 0.55; }
.rail-item .tk { font-weight: 600; font-size: 14px; }
.rail-item .nm { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-item .v { font-size: 13px; text-align: right; }
.desk-main { padding: 24px 32px 120px; min-width: 0; }
.desk-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
.desk-head h1 { font-size: 36px; line-height: 1.1; }
.desk-head .meta { font-size: 14px; color: var(--muted); margin-top: 6px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--ink); }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; padding: 24px 0 32px; }
.trio h3 { font-family: var(--font-body); font-size: 14px; font-weight: 600; }
.trio .big { font-family: var(--font-display); font-size: 30px; line-height: 1.1; margin: 4px 0 2px; }
.trio .delta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.facts td { white-space: nowrap; }
.facts-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 8px; }
.facts-head h2 { font-size: 22px; }
.method { font-size: 13px; white-space: nowrap; }
.method[data-m="reported"] { color: var(--muted); }
.method[data-m="ytd_diff"], .method[data-m="q4_derived"] { color: var(--ink); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }

/* ───────── Variant 3: Mirror ───────── */
.mirror-hero { padding: 56px 0 24px; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 48px; align-items: end; }
.mirror-hero h1 { font-size: clamp(40px, 5.4vw, 68px); line-height: 1.02; letter-spacing: -0.02em; }
.mirror-hero p { color: var(--muted); max-width: 42ch; }
.legend { display: flex; gap: 20px; font-size: 14px; margin: 8px 0 16px; flex-wrap: wrap; }
.caption { font-size: 14px; color: var(--muted); margin-top: 12px; max-width: 70ch; }
.slope-wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; }

/* ───────── Variant 4: Terrain ───────── */
.terrain-top { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; padding: 36px 0 16px; }
.terrain-top h1 { font-size: clamp(32px, 4vw, 48px); line-height: 1.05; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 14px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--muted); transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.terrain-stage { position: relative; height: min(64vh, 620px); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.terrain-stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.terrain-stage canvas:active { cursor: grabbing; }
.label3d { font-size: 12px; color: var(--muted); white-space: nowrap; pointer-events: none; }
.label3d.tk { font-weight: 600; color: var(--ink); font-size: 13px; }
.terrain-foot { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 48px; padding: 20px 0 120px; }

@media (max-width: 860px) {
  .report-hero, .section-head, .mirror-hero, .slope-wrap, .terrain-foot { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .desk { grid-template-columns: minmax(0, 1fr); }
  .rail { border-right: 0; border-bottom: 1px solid var(--rule); padding-bottom: 12px; max-height: 280px; overflow-y: auto; }
  .desk-main { padding: 20px var(--gutter) 120px; }
  .trio { grid-template-columns: minmax(0, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; }
}

<script type="module">
// Capex Ledger prototype: four design directions over the same stub data.
// Part 2 swaps data/sample.json for the real EDGAR output (same shape).

// standalone.html inlines the data as window.__DATA__; the dev page fetches it.
const D = window.__DATA__ ?? (await fetch("../data/sample.json").then((r) => r.json()));
const Q = D.meta.quarters;
const COS = D.companies;
const BUYERS = COS.filter((c) => c.role === "spender");
const SELLERS = COS.filter((c) => c.role === "seller");
const byKey = new Map(D.facts.map((f) => [`${f.ticker}|${f.metric}|${f.calQ}`, f]));

const fact = (t, m, q) => byKey.get(`${t}|${m}|${q}`) ?? null;
const val = (t, m, q) => fact(t, m, q)?.value ?? null;
const capex = (t, q, leases = false) => {
  const v = val(t, "capex", q);
  if (v == null) return null;
  return leases ? v + (val(t, "capex_finance_leases", q) ?? 0) : v;
};
const series = (t, m) => Q.map((q) => (m === "capex" ? capex(t, q) : val(t, m, q)));
const sum = (arr) => arr.reduce((a, b) => a + (b ?? 0), 0);
const ttm = (arr) => sum(arr.slice(-4));
const prevTtm = (arr) => sum(arr.slice(-8, -4));
const pct = (a, b) => (b ? (a / b - 1) * 100 : null);
const fmtB = (n) => (n == null ? "–" : `$${n >= 100 ? Math.round(n) : n.toFixed(1)}B`);
const fmtPct = (n, signed = true) => (n == null ? "–" : `${signed && n > 0 ? "+" : ""}${Math.round(n)}%`);
const qLabel = (q) => `Q${q.slice(5)} ’${q.slice(2, 4)}`;
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const roleVar = (role) => (role === "seller" ? "var(--seller)" : "var(--buyer)");
const METHOD_LABEL = { reported: "As filed", ytd_diff: "YTD difference", q4_derived: "10-K minus 9 months" };
const METRIC_LABEL = { revenue: "Revenue", capex: "Capex", capex_finance_leases: "Finance leases", opex: "Opex" };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ───────── Tooltip ─────────
const tipEl = document.getElementById("tip");
const tip = {
  show(html, e) {
    tipEl.innerHTML = html;
    tipEl.setAttribute("data-show", "");
    const pad = 14;
    const r = tipEl.getBoundingClientRect();
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
    tipEl.style.left = `${x}px`;
    tipEl.style.top = `${y}px`;
  },
  hide() { tipEl.removeAttribute("data-show"); },
};
const tipRows = (rows) => rows.map(([a, b]) => `<div class="row"><span>${a}</span><span>${b}</span></div>`).join("");

// ───────── SVG chart helpers (hand-written, no chart library) ─────────
const NS = "http://www.w3.org/2000/svg";
function niceStep(max, n = 4) {
  const raw = max / n;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const f = raw / mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
}
// Bar with only the data end rounded (2px), anchored to the baseline.
function barPath(x, y0, w, y1) {
  const up = y1 < y0;
  const r = Math.min(2, Math.abs(y0 - y1), w / 2);
  if (up) return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`;
  return `M${x},${y0}V${y1 - r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 - r}V${y0}Z`;
}

/** Vertical bars over the quarter axis. values may contain null (no filing that quarter). */
function bars(el, { values, color, height = 160, yMax, tipFn, showAxis = true, labelEvery = 1 }) {
  const W = Math.max(200, el.clientWidth);
  const left = showAxis ? 40 : 0, bottom = 22, top = 8;
  const H = height, ih = H - top - bottom, iw = W - left;
  const max = yMax ?? Math.max(...values.filter((v) => v != null)) * 1.1;
  const step = niceStep(max, 3);
  const top_ = Math.ceil(max / step) * step;
  const y = (v) => top + ih - (v / top_) * ih;
  const band = iw / values.length;
  const bw = Math.min(24, band * 0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  for (let t = 0; t <= top_ + 1e-9; t += step) {
    s += `<line class="grid" x1="${left}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/>`;
    if (showAxis) s += `<text x="${left - 8}" y="${y(t) + 4}" text-anchor="end">${t === 0 ? "0" : `$${+t.toFixed(1)}B`}</text>`;
  }
  values.forEach((v, i) => {
    const x = left + band * i + (band - bw) / 2;
    if (v != null) s += `<path class="bar" data-i="${i}" d="${barPath(x, y(0), bw, y(v))}" fill="${color}"/>`;
    // Anchor labels to the latest quarter so the last two never collide.
    if ((values.length - 1 - i) % labelEvery === 0) s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${qLabel(Q[i])}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${left + band * i}" y="${top}" width="${band}" height="${ih}"/>`;
  });
  s += `</svg>`;
  el.innerHTML = s;
  el.classList.add("chart");
  wireHover(el, tipFn);
}

function wireHover(el, tipFn) {
  if (!tipFn) return;
  const barsEls = [...el.querySelectorAll(".bar")];
  el.querySelectorAll(".hit").forEach((h) => {
    const i = +h.dataset.i;
    h.addEventListener("pointermove", (e) => {
      barsEls.forEach((b) => b.classList.toggle("dim", +b.dataset.i !== i));
      tip.show(tipFn(i), e);
    });
    h.addEventListener("pointerleave", () => { barsEls.forEach((b) => b.classList.remove("dim")); tip.hide(); });
  });
}

function sparkline(values, color, w = 64, h = 20) {
  const pts = values.map((v, i) => [i, v]).filter(([, v]) => v != null);
  const max = Math.max(...pts.map(([, v]) => v)), min = Math.min(...pts.map(([, v]) => v));
  const x = (i) => (i / (values.length - 1)) * (w - 2) + 1;
  const y = (v) => h - 2 - ((v - min) / (max - min || 1)) * (h - 4);
  const d = pts.map(([i, v], k) => `${k ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

const combinedTip = (group, metricFn, title) => (i) => {
  const rows = group
    .map((c) => [c.ticker, metricFn(c.ticker, Q[i])])
    .filter(([, v]) => v != null)
    .sort((a, b) => b[1] - a[1])
    .map(([t, v]) => [t, fmtB(v)]);
  const total = sum(group.map((c) => metricFn(c.ticker, Q[i])));
  return `<div class="tip-title">${title} ${qLabel(Q[i])}: ${fmtB(total)}</div>${tipRows(rows)}`;
};

  document.addEventListener("keydown", onKey);
  draw();
  return () => document.removeEventListener("keydown", onKey);
}

// ───────── Variant 3: Mirror (one argument: spend vs. booked revenue) ─────────
function mirror(stage) {
  const up = Q.map((q) => sum(SELLERS.map((c) => val(c.ticker, "revenue", q))));
  const down = Q.map((q) => sum(BUYERS.map((c) => capex(c.ticker, q))));
  stage.innerHTML = `
  <header class="mast"><div class="wrap"><span class="wordmark">Capex Ledger</span>
    <nav><a href="#m-chart">The mirror</a><a href="#m-slope">Intensity</a></nav></div></header>
  <div class="wrap">
    <section class="mirror-hero">
      <h1>Buyers spend it. Sellers book it.</h1>
      <p>Seven buyers' capital spending below the line, three chip and memory makers' revenue above it. Same dollars, one axis, eight quarters.</p>
    </section>
    <section id="m-chart" style="padding-bottom:40px">
      <div class="legend"><span><span class="swatch seller"></span>Sellers' revenue (Nvidia, AMD, Micron)</span><span><span class="swatch buyer"></span>Buyers' capex (seven companies)</span></div>
      <div id="mirror-chart"></div>
      <p class="caption">Totals, not transactions. Filings don't say who buys from whom, and not all capex is AI: buildings and land count too. The gap between the two sides is the story to test in part 2.</p>
    </section>
    <section class="section" id="m-slope">
      <div class="slope-wrap">
        <div><h2 style="font-size:28px;line-height:1.2">Capex as a share of revenue</h2>
          <p class="muted" style="margin-top:12px">How much of each dollar earned goes back into building. First quarter on the left, latest on the right. The steepest climb is in colour.</p>
          <p class="muted small" style="margin-top:12px">CoreWeave is left out: its capex runs at about three times its revenue, which would flatten the other six.</p></div>
        <div id="slope-chart" class="chart"></div>
      </div>
    </section>
    <footer class="foot">Sample data. Real figures arrive with the EDGAR pipeline.</footer>
  </div>`;

  // Mirror chart: diverging from a zero line, symmetric scale.
  const el = stage.querySelector("#mirror-chart");
  const W = Math.max(320, el.clientWidth), H = 420, left = 52, top = 10, bottom = 10, xLab = 26;
  const max = Math.max(...up, ...down) * 1.08;
  const step = niceStep(max, 3), lim = Math.ceil(max / step) * step;
  const mid = top + (H - top - bottom - xLab) / 2, half = (H - top - bottom - xLab) / 2;
  const y = (v) => mid - (v / lim) * half;
  const band = (W - left) / Q.length, bw = Math.min(28, band * 0.55);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Sellers' revenue above zero, buyers' capex below, by quarter">`;
  for (let t = -lim; t <= lim + 1e-9; t += step) {
    s += `<line class="grid" x1="${left}" x2="${W}" y1="${y(t)}" y2="${y(t)}" ${t === 0 ? 'style="stroke:var(--ink)"' : ""}/>`;
    s += `<text x="${left - 8}" y="${y(t) + 4}" text-anchor="end">${t === 0 ? "0" : `$${Math.abs(t)}B`}</text>`;
  }
  Q.forEach((q, i) => {
    const x = left + band * i + (band - bw) / 2;
    s += `<path class="bar" data-i="${i}" d="${barPath(x, y(0), bw, y(up[i]))}" fill="var(--seller)"/>`;
    s += `<path class="bar" data-i="${i}" d="${barPath(x, y(0), bw, y(-down[i]))}" fill="var(--buyer)"/>`;
    s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${qLabel(q)}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${left + band * i}" y="${top}" width="${band}" height="${H - top - xLab}"/>`;
  });
  // Direct labels on the latest quarter only.
  const lx = left + band * (Q.length - 1) + band / 2;
  s += `<text x="${lx}" y="${y(up.at(-1)) - 8}" text-anchor="middle" style="fill:var(--ink)">${fmtB(up.at(-1))}</text>`;
  s += `<text x="${lx}" y="${y(-down.at(-1)) + 16}" text-anchor="middle" style="fill:var(--ink)">${fmtB(down.at(-1))}</text>`;
  el.innerHTML = s + "</svg>";
  el.classList.add("chart");
  wireHover(el, (i) => {
    const sellers = combinedTip(SELLERS, (t, q) => val(t, "revenue", q), "Sellers' revenue")(i);
    const buyers = combinedTip(BUYERS, (t, q) => capex(t, q), "Buyers' capex")(i);
    return `${sellers}<div style="height:8px"></div>${buyers}`;
  });

  // Slope chart: capex / revenue, first quarter vs latest, per buyer.
  const sl = stage.querySelector("#slope-chart");
  const SW = Math.max(320, sl.clientWidth), SH = 340, padX = 90, padY = 24;
  // CoreWeave's capex runs ~3x its revenue; on the same scale it flattens everyone else.
  const pts = BUYERS.filter((c) => c.ticker !== "CRWV").map((c) => {
    const firstQ = Q.find((q) => val(c.ticker, "revenue", q) != null);
    return { c, firstQ, a: capex(c.ticker, firstQ) / val(c.ticker, "revenue", firstQ), b: capex(c.ticker, Q.at(-1)) / val(c.ticker, "revenue", Q.at(-1)) };
  });
  const smax = Math.max(...pts.flatMap((p) => [p.a, p.b])) * 1.1;
  const sy = (v) => SH - padY - (v / smax) * (SH - padY * 2);
  const x0 = padX, x1 = SW - padX;
  const lead = pts.reduce((m, p) => (p.b - p.a > m.b - m.a ? p : m));
  // Spread labels so none sit closer than 16px; marks stay at their true values.
  const spread = (key) => {
    const ord = [...pts].sort((p, q) => sy(q[key]) - sy(p[key]));
    let last = Infinity;
    ord.forEach((p) => { const y = Math.min(sy(p[key]), last - 16); p[key + "L"] = y; last = y; });
  };
  spread("a"); spread("b");
  let ss = `<svg viewBox="0 0 ${SW} ${SH}" width="${SW}" height="${SH}" role="img" aria-label="Capex as share of revenue, first versus latest quarter">`;
  ss += `<line class="grid" x1="${x0}" x2="${x0}" y1="${padY}" y2="${SH - padY}"/><line class="grid" x1="${x1}" x2="${x1}" y1="${padY}" y2="${SH - padY}"/>`;
  ss += `<text x="${x0}" y="${padY - 8}" text-anchor="middle">${qLabel(Q[0])}</text><text x="${x1}" y="${padY - 8}" text-anchor="middle">${qLabel(Q.at(-1))}</text>`;
  pts.sort((p, q) => (p === lead) - (q === lead)).forEach((p) => {
    const hot = p === lead, col = hot ? "var(--buyer)" : "var(--muted)";
    ss += `<line x1="${x0}" y1="${sy(p.a)}" x2="${x1}" y2="${sy(p.b)}" stroke="${col}" stroke-width="${hot ? 2.5 : 1.5}" opacity="${hot ? 1 : 0.6}"/>`;
    ss += `<circle cx="${x0}" cy="${sy(p.a)}" r="3.5" fill="${col}"/><circle cx="${x1}" cy="${sy(p.b)}" r="3.5" fill="${col}"/>`;
    ss += `<text x="${x0 - 10}" y="${p.aL + 4}" text-anchor="end" ${hot ? 'style="fill:var(--ink);font-weight:600"' : ""}>${p.c.ticker} ${Math.round(p.a * 100)}%</text>`;
    ss += `<text x="${x1 + 10}" y="${p.bL + 4}" ${hot ? 'style="fill:var(--ink);font-weight:600"' : ""}>${Math.round(p.b * 100)}% ${p.c.ticker}</text>`;
  });
  sl.innerHTML = ss + "</svg>";
}

// ───────── Variant 4: Terrain (three.js, spatial exploration) ─────────
let terrainMetric = "capex";
function terrain(stage) {
  let disposed = false;
  let cleanup = () => {};
  stage.innerHTML = `
  <header class="mast"><div class="wrap"><span class="wordmark">Capex Ledger</span>
    <nav><span class="muted">Drag to orbit, scroll to zoom</span></nav></div></header>
  <div class="wrap">
    <div class="terrain-top">
      <h1>Ten companies, eight quarters.</h1>
      <div class="seg" role="group" aria-label="Metric">
        <button data-m="capex" aria-pressed="${terrainMetric === "capex"}">Capex</button>
        <button data-m="revenue" aria-pressed="${terrainMetric === "revenue"}">Revenue</button>
      </div>
    </div>
  </div>
  <div class="terrain-stage" id="terrain"></div>
  <div class="wrap"><div class="terrain-foot">
    <p class="muted small">What 3D costs: a bar at the back is hard to compare with one at the front. Use it to explore, then read the exact value in the tooltip. Rows run buyers first, then sellers; height is ${terrainMetric}, one scale for all.</p>
    <div class="legend"><span><span class="swatch buyer"></span>Buyers</span><span><span class="swatch seller"></span>Sellers</span></div>
  </div></div>`;

  stage.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    terrainMetric = b.dataset.m;
    mount(current); // harness re-mount, so its cleanup stays tracked
  }));

  (async () => {
    const THREE = await import("three");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
    const { CSS2DRenderer, CSS2DObject } = await import("three/addons/renderers/CSS2DRenderer.js");
    if (disposed) return;
    const host = stage.querySelector("#terrain");
    const W = host.clientWidth, H = host.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(W, H);
    host.appendChild(renderer.domElement);
    const labels = new CSS2DRenderer();
    labels.setSize(W, H);
    Object.assign(labels.domElement.style, { position: "absolute", inset: "0", pointerEvents: "none" });
    host.appendChild(labels.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);
    camera.position.set(-9, 12, 17);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minDistance = 8;
    controls.maxDistance = 40;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(-6, 14, 10);
    scene.add(sun);

    const rows = [...BUYERS, ...SELLERS];
    const spacingX = 1.2, spacingZ = 1.2, foot = 0.62, maxH = 6;
    const cx = ((Q.length - 1) * spacingX) / 2, cz = ((rows.length - 1) * spacingZ) / 2;
    controls.target.set(0, 1.2, 0);

    const get = (t, q) => (terrainMetric === "capex" ? capex(t, q) : val(t, "revenue", q));
    const max = Math.max(...rows.flatMap((c) => Q.map((q) => get(c.ticker, q) ?? 0)));

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(Q.length * spacingX + 1, rows.length * spacingZ + 1),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(css("--paper-2")), roughness: 1 }),
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const geo = new THREE.BoxGeometry(foot, 1, foot);
    geo.translate(0, 0.5, 0); // grow from the floor
    const mats = { spender: new THREE.MeshStandardMaterial({ color: new THREE.Color(css("--buyer")), roughness: 0.7 }),
                   seller: new THREE.MeshStandardMaterial({ color: new THREE.Color(css("--seller")), roughness: 0.7 }) };
    const meshes = [];
    rows.forEach((c, zi) => {
      Q.forEach((q, xi) => {
        const v = get(c.ticker, q);
        if (v == null) return;
        const m = new THREE.Mesh(geo, mats[c.role].clone());
        m.position.set(xi * spacingX - cx, 0, zi * spacingZ - cz);
        m.userData = { c, q, v, target: Math.max(0.02, (v / max) * maxH) };
        m.scale.y = reduceMotion ? m.userData.target : 0.001;
        scene.add(m);
        meshes.push(m);
      });
      const div = document.createElement("div");
      div.className = "label3d tk";
      div.textContent = c.ticker;
      const lab = new CSS2DObject(div);
      lab.position.set(-cx - 1.1, 0, zi * spacingZ - cz);
      scene.add(lab);
    });
    Q.forEach((q, xi) => {
      if (xi % 2 && xi !== Q.length - 1) return;
      const div = document.createElement("div");
      div.className = "label3d";
      div.textContent = qLabel(q);
      const lab = new CSS2DObject(div);
      lab.position.set(xi * spacingX - cx, 0, cz + 1.1);
      scene.add(lab);
    });

    // Hover
    const ray = new THREE.Raycaster();
    const ptr = new THREE.Vector2();
    let hovered = null;
    const onMove = (e) => {
      const r = renderer.domElement.getBoundingClientRect();
      ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ptr, camera);
      const hit = ray.intersectObjects(meshes)[0]?.object ?? null;
      if (hovered && hovered !== hit) hovered.material.emissive.setHex(0x000000);
      hovered = hit;
      if (hit) {
        hit.material.emissive.setHex(0x333333);
        const { c, q, v } = hit.userData;
        const f = fact(c.ticker, terrainMetric, q);
        tip.show(`<div class="tip-title">${c.name} ${qLabel(q)}</div>${tipRows([[METRIC_LABEL[terrainMetric], fmtB(v)]])}<div class="sub">${f.fiscal}, ${METHOD_LABEL[f.method].toLowerCase()}</div>`, e);
      } else tip.hide();
    };
    const onLeave = () => { if (hovered) hovered.material.emissive.setHex(0x000000); hovered = null; tip.hide(); };
    renderer.domElement.addEventListener("pointermove", onMove);
    renderer.domElement.addEventListener("pointerleave", onLeave);

    const t0 = performance.now();
    renderer.setAnimationLoop(() => {
      if (!reduceMotion) {
        const k = Math.min(1, (performance.now() - t0) / 600);
        const e = 1 - (1 - k) ** 3;
        meshes.forEach((m, i) => { const kk = Math.min(1, Math.max(0, e * 1.4 - (i / meshes.length) * 0.4)); m.scale.y = Math.max(0.001, m.userData.target * kk); });
      }
      controls.update();
      renderer.render(scene, camera);
      labels.render(scene, camera);
    });

    cleanup = () => {
      renderer.setAnimationLoop(null);
      renderer.domElement.removeEventListener("pointermove", onMove);
      renderer.domElement.removeEventListener("pointerleave", onLeave);
      controls.dispose();
      meshes.forEach((m) => m.material.dispose());
      Object.values(mats).forEach((m) => m.dispose());
      geo.dispose(); floor.geometry.dispose(); floor.material.dispose();
      renderer.dispose(); renderer.forceContextLoss();
      host.innerHTML = "";
      tip.hide();
    };
  })().catch((err) => {
    stage.querySelector("#terrain").innerHTML = `<p class="wrap muted" style="padding:24px 16px">3D view could not load: ${err.message}</p>`;
  });

  return () => { disposed = true; cleanup(); };
}

// ───────── Picker harness (wiring from the prototype skill's PICKER.md, plus unmount cleanup) ─────────
const variants = [report, desk, mirror, terrain];
const stage = document.getElementById("stage");
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
let current = 0;
let unmount = null;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  unmount?.(); unmount = null;
  tip.hide();
  stage.innerHTML = "";
  requestAnimationFrame(() => { unmount = variants[i](stage) ?? null; });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set("v", i + 1);
  history.replaceState(null, "", url);
  window.scrollTo(0, 0);
  mount(i);
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
let rz;
window.addEventListener("resize", () => { moveHighlight(); clearTimeout(rz); rz = setTimeout(() => mount(current), 200); });
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));

</script>
