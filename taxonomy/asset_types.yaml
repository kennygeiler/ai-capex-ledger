# The company's own PP&E category, as printed in its note, mapped to the nearest us-gaap PropertyPlantAndEquipmentByTypeAxis
# member (docs/TAXONOMY.md). A mapping is a classification against a published list, recorded with the note's words; it is
# never a number. `standard_type` is the us-gaap member; `evidence` is what the note says the category holds, quoted or
# paraphrased from the filing; `by` and `at` say who recorded it. One entry per (ticker, reported_name). A reported name
# with no entry is open on the Proof board until someone writes one.
#
# us-gaap members used: TechnologyEquipmentMember, ComputerEquipmentMember, SoftwareAndSoftwareDevelopmentCostsMember,
# LandMember, LandAndBuildingMember, BuildingAndBuildingImprovementsMember, LeaseholdImprovementsMember,
# ConstructionInProgressMember, FurnitureAndFixturesMember, MachineryAndEquipmentMember, LandImprovementsMember,
# ElectricGenerationEquipmentMember, OtherMachineryAndEquipmentMember, PropertyPlantAndEquipmentOtherTypesMember,
# BuildingMember, BuildingImprovementsMember, EquipmentMember, OtherCapitalizedPropertyPlantAndEquipmentMember.
#
# The last four are the us-gaap members Amazon's FY2025 and Applied Digital's instances tag for categories mapped
# otherwise below (T63), listed so a person can choose the filer's own member on Reconcile.
#
# T63: an entry is a person's only when it carries `confirmed_by` and `confirmed_at`: who stands behind it, and when.
# An entry without them is a proposal: open on Proof as "to confirm" and a G6 failure until a person approves, edits
# or rejects it on Reconcile, asset types (POST /api/mapping writes both fields; an agent never writes them).

