# The failure types docs/INGESTION.md has logged, as data (T54). INGESTION.md keeps the narrative (where each showed,
# what fixed it); this file is the classification a chart or a test can read. One entry per type, keyed by INGESTION's
# own type number; the numbering is kept, never renumbered, so a reader can find the row.
#
# Fields:
#   name        a short name for the type (INGESTION's bold phrase, shortened).
#   class       the cause class, one of: units (thousands/millions/dollars), period (which year, vintage or length of
#               period), scope (what a figure, tag, filing set or source covers; definitions), locator (which table was
#               taken for the statement or note), agent misread (the reader cited or shaped the wrong thing), document
#               error (a quirk of the filing's own text or layout: positioned text, a repeated label, a run of cells).
#   class_note  only where the six classes fit badly (a pipeline bookkeeping defect, say): why this class was chosen.
#   origin      where the cause sits: agent (the reader or attributor), document (the filing, the page, the company's
#               own presentation), code (the pipeline's parser, locator, contract or bookkeeping), reference (the SEC's
#               tag, CIK mapping or XBRL instance, or the key built from them).
#   check       the check in code that catches the type today: a rule id (rules/*.yaml, ledger/rules.py), a guard id
#               (ledger/proof.py GUARDS), a fault kind (ledger/faults.py FAULTS), or none. `none` is itself a finding:
#               the type is caught by a pipeline step, a contract, a count or an eye, not by a named check. Never an id
#               that does not exist in code; ledger/failures.py refuses one.
#   check_note  with `none`: what caught it instead and what was looked for.
#   caught_by   INGESTION's own "Caught by" words, verbatim or near it, for the reader.
#   count       how many distinct companies INGESTION names for the type (an integer), or null when the text gives
#               no names ("every filing", "every hyperscaler"); count_note carries the text's own words either way
#               when they say more than the number (filings, cells, company-years).
#   first_seen  the date INGESTION gives for the run or section the type was found in, or null when it gives none.
#   source      the INGESTION.md section and a few of the row's own words, so a reader finds the line.
#   by, at      who recorded the entry and when.
#
# Recorded from docs/INGESTION.md as of 1 Nov 2026 by Claude Fable 5.1 (T54, first half): 72 numbered types, 1 to 72,
# none missing, none added.

