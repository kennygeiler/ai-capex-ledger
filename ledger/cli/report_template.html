<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #fafaf9; --card: #ffffff; --ink: #18181b; --muted: #71717a; --line: #e4e4e7; --soft: #f4f4f5;
  --agent: #2a78d6; --xbrl: #18181b; --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
  --hl: #fef08a; --hl-ink: #18181b; --focus: #2a78d6;
  --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: -apple-system, "Segoe UI", Inter, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0b0b0c; --card: #141416; --ink: #f4f4f5; --muted: #a1a1aa; --line: #27272a; --soft: #1c1c1f;
    --agent: #4b93ea; --xbrl: #f4f4f5; --ok: #4ade80; --ok-bg: #14532d55; --bad: #f87171; --bad-bg: #7f1d1d55; --hl: #a16207; --hl-ink: #fff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 80px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 36px 0 10px; }
.sub { color: var(--muted); max-width: 820px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0 4px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tile .n { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--muted); font-size: 12px; }
.tile.good .n { color: var(--ok); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px; }
.chart { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 6px; }
.chart h3 { font-size: 13px; margin: 0; display: flex; justify-content: space-between; }
.chart h3 span { color: var(--muted); font-weight: 400; }
.chart svg { width: 100%; height: 150px; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--sans); }
.legend { display: flex; gap: 16px; color: var(--muted); font-size: 12px; margin: 8px 0 0; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
.ring { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--xbrl); vertical-align: -1px; margin-right: 5px; }
.bar { fill: var(--agent); }
.bar.bad { fill: var(--bad); }
.mark { fill: none; stroke: var(--xbrl); stroke-width: 1.6; }
.hit { fill: transparent; cursor: pointer; }
.grid { stroke: var(--line); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--soft); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.spacer { flex: 1; }
table.vals { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.vals { table-layout: fixed; }
.vals th, .vals td { padding: 9px 10px; overflow-wrap: anywhere; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.vals th { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--soft); }
.vals td.num { text-align: right; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vals tr.main { cursor: pointer; }
.vals tr.main:hover td { background: var(--soft); }
.vals tr.done td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
.abbr { display: none; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.na { background: var(--soft); color: var(--muted); }
.caret { display: inline-block; transition: transform .15s; color: var(--muted); }
tr.open .caret { transform: rotate(90deg); }
.detail td { background: var(--bg); padding: 16px 18px 20px; }
.formula { font-family: var(--mono); font-size: 13px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; overflow-x: auto; white-space: nowrap; }
.formula .eq { color: var(--muted); }
.formula .ok { color: var(--ok); }
.sources { display: grid; gap: 12px; }
.src { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.src .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.src .meta b { color: var(--ink); font-weight: 600; }
.src .cite { font-size: 13px; margin-bottom: 8px; }
.src .cite code { white-space: normal; overflow-wrap: anywhere; font-family: var(--mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.src a { color: var(--agent); }
.tbl { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 12px; }
.tbl th, .tbl td { padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { position: sticky; top: 0; background: var(--soft); color: var(--muted); font-weight: 500; text-align: right; }
.tbl th:first-child, .tbl td:first-child { text-align: left; white-space: normal; min-width: 220px; }
.tbl td { text-align: right; font-family: var(--mono); }
.tbl td:first-child { font-family: var(--sans); }
.tbl tr.cited td { background: color-mix(in oklab, var(--hl) 35%, transparent); }
.tbl td.cell { background: var(--hl); color: var(--hl-ink); font-weight: 700; outline: 2px solid var(--ink); outline-offset: -2px; }
.check { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.check input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--ok); }
.note { width: 100%; min-width: 120px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--card); color: var(--ink); font: inherit; font-size: 12px; }
.tip { position: fixed; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 8px 24px #0002; opacity: 0; transition: opacity .1s; z-index: 10; }
.tip.on { opacity: 1; }
.howto { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-top: 16px; font-size: 13px; }
.howto ol { margin: 6px 0 0; padding-left: 18px; }
.foot { color: var(--muted); font-size: 12px; margin-top: 24px; }
.queue { display: grid; gap: 8px; }
.sc { border-collapse: collapse; font-size: 13px; } .sc th, .sc td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.ask { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; overflow-wrap: anywhere; }
.ask.yes { border-color: var(--ok); } .ask.no { border-color: var(--bad); }
.ask .q { font-size: 15px; } .ask ul { margin: 0; padding-left: 18px; } .ask .why { color: var(--muted); font-size: 12px; }
.ask.auto { border-color: var(--ok); } .ask .shot { display: grid; gap: 4px; } .ask .shot img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.ask .btns { display: flex; gap: 8px; flex-wrap: wrap; } .ask .btns button[aria-pressed=true] { outline: 2px solid currentColor; }
.qi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 13px; overflow-wrap: anywhere; }
.qi .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
details summary { cursor: pointer; font-size: 13px; }
.story { display: grid; gap: 10px; max-width: 78ch; font-size: 14px; margin: 6px 0 4px; }
.story p { margin: 0; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.gloss { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; margin: 8px 0 0; }
.gloss dt { font-weight: 600; } .gloss dd { margin: 0; color: var(--muted); }
.cap2 { font-size: 12px; color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.c-q { width: 8%; } .c-f { width: 12%; } .c-a { width: 14%; } .c-x { width: 14%; } .c-m { width: 8%; } .c-h { width: 18%; } .c-c { width: 11%; } .c-n { width: 15%; }
@media (max-width: 720px) {
  .vals .hide-sm { display: none; } .vals col.hide-sm { width: 0; }
  .c-q { width: 18%; } .c-f { width: 24%; } .c-a { width: 28%; } .c-m { width: 14%; } .c-c { width: 16%; }
  .vals td.num { font-size: 11px; } .vals .full { display: none; } .vals .abbr { display: inline; } .vals th, .vals td { padding: 8px 6px; } .check { font-size: 0; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tip" id="tip"></div>
<script>
const D = __DATA__;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const usd = (v) => v == null ? "–" : (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("en-US");
const short = (v) => v == null ? "–" : (Math.abs(v) >= 1e9 ? `$${(v / 1e9).toFixed(2)}B` : `$${(v / 1e6).toFixed(0)}M`);
const qLabel = (p) => p;  // fiscal year, e.g. FY2026
const KEY = `ledger-handcheck-${D.name}`;
const key = (v) => `${v.ticker}|${v.field}|${v.period}`;
let checks = {};
try { checks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(checks)); } catch (e) {} };
const blocked = D.exceptions.filter((e) => e.severity === "block").map((e) => e.ticker);
const state = { company: blocked[0] || D.tickers[0], field: "all", show: "all", open: new Set() };

function tiles() {
  const c = D.counts, todo = D.values.filter((v) => v.check && !machineOk(v)), done = todo.filter((v) => checks[key(v)]?.verified).length;
  return `<div class="tiles">
    <div class="tile"><div class="n">${c.filings}</div><div class="l">filings read by agents</div></div>
    <div class="tile"><div class="n">${c.extractions}</div><div class="l">cells cited (table, row, column, text)</div></div>
    <div class="tile"><div class="n">${c.values}</div><div class="l">fiscal-year values</div></div>
    <div class="tile ${c.agree === c.values ? "good" : ""}"><div class="n">${c.agree}/${c.values}</div><div class="l">agree with XBRL (SEC answer key)</div></div>
    <div class="tile"><div class="n">${c.open_exceptions}</div><div class="l">open exceptions (block or warn) · ${c.info_notes} info note${c.info_notes === 1 ? "" : "s"}</div></div>
    <div class="tile ${done === todo.length ? "good" : ""}"><div class="n" id="done-n">${done}/${todo.length}</div><div class="l">numbers only you can confirm (the rest: XBRL agrees, or the machine confirmed the cell)</div></div>
  </div>`;
}

function chart(field) {
  const vs = D.years.map((y) => D.values.find((v) => v.ticker === state.company && v.field === field && v.period === y));
  const all = vs.flatMap((v) => v ? [v.value, v.ref] : []).filter((x) => x != null);
  const hi = Math.max(...all, 1), lo = Math.min(0, ...all);
  const W = 300, H = 150, L = 4, B = 18, T = 8, bw = (W - L) / vs.length;
  const y = (v) => T + (H - B - T) * (1 - (v - lo) / (hi - lo || 1));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(D.field_label[field])}: agent vs XBRL by fiscal year">`;
  [0.5, 1].forEach((f) => s += `<line class="grid" x1="0" x2="${W}" y1="${y(hi * f)}" y2="${y(hi * f)}"/><text x="2" y="${y(hi * f) - 3}">${short(hi * f)}</text>`);
  vs.forEach((v, i) => {
    const x = L + i * bw, w = bw * 0.58;
    if (v) {
      const bad = v.label === "unresolved" && !v.decision;
      s += `<rect class="bar ${bad ? "bad" : ""}" x="${x + (bw - w) / 2}" y="${Math.min(y(v.value), y(0))}" width="${w}" height="${Math.max(1, Math.abs(y(v.value) - y(0)))}" rx="2"/>`;
      if (v.ref != null) s += `<circle class="mark" cx="${x + bw / 2}" cy="${y(v.ref)}" r="4"/>`;
      s += `<rect class="hit" data-k="${key(v)}" x="${x}" y="0" width="${bw}" height="${H}"/>`;
    }
    if (i === 0 || i === vs.length - 1 || i % 2 === 1) s += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${qLabel(D.years[i])}</text>`;
  });
  const agree = vs.filter((v) => v && v.label === "agree").length;
  return `<div class="chart"><h3>${esc(D.field_label[field])} <span>${agree}/${vs.filter(Boolean).length} agree</span></h3>${s}</svg></div>`;
}

function formula(v) {
  if (v.value == null) return "";
  const by = Object.fromEntries(v.sources.map((s) => [s.field, s]));
  const lines = v.sources.filter((s) => s.field.startsWith("cost_of_revenue"));  // one total line, or the cost lines added up
  const cor = lines.reduce((a, s) => a + s.value, 0);
  const calc = v.field === "opex" ? by.revenue.value - cor - by.operating_income.value : v.sources[0].value;
  const body = v.field === "opex"
    ? `${usd(v.value)} <span class="eq">=</span> ${usd(by.revenue.value)} <span class="eq">revenue −</span> ${usd(cor)} <span class="eq">cost of revenue${lines.length > 1 ? ` (${lines.length} lines added)` : ""} −</span> ${usd(by.operating_income.value)} <span class="eq">operating income</span>`
    : `${usd(v.value)} <span class="eq">=</span> ${esc(v.sources[0].cell)} × ${v.sources[0].scale.toLocaleString("en-US")}`;
  return `<div class="formula">${body} ${calc === v.value ? `<span class="ok">✓ adds up</span>` : `<span style="color:var(--bad)">✗ arithmetic gives ${usd(calc)}</span>`}</div>`;
}

function miniTable(src) {
  const t = D.tables[src.table];
  if (!t) return "";
  const ci = t.columns.indexOf(src.col);
  const head = `<tr><th>${esc(t.unit || "")}</th>${t.columns.map((c, i) => `<th${i === ci ? ' style="color:var(--ink)"' : ""}>${esc(c)}</th>`).join("")}</tr>`;
  const body = t.rows.map((r) => {
    const cited = r.l === src.row;
    const cells = t.columns.map((_, i) => {
      const c = r.c.find((x) => x[0] === i);
      return `<td class="${cited && i === ci ? "cell" : ""}">${c ? esc(c[1]) : ""}</td>`;
    }).join("");
    return `<tr class="${cited ? "cited" : ""}"${cited ? ' data-cited="1"' : ""}><td>${esc(r.l)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="tbl"><table>${head}${body}</table></div>`;
}

function detail(v) {
  const srcs = v.sources.map((s) => `<div class="src">
      <div class="meta"><span><b>${s.form}</b> for the period ended <b>${s.doc_period}</b>, filed ${s.filed}</span><span>accession ${s.accession}</span><span>prompt ${s.prompt}, confidence ${s.confidence}</span></div>
      <div class="cite">Table <code>${s.table_id}</code> · row <code>${esc(s.row)}</code> · column <code>${esc(s.col)}</code> · cell <code>${esc(s.cell)}</code> × ${esc(s.unit)}${s.unit_source !== "table" ? ` <span class="pill na">unit from ${s.unit_source}</span>` : ""}
        → <b>${usd(s.value)}</b> for ${s.start} to ${s.end}. <a href="${esc(s.deep)}" target="_blank" rel="noopener">Open the filing at this row ↗</a></div>
      ${s.notes ? `<div class="cite" style="color:var(--muted)">Agent note: ${esc(s.notes)}</div>` : ""}
      ${s.machine?.img ? `<img src="${esc(s.machine.img)}" alt="The filing, with the cited cell boxed" loading="lazy" style="max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff">` : miniTable(s)}
    </div>`).join("");
  const basisNote = v.label === "not_reported" ? `<div style="font-size:13px;margin-bottom:8px"><b>Left blank.</b> This 10-K shows neither a cost-of-revenue line nor cost lines to add up, so opex (revenue − cost of revenue − operating income) can't be computed.</div>`
    : v.label === "definition_gap" ? `<div style="font-size:13px;margin-bottom:8px"><b>XBRL counts cost of revenue differently.</b> Revenue and operating income both agree with XBRL, so the gap comes only from which lines count as cost of revenue. This 10-K has no total line; ours adds the delivery-cost lines below, as standard tools do. Confirm those lines once on the company's "cost lines" card; no decision is needed per year.</div>`
    : v.basis === "restated" ? `<div style="font-size:13px;margin-bottom:8px"><b>Restated.</b> A later 10-K changed this year's figure; the newest one is used. As first reported: ${usd(v.first_reported)}.</div>` : "";
  const why = v.why ? `<div style="font-size:13px;margin-bottom:8px"><b>The filing explains:</b> “${esc(v.why.text)}” <a href="${esc(v.why.url)}" target="_blank" rel="noopener">Read it in the filing ↗</a></div>` : "";
  if (v.value == null) return basisNote;
  return basisNote + why + `<div style="font-size:13px;margin-bottom:8px"><b>${esc(D.method_label[v.method] || v.method)}.</b> XBRL (SEC answer key): ${usd(v.ref)} from <code>${esc(v.ref_concept || "–")}</code>, ${v.ref_accession || ""}. Difference ${v.ref == null ? "–" : usd(v.value - v.ref)}.</div>
    ${formula(v)}<div class="sources">${srcs}</div>`;
}

function rows() {
  const order = (v) => D.fields.indexOf(v.field) * 100 + D.years.indexOf(v.period);
  const list = [...D.values].sort((a, b) => order(a) - order(b)).filter((v) => v.ticker === state.company && (state.field === "all" || v.field === state.field)
    && (state.show === "all" || (state.show === "todo" ? !checks[key(v)]?.verified : v.label !== "agree")));
  return list.map((v) => {
    const k = key(v), c = checks[k] || {}, open = state.open.has(k);
    const basisPill = v.basis === "restated" ? ` <span class="pill na" title="A later 10-K changed this figure. As first reported: ${usd(v.first_reported)}">restated</span>` : "";
    const pill = v.decision ? `<span class="pill na" title="${esc(v.decision.reason)}">${{accept: "accepted", override: "overridden", reject: "rejected"}[v.decision.kind]} by ${esc(v.decision.reviewer)}</span>` : v.label === "not_reported" ? `<span class="pill na">not reported</span>` : v.label === "agree" ? `<span class="pill ok" title="agrees with XBRL"><span class="full">agree</span><span class="abbr">✓</span></span>` : v.label === "no_reference" ? `<span class="pill na">no XBRL</span>` : v.label === "definition_gap" ? `<span class="pill na" title="XBRL counts cost of revenue differently">XBRL defines differently</span>` : `<span class="pill bad">${v.label}</span>`;
    return `<tr class="main ${open ? "open" : ""} ${c.verified ? "done" : ""}" data-k="${k}">
      <td><span class="caret">▸</span> ${esc(v.period)}<div style="color:var(--muted);font-size:11px">ended ${esc(v.period_end)}</div></td><td>${esc(D.field_label[v.field])}</td>
      <td class="num"><span class="full">${usd(v.value)}</span><span class="abbr">${short(v.value)}</span></td><td class="num hide-sm">${usd(v.ref)}</td><td>${pill}${basisPill}</td>
      <td class="hide-sm" style="color:var(--muted);font-size:12px">${esc(D.method_label[v.method] || v.method)} · ${v.sources.length} cell${v.sources.length > 1 ? "s" : ""}</td>
      <td>${v.check ? `<label class="check" onclick="event.stopPropagation()"><input type="checkbox" data-check="${k}" ${c.verified ? "checked" : ""} aria-label="Verified against filing"> verified</label>` : `<span style="color:var(--muted);font-size:12px">${v.value == null ? "–" : "XBRL agrees"}</span>`}</td>
      <td class="hide-sm" onclick="event.stopPropagation()"><input class="note" data-note="${k}" value="${esc(c.note || "")}" placeholder="note"></td>
    </tr>${open ? `<tr class="detail"><td colspan="8">${detail(v)}</td></tr>` : ""}`;
  }).join("") || `<tr><td colspan="8" style="color:var(--muted)">Nothing in this view.</td></tr>`;
}

function seg(name, opts) {
  return `<div class="seg">${Object.entries(opts).map(([k, l]) => `<button data-${name}="${k}" aria-pressed="${state[name] === k}">${l}</button>`).join("")}</div>`;
}

function story() {
  const c = D.counts, block = D.exceptions.filter((e) => e.severity === "block").length, warn = D.exceptions.filter((e) => e.severity === "warn").length;
  return `<div class="story">
    <p><b>What this is.</b> Companies on the US stock market file an annual report (a <b>10-K</b>) with the SEC. AI readers opened ${c.filings} of these reports for ${D.tickers.join(", ")} and read, for each fiscal year, <b>revenue</b>, <b>capex</b> (money spent on buildings and equipment) and the two lines needed for <b>opex</b> (operating expenses: revenue − cost of revenue − operating income, all from the same report). For every number they wrote down exactly where they found it: the table, the row and the column.</p>
    <p><b>How we check them.</b> Companies also file a machine-readable copy of the same numbers, called <b>XBRL</b>. The AI never sees it, so it works as an answer key: ${c.agree} of ${c.values} numbers match it. Automatic rules also look for problems a person would spot: totals that don't add up, impossible values, sudden jumps.</p>
    <p><b>Your job.</b> The AI does the reading. A person decides what we stand behind. ${block ? `<b>${block} item${block > 1 ? "s" : ""} need${block > 1 ? "" : "s"} your decision</b> before this data can be released, plus ${warn} smaller warning${warn === 1 ? "" : "s"}.` : "Nothing is blocking."} Each item below says what happened and what to do. Your decision is recorded with your name and reason.</p>
    <ol class="steps">
      <li><b>Decide each item</b> in "Needs your decision": read the card, open the filing if needed, then accept, override or reject.</li>
      <li><b>Check the numbers</b> in "Check these numbers". The machine re-reads each cited cell from the real 10-K and shows it boxed. Green cards are done. A red card shows you exactly which cell to look at: answer yes or no.</li>
      <li><b>Download the hand-check</b> and save it as <code>golden/${D.name}-handcheck.json</code>.</li>
      ${D.stage ? `<li><b>Release</b>: <code>python -m ledger release ${D.release} --stage ${D.stage}</code>. It refuses until steps 1–3 are done.</li>` : ""}
    </ol>
    <details><summary>Words used on this page</summary><dl class="gloss">
      <dt>10-K</dt><dd>The annual report a company files with the SEC. It shows three fiscal years side by side.</dd>
      <dt>Cited cell</dt><dd>The exact table, row and column a number was copied from.</dd>
      <dt>XBRL</dt><dd>The machine-readable copy of a filing's numbers; our answer key.</dd>
      <dt>Fiscal year</dt><dd>The company's own year. NVIDIA's FY2026 ended 25 Jan 2026; Microsoft's ended 30 Jun 2026.</dd>
      <dt>Opex</dt><dd>Operating expenses: the costs below gross profit, such as R&amp;D and sales and admin. Revenue − cost of revenue − operating income.</dd>
      <dt>Restatement</dt><dd>When a later 10-K shows a different figure for a past year, for example after selling part of the business. The newest figure is used, and the first one is kept.</dd>
      <dt>Accept / override / reject</dt><dd>Accept: the number is right as it is. Override: replace it with the right number. Reject: ship it blank, with your reason.</dd>
    </dl></details>
  </div>`;
}

function decisions() {
  const sev = (s) => D.exceptions.filter((e) => e.severity === s);
  const item = (e) => {
    const r = D.rules[e.rule_id] || { title: "The AI's answer for this filing could not be used", plain: "The output was missing or didn't follow the required format.", action: "Tell the data owner; the filing needs to be re-run." };
    return `<div class="qi"><div class="top"><span class="pill ${e.severity === "info" ? "na" : "bad"}">${e.severity}</span><b>${esc(r.title)}</b></div>
      <div class="cap2">${esc(e.ticker)} · ${esc(D.field_label[e.field] || e.field || "")} ${e.period ? "· " + e.period : ""}</div>
      <div><b>What happened:</b> ${esc(r.plain)}</div><div><b>The numbers:</b> ${esc(e.message)}</div><div><b>What to do:</b> ${esc(r.action)}</div>
      <details><summary class="cap2">Technical detail</summary><div class="cap2">Rule <code>${esc(e.rule_id)}</code> · id <code>${esc(e.exception_id)}</code></div></details></div>`;
  };
  const block = sev("block"), warn = sev("warn"), info = sev("info");
  return `<h2>Needs your decision (${block.length} blocking)</h2>
    ${block.length ? `<div class="queue">${block.map(item).join("")}</div>` : `<p class="foot">Nothing blocking.</p>`}
    <p class="foot">Decide each with <code>python -m ledger review ${D.stage ? `--stage ${D.stage}` : `--ticker ${D.tickers.join(" ")}`} decide &lt;id&gt; accept|override|reject --reason "…" --by "Kenny Geiler"</code>.</p>
    <details><summary><b>${warn.length} warnings</b>: also need a decision, usually accept</summary><div class="queue" style="margin-top:8px">${warn.map(item).join("")}</div></details>
    <details style="margin-top:8px"><summary><b>${info.length} notes</b>: no decision needed</summary><div class="queue" style="margin-top:8px">${info.map(item).join("")}</div></details>`;
}

const WHY = {
  spot_check: () => "Random spot-check. XBRL agrees with this number; checking a few by hand tests that the matching works.",
  xbrl_differs: (v) => v.decision ? `XBRL disagrees and you ${{accept: "accepted", override: "overrode", reject: "rejected"}[v.decision.kind]} that. Now confirm the number itself is in the filing.`
    : v.label === "definition_gap" ? "XBRL counts cost of revenue differently, so it can't vouch for this number." : "XBRL disagrees, so it can't vouch for this number.",
};

const machineOk = (v) => v.sources.length && v.sources.every((s) => s.machine?.match);

function ask(v) {
  const k = key(v), c = checks[k] || {}, auto = machineOk(v);
  const line = (s) => `<b>“${esc(s.row)}”</b> under <b>“${esc(s.col)}”</b>: <b>${esc(s.cell)}</b> <a href="${esc(s.deep)}" target="_blank" rel="noopener">open the filing ↗</a>`;
  const shot = (s) => `<div class="shot"><div>${line(s)}${s.machine && !s.machine.match ? ` · <span style="color:var(--bad)">the page shows “${esc(s.machine.seen || "nothing")}” there</span>` : ""}</div>${s.machine?.img ? `<img src="${esc(s.machine.img)}" alt="The filing, with the cited cell boxed" loading="lazy">` : ""}</div>`;
  const total = v.sources.length > 1 ? `<span class="why">Revenue − cost of revenue − operating income = ${usd(v.value)}</span>` : `<span class="why">${esc(v.sources[0].unit)} → ${usd(v.value)}</span>`;
  const state = c.problem ? "no" : auto ? "auto" : c.verified ? "yes" : "";
  const head = auto
    ? `<span class="pill ok">✓ confirmed by machine</span> The 10-K, opened in Chrome, shows ${v.sources.length > 1 ? "each of these" : "this number"} exactly where cited (green box). Nothing for you to do.`
    : `<span class="pill bad">needs you</span> The machine couldn't confirm this. Look at the boxed cell and answer.`;
  const btns = auto
    ? `<button class="btn" data-answer="no" data-k="${k}" aria-pressed="${state === "no"}">Something's wrong</button>`
    : `<button class="btn" data-answer="yes" data-k="${k}" aria-pressed="${state === "yes"}">Yes, it matches</button><button class="btn" data-answer="no" data-k="${k}" aria-pressed="${state === "no"}">No</button>`;
  return `<div class="ask ${state}"><div class="top"><b>${esc(v.ticker)} · ${esc(D.field_label[v.field])} · ${esc(v.period)}</b></div>
    <div class="q">${head}</div>${auto ? `<details><summary>Show where (${v.sources.length} cell${v.sources.length > 1 ? "s" : ""})</summary>${v.sources.map(shot).join("")}</details>` : v.sources.map(shot).join("")}${total}<div class="why">Why this one: ${WHY[v.check](v)}</div>
    <div class="btns">${btns}${c.problem && c.note ? `<span class="why">You wrote: ${esc(c.note)}</span>` : ""}</div></div>`;
}

function checkList() {
  const todo = D.values.filter((v) => v.check), auto = todo.filter(machineOk).length, you = todo.filter((v) => !machineOk(v));
  const done = you.filter((v) => checks[key(v)]?.verified || checks[key(v)]?.problem).length;
  return `<h2 id="check">Check these numbers: ${auto} of ${todo.length} confirmed by machine, ${you.length ? `${done}/${you.length} answered by you` : "none need you"}</h2>
    <p class="foot">Each number below was re-read from the real 10-K, opened in Chrome the way you'd see it: the cited row (yellow), its column header (blue) and the cell (green if it shows the cited number, red if not). Only red ones need you.</p>
    <p class="foot">${D.values.filter((v) => v.label === "agree").length - todo.filter((v) => v.check === "spot_check").length} other numbers match XBRL, a separate copy the company files, so two sources already agree on them.</p>
    <div class="queue">${todo.map(ask).join("")}</div>
    ${you.length ? `<p><button class="btn primary" id="export">Download hand-check</button></p>` : ""}`;
}

const SC = { ticker: "Company", filings: "10-Ks", agent: "Read by", agent_minutes: "Agent minutes", tokens: "Tokens", retries: "Retries",
  values: "Values", agree: "Agree with XBRL", explained_by_code: "Explained by code", cells_confirmed: "Cells confirmed on the 10-K", for_a_person: "Blocking, for you", warnings: "Warnings" };
function scoreTable() {
  return `<h2>What each company cost</h2><p class="foot">The pipeline's measure is what the next company costs: agent time, and what still needs a person. Code changes per company are logged in docs/INGESTION.md.</p>
    <div class="tbl"><table class="sc"><tr>${Object.values(SC).map((l) => `<th>${l}</th>`).join("")}</tr>${D.scorecard.map((r) => `<tr>${Object.keys(SC).map((k) => `<td>${esc(String(k === "tokens" ? r[k].toLocaleString("en-US") : r[k]))}</td>`).join("")}</tr>`).join("")}</table></div>`;
}

function render() {
  $("#app").innerHTML = `
    <h1>${esc(document.title)}</h1>
    ${story()}
    ${tiles()}
    ${scoreTable()}
    ${decisions()}
    ${checkList()}
    <h2>Company</h2>
    <div class="toolbar">${seg("company", Object.fromEntries(D.tickers.map((t) => [t, `${t}${blocked.includes(t) ? " · needs decisions" : ""}`])))}</div>
    <h2>Agent vs XBRL, by fiscal year · ${esc(state.company)}</h2>
    <div class="charts">${D.fields.map(chart).join("")}</div>
    <div class="legend"><span><span class="sw" style="background:var(--agent)"></span>Agent value (read from the filing)</span><span><span class="ring"></span>XBRL value (answer key)</span><span><span class="sw" style="background:var(--bad)"></span>Disagreement</span></div>
    <h2>Every value (for reference)</h2>
    <div class="toolbar">${seg("field", { all: "All", ...D.field_label })}${seg("show", { all: "All", todo: "Not yet checked", bad: "Disagreements" })}
      <span class="spacer"></span><button class="btn" id="expand">Expand all</button></div>
    <table class="vals"><colgroup><col class="c-q"><col class="c-f"><col class="c-a"><col class="c-x hide-sm"><col class="c-m"><col class="c-h hide-sm"><col class="c-c"><col class="c-n hide-sm"></colgroup>
      <thead><tr><th>Year</th><th>Field</th><th style="text-align:right">Agent</th><th class="hide-sm" style="text-align:right">XBRL</th><th>Match</th><th class="hide-sm">How it was built</th><th>Your check</th><th class="hide-sm">Note</th></tr></thead>
      <tbody id="rows">${rows()}</tbody></table>
    <p class="foot">${D.release ? `Release candidate ${D.release} · ` : ""}generated ${D.generated} UTC by <code>python -m ledger report ${D.stage ? `--stage ${D.stage}` : `--ticker ${D.tickers.join(" ")}`}</code> · hand-check record saved in this browser under “${KEY}”.</p>`;
  document.querySelectorAll("tr.detail [data-cited]").forEach((r) => r.closest(".tbl").scrollTop = r.offsetTop - 40);
}

function updateTiles() { const t = D.values.filter((v) => v.check && !machineOk(v)); $("#done-n").textContent = `${t.filter((v) => checks[key(v)]?.verified).length}/${t.length}`; }

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-field],[data-show],[data-company]");
  if (b) { if (b.dataset.company) { state.company = b.dataset.company; state.open.clear(); } if (b.dataset.field) state.field = b.dataset.field; if (b.dataset.show) state.show = b.dataset.show; return render(); }
  if (e.target.closest("#expand")) { const vis = [...document.querySelectorAll("tr.main")].map((r) => r.dataset.k); const all = vis.every((k) => state.open.has(k)); vis.forEach((k) => all ? state.open.delete(k) : state.open.add(k)); return render(); }
  if (e.target.closest("#export")) {
    const out = { stage: D.stage, release: D.release, exported_at: new Date().toISOString(), checker: prompt("Your name, for the record:", "Kenny Geiler") || "",
      values: D.values.map((v) => ({ ticker: v.ticker, field: v.field, period: v.period, value: v.value, input_hash: v.input_hash, ...(checks[key(v)] || { verified: false }) })) };
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
    a.download = `${D.name}-handcheck.json`; a.click(); return;
  }
  const ans = e.target.closest("[data-answer]");
  if (ans) {
    const k = ans.dataset.k, yes = ans.dataset.answer === "yes";
    const note = yes ? (checks[k]?.note || "") : (prompt("What does the filing show instead?", checks[k]?.note || "") ?? checks[k]?.note ?? "");
    checks[k] = { ...(checks[k] || {}), verified: yes, problem: !yes, note, checked_at: new Date().toISOString() }; save(); return render();
  }
  const hit = e.target.closest(".hit");
  if (hit) { state.open.add(hit.dataset.k); state.field = "all"; state.show = "all"; render(); document.querySelector(`tr.main[data-k="${CSS.escape(hit.dataset.k)}"]`)?.scrollIntoView({ block: "center" }); return; }
  const r = e.target.closest("tr.main");
  if (r) { state.open.has(r.dataset.k) ? state.open.delete(r.dataset.k) : state.open.add(r.dataset.k); render(); }
});
document.addEventListener("change", (e) => {
  const c = e.target.closest("[data-check]");
  if (c) { const k = c.dataset.check; checks[k] = { ...(checks[k] || {}), verified: c.checked, checked_at: new Date().toISOString() }; save(); c.closest("tr").classList.toggle("done", c.checked); updateTiles(); }
});
document.addEventListener("input", (e) => {
  const n = e.target.closest("[data-note]");
  if (n) { const k = n.dataset.note; checks[k] = { ...(checks[k] || {}), note: n.value }; save(); }
});
const tip = $("#tip");
document.addEventListener("pointermove", (e) => {
  const h = e.target.closest(".hit");
  if (!h) return tip.classList.remove("on");
  const v = D.values.find((x) => key(x) === h.dataset.k);
  tip.innerHTML = `<b>${esc(D.field_label[v.field])} ${esc(v.period)}</b><br>Agent ${short(v.value)} · XBRL ${short(v.ref)}<br><span style="color:var(--muted)">click for evidence</span>`;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 180) + "px"; tip.style.top = e.clientY + 12 + "px"; tip.classList.add("on");
});
render();
</script>
</body>
</html>
