<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<title>DATAHQ</title>
<style>
  /* Plain pages, whitespace instead of borders. One accent (ink blue); red only for a failure. */
  :root {
    --bg: #fafbf8; --fg: #1b1e1c; --muted: #5f6662; --faint: #d9ded8; --accent: #1e6b4e; --bad: #b5452e; --bar: #f1f3ef; --row: #f3f5f1;
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181a; --fg: #e6e9e4; --muted: #9aa39d; --faint: #2a2f2c; --accent: #5fbf95; --bad: #e07a64; --bar: #1b1f21; --row: #1a1e20; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: -999px; top: .5rem; background: var(--bg); padding: .4rem .7rem; z-index: 30; }
  .skip:focus { left: .5rem; }
  h1, h2, h3 { text-wrap: balance; }
  button, a, select, input, label { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:hover { opacity: .8; }
  .btn:hover { opacity: .9; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.45 var(--font); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 110rem; margin: 0 auto; padding: 0 max(16px, 2vw) 4rem; }
  .bar { background: var(--bar); margin: 0 calc(-1 * max(16px, 2vw)); padding: 0 max(16px, 2vw); }
  nav { display: flex; gap: 1.1rem; align-items: center; padding-block: .55rem; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; max-width: 110rem; margin: 0 auto; }
  nav .search { width: 11rem; flex: 0 0 auto; border: 1px solid var(--faint); border-radius: 4px; padding: .3rem .55rem; background: var(--bg); font-size: .85rem; }
  main { padding-top: 1.25rem; }
  nav .brand { font-weight: 700; letter-spacing: .08em; color: var(--fg); margin-right: .5rem; }
  nav .sp { margin-left: auto; }
  nav a { color: var(--muted); }
  nav a.on { color: var(--fg); }
  nav .me { margin-left: 1rem; flex: 0 0 auto; }
  nav .me input { width: 9rem; border: 0; border-bottom: 1px solid var(--faint); background: none; padding: .1rem 0; font-size: .82rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
  h2 { font-size: .95rem; font-weight: 600; margin: 0 0 .5rem; }
  p { margin: 0; }
  .lede { color: var(--muted); max-width: 62ch; margin-top: .35rem; }
  .lede b { color: var(--fg); font-weight: 600; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .small { font-size: .82rem; }
  .mono { font-family: var(--mono); font-size: .82rem; }
  .stack { display: grid; gap: 2rem; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 3rem; }
  .two > *, .stack > * { min-width: 0; }
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); gap: 1.5rem; }
  .fig .n { font-size: 1.6rem; line-height: 1.15; font-variant-numeric: tabular-nums; font-weight: 500; }
  .fig .l, .fig .s { color: var(--muted); font-size: .82rem; }
  .bars { display: grid; gap: .55rem; }
  .bar { display: grid; grid-template-columns: minmax(8rem, 12rem) 1fr auto; gap: .75rem; align-items: center; }
  .bar .v { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { height: 8px; border-radius: 4px; background: var(--faint); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .track i.bad { background: var(--bad); }
  .track i.note { background: var(--muted); opacity: .5; }
  .track i + i { margin-left: 0; }
  .scroll { overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; font-size: .86rem; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: .78rem; padding: .35rem .75rem .35rem 0; white-space: nowrap; background: var(--bg); position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--faint); }
  td { padding: .3rem .75rem .3rem 0; vertical-align: top; border-bottom: 1px solid var(--faint); }
  tbody tr:hover td { background: var(--row); }
  table th:first-child, table td:first-child { position: sticky; left: 0; background: var(--bg); z-index: 1; }
  tbody tr:hover td:first-child { background: var(--row); }
  td.n, th.n { text-align: right; }
  td.n { font-weight: 500; }
  td.n .note { font-weight: 400; }
  tr.click { cursor: pointer; }
  tr.click:hover td { color: var(--accent); }
  tr.open td { color: var(--accent); }
  .detail td { padding: .25rem 0 1.25rem; color: var(--fg); }
  .src { display: grid; gap: .3rem; margin-bottom: .9rem; max-width: 60rem; }
  .src img { max-width: min(100%, 40rem); border-radius: 4px; margin-top: .3rem; }
  .step { display: grid; grid-template-columns: 11rem 1fr; gap: 1.5rem; }
  .step > * { min-width: 0; }
  .step .head .state { font-size: .82rem; color: var(--muted); margin-top: .15rem; }
  @media (max-width: 44rem) { .step { grid-template-columns: 1fr; gap: .5rem; } .wide { display: none; } .bar { grid-template-columns: 1fr auto; row-gap: .25rem; } .bar .track { grid-column: 1 / -1; } }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  select, input[type=text] { background: var(--bg); border: 1px solid var(--faint); border-radius: 4px; padding: .3rem .5rem; font-size: .86rem; }
  textarea { width: 100%; min-height: 28rem; background: var(--bg); border: 1px solid var(--faint); border-radius: 6px; padding: .75rem; font: .82rem/1.55 var(--mono); }
  textarea[readonly] { border-color: transparent; padding-inline: 0; resize: none; }
  .btn { background: var(--accent); color: #fff; border-radius: 4px; padding: .32rem .8rem; font-size: .86rem; font-weight: 500; }
  .btn[disabled] { opacity: .4; cursor: default; }
  ul.plain { margin: .2rem 0 0; padding-left: 1.1rem; }
  ul.plain li { margin: .15rem 0; }
  .picks { display: flex; flex-wrap: wrap; gap: .25rem .8rem; font-size: .84rem; }
  .picks label { white-space: nowrap; cursor: pointer; }
  .controls { display: grid; gap: 1.1rem; }
  .controls .k { color: var(--muted); font-size: .8rem; margin-bottom: .2rem; }
  svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
  .tip { position: fixed; pointer-events: none; background: var(--bg); box-shadow: 0 2px 12px rgba(0,0,0,.18); border-radius: 6px; padding: .35rem .6rem; font-size: .8rem; }
  pre.raw { white-space: pre-wrap; word-break: break-word; font: .78rem/1.5 var(--mono); max-height: 30rem; overflow: auto; margin: .5rem 0 0; }
  .msg { color: var(--muted); padding: 2rem 0; }
  .pagehead { display: grid; gap: .3rem; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(18rem, 24rem); gap: 1.5rem; align-items: start; }
  @media (max-width: 52rem) { .split { grid-template-columns: 1fr; } }
  .sechead { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .6rem; }
  .sechead h2 { margin: 0; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: .45rem 1rem; font-variant-numeric: tabular-nums; }
  table.grid td.cell { cursor: pointer; }
  table.grid td.cell:hover { color: var(--accent); }
  table.grid .note { font-size: .74rem; color: var(--muted); white-space: normal; max-width: 9rem; margin-left: auto; }
  .brk { white-space: pre-wrap; word-break: break-word; }
  table.heat td.c { padding-inline: .5rem; }
  .mk { display: inline-block; width: 1.1em; text-align: center; margin-left: .25rem; font-weight: 600; }
  .mk.t { color: var(--accent); }
  .mk.u { color: var(--muted); opacity: .55; }
  .mk.x { color: var(--bad); }
  table.heat td.c .note { font-size: .74rem; color: var(--muted); }
  table.heat th, table.heat td { padding-right: .5rem; }
  table.heat td.w { width: 9rem; }
  .mini { display: grid; grid-template-columns: 5rem auto; gap: .5rem; align-items: center; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mini i { display: block; height: 6px; border-radius: 3px; background: var(--accent); }
  .track { position: relative; }
  .track i { position: absolute; left: 0; top: 0; }
  .track i.rest { background: var(--faint); filter: brightness(.93); }
  .dots { display: grid; gap: .35rem; }
  .dotrow { display: grid; grid-template-columns: 6rem 1fr minmax(8rem, auto); gap: .75rem; align-items: center; font-size: .82rem; }
  .dotrow .v { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 44rem) { .dotrow { grid-template-columns: 4.5rem 1fr; } .dotrow .v { grid-column: 1 / -1; text-align: left; } }
  .strip { background: var(--bar); margin: 0 calc(-1 * max(16px, 2vw)); padding: .9rem max(16px, 2vw); gap: 1rem 2rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.5rem), 1fr)); }
  .strip .fig .n { font-size: 1.25rem; white-space: nowrap; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(100%, 30rem); background: var(--bg); box-shadow: -8px 0 30px rgba(0,0,0,.12); padding: 1.25rem 1.5rem 2rem; overflow: auto; overscroll-behavior: contain; z-index: 20; }
  .drawer .close { position: absolute; top: .6rem; right: .9rem; font-size: 1.4rem; color: var(--muted); }
  .drawer h3 { font-size: 1rem; margin: 0 1.5rem .6rem 0; }
  .panel h3 { font-size: .95rem; margin: 0 0 .5rem; }
  table.heat td.moved { box-shadow: inset 3px 0 0 var(--accent); }
  .badge { font: 500 .7rem/1 var(--font); color: var(--muted); padding: .1rem .3rem; border-radius: 3px; background: var(--bar); }
  .badge:hover { background: color-mix(in srgb, var(--accent) 24%, transparent); }
  .stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1.5rem 2rem; }
  .stage ul.plain { padding-left: 0; list-style: none; }
  .stage li { margin: .2rem 0; }
  .steps { display: grid; gap: .8rem; }
  .stp { display: grid; grid-template-columns: 5rem 1fr; gap: 1rem; color: var(--muted); }
  .stp.done, .stp.running { color: var(--fg); }
  .stp .state { font-size: .8rem; color: var(--muted); }
  .stp.running .state { color: var(--accent); }
  .views { display: grid; grid-template-columns: 16rem 1fr; gap: 1.5rem; align-items: start; }
  .viewlist { display: flex; flex-direction: column; gap: .15rem; margin-top: .5rem; }
  .viewrow { display: flex; flex-direction: column; padding: .35rem .5rem; border-radius: 4px; color: var(--fg); }
  .viewrow.on { background: var(--faint); }
  .barlist { display: flex; flex-direction: column; gap: .35rem; max-width: 48rem; }
  .barlist .bar { display: grid; grid-template-columns: 12rem 1fr 7rem; gap: .6rem; align-items: center; font-size: .9rem; }
  .barlist .track { height: .7rem; background: var(--faint); border-radius: 2px; overflow: hidden; }
  .barlist .track i { display: block; height: 100%; background: var(--accent); }
  .barlist .n { text-align: right; font-variant-numeric: tabular-nums; }
  .form { display: flex; flex-direction: column; gap: .45rem; }
  .form label { display: grid; grid-template-columns: 6rem 1fr; gap: .5rem; align-items: center; font-size: .85rem; }
  .form input, .form select { border: 1px solid var(--faint); border-radius: 4px; padding: .25rem .45rem; background: var(--bg); font-size: .85rem; }
  @media (max-width: 700px) { .views { grid-template-columns: 1fr; } .barlist .bar { grid-template-columns: 6rem 1fr 5rem; } }
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="wrap">
  <div class="bar"><nav>
    <a class="brand" href="#flow">DATAHQ</a>
    <a href="#flow" data-nav="flow">Flow</a>
    <input class="search" id="jump" name="jump" type="text" list="tickers" placeholder="Ticker or company…" aria-label="Jump to a company" autocomplete="off" spellcheck="false">
    <datalist id="tickers"></datalist>
    <a href="#data" data-nav="data">Dataset</a>
    <a href="#attribution" data-nav="attribution">Attribution</a>
    <a href="#views" data-nav="views">Views</a>
    <a href="#status" data-nav="status">Status</a>
    <a href="#releases" data-nav="releases">Releases</a>
    <a href="#agents" data-nav="agents">Agents</a>
    <span class="sp me muted small">signed as <input id="me" name="signer" type="text" aria-label="Your name, logged on every model or prompt change" autocomplete="name"></span>
  </nav></div>
  <main id="view" tabindex="-1"><p class="msg">Loading…</p></main>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k === 'class') el.className = v; else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
};
const int = (n) => (n == null || n === '' ? '—' : Number(n).toLocaleString('en-US'));
const usd = (n) => {
  if (n == null || n === '') return '—';
  const m = Number(n) / 1e6;
  return (m < 0 ? '−' : '') + '$' + Math.abs(m).toLocaleString('en-US', {maximumFractionDigits: Math.abs(m) >= 100 ? 0 : 1}) + 'M';
};
const day = (s) => (s ? new Date(String(s).slice(0, 10) + 'T00:00:00Z').toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'}) : '—');
const when = (s) => (s ? new Date(s).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : '—');
const compact = (n) => new Intl.NumberFormat('en', {notation: 'compact', maximumFractionDigits: 1}).format(n || 0);
const LABEL = {revenue: 'Revenue', capex: 'Capex', opex: 'Opex', cost_of_revenue: 'Cost of revenue', cost_of_revenue_part: 'Cost line', operating_income: 'Operating income'};
const XBRL = {agree: 'matches SEC data', definition_gap: 'differs from SEC data, explained by code', unresolved: 'differs from SEC data, decided by a person', not_reported: 'not reported'};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
let me = 'Kenny Geiler';
try { me = localStorage.getItem('datahq-me') || me; } catch {}
$('#me').value = me;
$('#me').addEventListener('input', (e) => { me = e.target.value; try { localStorage.setItem('datahq-me', me); } catch {} });
let NAMES = {};
api('/api/data?t=&f=none').then((d) => { NAMES = d.names; $('#tickers').replaceChildren(...Object.entries(NAMES).map(([t, n]) => h('option', {value: t}, n))); });
$('#jump').addEventListener('change', (e) => { const v = e.target.value.trim().toUpperCase(); const t = NAMES[v] ? v : Object.keys(NAMES).find((k) => NAMES[k].toUpperCase() === v); if (t) { e.target.value = ''; go(`data?t=${t}&f=ai_capex,capex`); } });

function table(cols, rows, {key, onRow, detail} = {}) {
  const tb = h('tbody');
  const draw = (list) => {
    tb.replaceChildren();
    for (const r of list) {
      const tr = h('tr', {class: onRow || detail ? 'click' : null, tabindex: onRow || detail ? 0 : null, role: onRow || detail ? 'button' : null, onkeydown: onRow || detail ? (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tr.click(); } } : null}, cols.map((c) => h('td', {class: [c.n && 'n', c.wide && 'wide'].filter(Boolean).join(' ') || null}, c.f ? c.f(r) : r[c.k] ?? '—')));
      tb.append(tr);
      if (onRow) tr.addEventListener('click', () => onRow(r));
      if (detail) tr.addEventListener('click', () => {
        const next = tr.nextElementSibling;
        if (next && next.classList.contains('detail')) { next.remove(); tr.classList.remove('open'); return; }
        tr.classList.add('open');
        tr.after(h('tr', {class: 'detail'}, h('td', {colspan: cols.length}, detail(r))));
      });
    }
  };
  let sort = null, dir = 1;
  const head = h('tr', {}, cols.map((c) => {
    const th = h('th', {class: [c.n && 'n', c.wide && 'wide'].filter(Boolean).join(' ') || null});
    if (c.sort === false) th.append(c.t);
    else th.append(h('button', {type: 'button', style: 'color:inherit', onclick: () => {
      dir = sort === c ? -dir : (c.n ? -1 : 1); sort = c;
      const v = c.s || ((r) => r[c.k]);
      draw([...rows].sort((a, b) => { const x = v(a), y = v(b); if (x == null || x === '') return 1; if (y == null || y === '') return -1; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * dir; }));
    }}, c.t));
    return th;
  }));
  draw(rows);
  return h('div', {class: 'scroll'}, h('table', {}, h('thead', {}, head), tb));
}

function bars(list) {
  return h('div', {class: 'bars'}, list.map((b) => h('div', {class: 'bar'}, h('span', {}, b.name),
    h('div', {class: 'track'}, h('i', {class: b.cls || null, style: `width:${Math.max(0, Math.min(100, b.pct))}%`})), h('span', {class: 'v'}, b.v))));
}

const KIND = {restated: 'Restated', jump: 'Big move', capex_intensity: 'Capex vs revenue', opex_over_revenue: 'Opex above revenue', row_switch: 'Line renamed', other: 'Note'};
function attributionTable(rows) {
  return table([{t: 'Field', k: 'field', f: (a) => LABEL[a.field] || a.field}, {t: 'Year', k: 'period'}, {t: 'Kind', k: 'kind'}, {t: 'Method', k: 'method', f: (a) => METHOD[a.method] || a.method},
    {t: 'AI amount', n: 1, k: 'ai_amount', f: (a) => (a.ai_amount != null ? usd(a.ai_amount) : h('span', {class: 'muted'}, '—'))},
    {t: 'Share', n: 1, k: 'ai_share', f: (a) => (a.ai_share != null ? pct(a.ai_share) : '—')}, {t: 'Confidence', n: 1, k: 'confidence', f: (a) => pct(a.confidence)}],
    rows, {detail: (a) => h('div', {class: 'src'}, h('div', {}, a.basis), h('div', {class: 'muted small mono'}, a.inputs || '—'))});
}
const FACT = {segment_capex: 'Segment capex', segment_revenue: 'Segment revenue', ppe_category: 'PP&E by category', finance_lease_liability: 'Finance lease liabilities', purchase_commitments: 'Purchase commitments'};
function factsTable(rows) {
  return table([{t: 'Fact', k: 'field', f: (f) => FACT[f.field] || f.field}, {t: 'Segment / category', k: 'dimension', f: (f) => f.dimension || h('span', {class: 'muted'}, 'company')},
    {t: 'Year', k: 'period'}, {t: 'Value', n: 1, k: 'value', f: (f) => usd(f.value)},
    {t: 'XBRL', k: 'label', f: (f) => (f.label === 'agree' ? h('span', {class: 'muted'}, 'agrees') : f.label === 'unresolved' ? h('span', {class: 'bad'}, `differs: ${usd(f.xbrl_value ?? f.reference)}`) : h('span', {class: 'muted'}, 'not tagged'))}],
    rows, {detail: (f) => h('div', {class: 'src'}, h('div', {class: 'mono small'}, `${f.accession} ${f.table_id}, "${f.row_label}" / "${f.column_label}" = ${f.cell_text}`))});
}
const SOURCE = {mdna: '10-K MD&A', earnings_release: 'earnings release', transcript: 'call transcript', cfo_commentary: 'CFO commentary'};
const AI_CLASS = {explicit_amount: 'amount', explicit_share: 'share', qualitative: 'words only'};
function aiTable(rows) {
  const stated = (a) => a.class === 'explicit_amount' ? (a.amount_low === a.amount_high ? usd(a.amount_low) : `${usd(a.amount_low)} – ${usd(a.amount_high)}`) : a.class === 'explicit_share' ? pct(a.share) : '—';
  return table([{t: 'Field', k: 'field', f: (a) => LABEL[a.field] || a.field}, {t: 'Year', k: 'period'}, {t: 'Kind', k: 'kind'},
    {t: 'Says', sort: false, f: (a) => `${AI_CLASS[a.class]}${a.class !== 'qualitative' ? (a.scope === 'ai' ? ', AI part' : ', company total') : ''}`},
    {t: 'Stated', n: 1, sort: false, f: stated}, {t: 'AI amount', n: 1, k: 'ai_amount', f: (a) => (a.ai_amount != null ? usd(a.ai_amount) : h('span', {class: 'muted'}, '—'))},
    {t: 'Source', k: 'source', f: (a) => SOURCE[a.source] || a.source}],
    rows, {detail: (a) => h('div', {class: 'src'}, h('div', {}, `“${a.quote}”`), h('div', {class: 'muted small'}, a.accession || a.text_id))});
}

// Fields down, years across; a note under a value says what a reader must know. Click a value for its source.
function valueGrid(values, costLinesOpen) {
  const years = [...new Set(values.map((v) => v.period))].sort(), fields = ['revenue', 'capex', 'opex'];
  const by = new Map(values.map((v) => [`${v.field}|${v.period}`, v]));
  const rev = (y) => by.get(`revenue|${y}`)?.value;
  const panel = h('div', {style: 'margin-top:1rem'});
  const mark = (v) => {
    if (v.decision) return `decided: ${v.decision.kind}`;
    if (v.label === 'definition_gap') return costLinesOpen ? 'waits on your cost-line call' : 'cost lines confirmed';
    if (v.basis === 'restated') return `restated from ${usd(v.first_reported)}`;
    if (v.field === 'opex' && rev(v.period) != null && v.value > rev(v.period)) return 'above revenue';
    if (v.label !== 'agree') return XBRL[v.label] || v.label;
    return '';
  };
  return h('div', {}, h('div', {class: 'scroll'}, h('table', {class: 'grid'},
    h('thead', {}, h('tr', {}, h('th', {}, ''), years.map((y) => h('th', {class: 'n'}, y)))),
    h('tbody', {}, fields.map((f) => h('tr', {}, h('td', {}, LABEL[f]), years.map((y) => {
      const v = by.get(`${f}|${y}`);
      if (!v) return h('td', {class: 'n muted'}, '—');
      const m = mark(v);
      return h('td', {class: 'n cell', tabindex: 0, onclick: () => { panel.replaceChildren(h('h3', {style: 'margin:0 0 .5rem'}, `${LABEL[f]} ${y}: ${usd(v.value)}`), sources(v)); }},
        h('div', {}, usd(v.value)), m ? h('div', {class: 'note'}, m) : '');
    })))))), panel);
}

// The cleaning, one row per value: what the filing printed, what was done to it, what came out, and how it was checked.
function cleaningTable(values) {
  const rows = values.map((v) => {
    const s = v.sources, one = s[0] || {};
    const scale = one.scale ? ({1: 'units', 1000: 'thousands', 1000000: 'millions', 1000000000: 'billions'})[one.scale] || `×${one.scale}` : '';
    const steps = [];
    if (v.field === 'opex') steps.push('revenue − cost of revenue − operating income, one column');
    if (scale && scale !== 'units') steps.push(`in ${scale}`);
    if (s.some((x) => /^\(|^-/.test(x.cell || '') && x.value > 0)) steps.push('brackets → positive');
    if (s.some((x) => /^[—–-]$/.test((x.cell || '').trim()))) steps.push('dash → 0');
    if (s.some((x) => x.field === 'cost_of_revenue_part')) steps.push(`${s.filter((x) => x.field === 'cost_of_revenue_part').length} cost lines summed`);
    steps.push(`column “${(one.col || '').split(' | ').pop()}” → ${v.period}`);
    steps.push(v.basis === 'restated' ? `newest 10-K (${day(one.filed)}); first reported ${usd(v.first_reported)}` : `10-K filed ${day(one.filed)}`);
    const check = v.decision ? `decided: ${v.decision.kind}` : v.label === 'agree' ? 'matches SEC' : v.label === 'definition_gap' ? 'cost lines: your call' : XBRL[v.label] || v.label;
    return {v, field: LABEL[v.field], period: v.period, printed: v.field === 'opex' ? s.map((x) => `${({revenue: 'revenue', cost_of_revenue: 'cost', cost_of_revenue_part: 'cost line', operating_income: 'op. income'})[x.field] || x.field} ${x.cell}`).join('\n') : one.cell, row: v.field === 'opex' ? '' : one.row, steps, value: v.value, check,
      confirmed: s.length && s.every((x) => x.machine && x.machine.match)};
  });
  return table([{t: 'Value', k: 'field', s: (r) => r.field + r.period, f: (r) => [r.field, ' ', h('span', {class: 'muted'}, r.period)]},
    {t: 'In the 10-K', k: 'printed', f: (r) => [h('span', {class: 'mono brk'}, r.printed || '—'), r.row ? h('div', {class: 'muted small brk'}, r.row) : '']},
    {t: 'Cleaning', sort: false, f: (r) => h('div', {class: 'small brk'}, r.steps.join(', ')), wide: 1},
    {t: 'Value', k: 'value', n: 1, f: (r) => usd(r.value)},
    {t: 'Checked', k: 'check', f: (r) => h('span', {class: r.check === 'matches SEC' ? 'muted' : null}, r.check, r.confirmed ? h('div', {class: 'muted small'}, 're-read on filing') : '')}],
    rows, {detail: (r) => sources(r.v)});
}

const tok = (d) => (d.agent && d.agent.detail.input_tokens != null ? d.agent.detail.input_tokens + d.agent.detail.output_tokens : null);

function rawAnswer(accession) {
  const pre = h('pre', {class: 'raw'}, 'Loading…');
  fetch('/api/output?accession=' + encodeURIComponent(accession)).then((r) => (r.ok ? r.json() : Promise.reject(new Error('no saved answer'))))
    .then((j) => { pre.textContent = JSON.stringify(j, null, 1); }).catch((e) => { pre.textContent = e.message; });
  return pre;
}

function sources(v) {

  for (const s of v.sources) {

const COLORS = ['#2f5bd3', '#d9822b', '#2a9d8f', '#c43d6b', '#7a5cc4', '#6b8e23', '#8c6d46', '#3d8fc4'];  // fixed order: a colour follows its entity
function lineChart(rows, years, tickers, ratio) {
  const W = 520, H = 240, L = 56, R = 64, T = 10, B = 26;
  const vals = rows.map((r) => r.value);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const x = (y) => L + (years.length === 1 ? (W - L - R) / 2 : (years.indexOf(y) * (W - L - R)) / (years.length - 1));
  const yv = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ns = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs) => { const el = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
  const svg = s('svg', {viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img', 'aria-label': 'Line chart'});
  const fmtAxis = (v) => {
    if (ratio) return Math.round(v * 100) + '%';
    const a = Math.abs(v), sign = v < 0 ? '−' : '';
    return a >= 1e9 ? `${sign}$${+(a / 1e9).toFixed(a >= 1e10 ? 0 : 1)}B` : `${sign}$${+(a / 1e6).toFixed(a >= 1e7 ? 0 : 1)}M`;
  };
  for (let i = 0; i <= 4; i++) {
    const v = lo + ((hi - lo) * i) / 4;
    svg.append(s('line', {x1: L, x2: W - R, y1: yv(v), y2: yv(v), stroke: 'var(--faint)', 'stroke-width': 1}));
    const t = s('text', {x: L - 6, y: yv(v) + 4, 'text-anchor': 'end'}); t.textContent = fmtAxis(v); svg.append(t);
  }
  years.forEach((y) => { const t = s('text', {x: x(y), y: H - 6, 'text-anchor': 'middle'}); t.textContent = y.replace('FY', ''); svg.append(t); });
  const tip = $('#tip'), ends = [];
  tickers.forEach((tk, i) => {
    const pts = rows.filter((r) => r.ticker === tk).sort((a, b) => a.period.localeCompare(b.period));
    if (!pts.length) return;
    const color = COLORS[i % COLORS.length];
    svg.append(s('polyline', {points: pts.map((p) => `${x(p.period)},${yv(p.value)}`).join(' '), fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}));
    for (const p of pts) {
      const dot = s('circle', {cx: x(p.period), cy: yv(p.value), r: 3.5, fill: color});
      const hit = s('circle', {cx: x(p.period), cy: yv(p.value), r: 10, fill: 'transparent'});
      hit.addEventListener('mousemove', (e) => { tip.hidden = false; tip.textContent = `${p.company} ${p.period}: ${ratio ? (100 * p.value).toFixed(1) + '%' : usd(p.value)}`; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px'; });
      hit.addEventListener('mouseleave', () => { tip.hidden = true; });
      svg.append(dot, hit);
    }
    const last = pts[pts.length - 1];
    ends.push({tk, color, x: x(last.period) + 7, y: yv(last.value) + 4});
  });
  ends.sort((a, b) => a.y - b.y);  // end labels: keep 12px apart so none overlap
  for (let i = 1; i < ends.length; i++) if (ends[i].x === ends[i - 1].x && ends[i].y - ends[i - 1].y < 12) ends[i].y = ends[i - 1].y + 12;
  for (const e of ends) { const lab = s('text', {x: e.x, y: e.y}); lab.textContent = e.tk; lab.style.fill = e.color; svg.append(lab); }
  return h('div', {}, svg);
}

const METHOD = {stated_share: 'stated share', stated_amount: 'stated amount', segment: 'segment', ppe_category: 'server category growth', whole_business: 'whole business', commitment: 'commitments', qualitative: 'words only', none: 'none'};

function change(f) {
  if (f.kind === 'restated') return `${usd(f.before)} → ${usd(f.after)} (${f.after >= f.before ? '+' : '−'}${pct(f.size)})`;
  if (f.kind === 'jump') return `${usd(f.before)} → ${usd(f.after)} (${f.size.toFixed(1)}×)`;
  if (f.kind === 'capex_intensity') return `capex ${pct(f.size)} of revenue`;

  return h('span', {class: 'small'}, (f.message || '').slice(0, 140));
}

// A job (add a company, or rerun attribution) and its steps, polled while it runs.

// Reference vs ours on a 0–100% axis: a bar for a floor or ceiling, a tick for a stated figure, a dot for ours.
function dotPlot(rows) {
  const W = 360, H = 22, L = 4, R = 4;
  const x = (v) => L + (W - L - R) * Math.max(0, Math.min(1, v));
  const ns = 'http://www.w3.org/2000/svg', s = (tag, a) => { const el = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(a)) el.setAttribute(k, v); return el; };
  return h('div', {class: 'dots'}, rows.map((r) => {
    const svg = s('svg', {viewBox: `0 0 ${W} ${H}`, width: '100%', height: H, role: 'img', 'aria-label': `${r.ticker} ${r.period}`});
    svg.append(s('line', {x1: L, x2: W - R, y1: H / 2, y2: H / 2, stroke: 'var(--faint)', 'stroke-width': 2}));
    if (r.relation === 'ge') svg.append(s('rect', {x: x(r.reference), y: H / 2 - 4, width: x(1) - x(r.reference), height: 8, fill: 'var(--faint)'}));
    if (r.relation === 'le') svg.append(s('rect', {x: x(0), y: H / 2 - 4, width: x(r.reference) - x(0), height: 8, fill: 'var(--faint)'}));
    svg.append(s('line', {x1: x(r.reference), x2: x(r.reference), y1: 2, y2: H - 2, stroke: 'var(--muted)', 'stroke-width': 2}));
    if (r.ours != null) svg.append(s('circle', {cx: x(r.ours), cy: H / 2, r: 5, fill: r.outcome === 'agree' ? 'var(--accent)' : 'var(--bad)'}));

async function dataPage(view, qs) {

  }

  // data for the selection

  const rows = d.rows;

  // the auditor's mark: traced (agrees with its source), untraced (checked, no source to agree with), disagrees
  const evOut = Object.fromEntries((ev?.rows || []).map((e) => [`${e.ticker}|${e.period}`, e.outcome]));
  function mark(r) {
    let k = 'u', why = 'checked, no tagged counterpart to agree with';

      sel.f.length > 1 ? h('td', {class: 'muted small'}, FIELDS[s.field] || s.field) : '', list.some((x) => x.dimension) ? h('td', {class: 'small'}, s.dimension || '') : '',

  view.append(h('div', {class: 'stack', style: 'gap:1rem'},

// A drawer on the right: one thing at a time, closed with Esc or the ×.

  const {rows: saved} = await api('/api/v1/views');
  const current = arg ? saved.find((v) => v.id === arg) : saved[0];
  const list = h('div', {class: 'viewlist'}, saved.map((v) => h('a', {href: '#views/' + v.id, class: 'viewrow' + (current && v.id === current.id ? ' on' : '')},
    h('span', {}, v.name), h('span', {class: 'muted small'}, `${MEASURES[v.measure] || v.measure}${v.group ? ', by ' + v.group : ''}`))));
  const head = h('div', {class: 'controls'}, h('span', {class: 'muted small'}, `${saved.length} saved view${saved.length === 1 ? '' : 's'}`),
    h('button', {type: 'button', class: 'btn', onclick: () => editView(null)}, 'New view'));
  const body = h('div', {class: 'viewbody'});
  view.append(h('div', {class: 'views'}, h('div', {}, head, list), body));
  if (!current) { body.append(h('p', {class: 'msg'}, 'No view yet. New view asks a question of the dataset and keeps it.')); return; }
  const d = await api(`/api/v1/views/${current.id}/data`);
  const rows = d.rows, n = rows.length;
  const q = new URLSearchParams({...current.filters, ...(current.group ? {group: current.group} : {})}).toString();
  const url = `/api/v1/${current.measure}?${q}`;
  body.append(h('div', {class: 'sechead'}, h('h2', {}, current.name), h('span', {class: 'muted small'}, current.note || '')),
    h('div', {class: 'controls'}, h('span', {class: 'muted small'}, `${n} row${n === 1 ? '' : 's'}`),
      h('a', {href: url, target: '_blank', rel: 'noopener', class: 'small'}, 'JSON'), h('a', {href: url + '&format=csv', class: 'small'}, 'CSV'),
      h('button', {type: 'button', class: 'btn', onclick: () => editView(current)}, 'Edit'),
      h('button', {type: 'button', class: 'btn', onclick: async () => { if (!confirmDelete.checked) { confirmDelete.hidden = false; confirmDelete.checked = false; return; } await api(`/api/v1/views/${current.id}/delete`, {method: 'POST', body: JSON.stringify({by: me()})}); go('#views'); }}, 'Delete'),
      h('label', {class: 'small muted', hidden: true}, h('input', {type: 'checkbox'}), ' click Delete again to confirm')));
  const confirmDelete = body.querySelector('label input');
  const amount = (r) => r.amount ?? r.ai_amount ?? r.value ?? r.amount_mid ?? r.gap ?? null;
  if (!n) { body.append(h('p', {class: 'msg'}, 'No rows match. Widen the filters, or run the step that fills this list.')); return; }
  if (current.show === 'bars' && current.group) {
    const max = Math.max(1, ...rows.map((r) => Math.abs(amount(r) || 0)));
    body.append(h('div', {class: 'barlist'}, rows.map((r) => h('div', {class: 'bar'}, h('span', {class: 'l'}, String(r[current.group] ?? '—')),
      h('span', {class: 'track'}, h('i', {style: `width:${100 * Math.abs(amount(r) || 0) / max}%`})), h('span', {class: 'n'}, usd(amount(r)))))));
  } else if (current.show === 'lines' && rows.some((r) => r.period && r.ticker)) {
    const val = (r) => r.ai_amount ?? r.value ?? r.amount_mid ?? r.actual ?? null;
    const pts = rows.filter((r) => val(r) != null).map((r) => ({ticker: r.ticker, period: r.period, value: val(r), company: r.ticker}));
    const years = [...new Set(pts.map((r) => r.period))].sort(), ts = [...new Set(pts.map((r) => r.ticker))].sort().slice(0, 8);
    body.append(h('div', {class: 'chart'}, lineChart(pts.filter((r) => ts.includes(r.ticker)), years, ts, false)),
      h('p', {class: 'muted small'}, ts.map((t, i) => h('span', {style: `margin-right:.8rem;color:${COLORS[i % COLORS.length]}`}, t)), ts.length < new Set(pts.map((r) => r.ticker)).size ? ' (first eight companies; filter to see others)' : ''));
  } else if (current.show === 'shares' && rows.some((r) => r.ai_share != null)) {
    const years = [...new Set(rows.map((r) => r.period))].sort(), ts = [...new Set(rows.map((r) => r.ticker))].sort();
    const by = {}; for (const r of rows) by[`${r.ticker}|${r.period}`] = r;
    body.append(h('div', {class: 'tablewrap'}, h('table', {class: 'grid'}, h('thead', {}, h('tr', {}, h('th', {}, 'Company'), years.map((y) => h('th', {class: 'n'}, y)))),
      h('tbody', {}, ts.map((t) => h('tr', {}, h('th', {}, t), years.map((y) => { const r = by[`${t}|${y}`]; return h('td', {class: 'n', title: r ? `${usd(r.ai_amount)} · ${r.method}` : ''}, r ? mini(r.ai_share, pct(r.ai_share)) : '—'); })))))));
  } else {
    const cols = Object.keys(rows[0]).filter((c) => !['basis', 'inputs', 'quote', 'plan_quote', 'run_id', 'prompt_version', 'model'].includes(c)).slice(0, 12);
    const cell = (r, c) => { const v = r[c]; const num = typeof v === 'number'; const text = v == null ? '—' : num ? (Math.abs(v) >= 1e6 ? usd(v) : (c.includes('share') || c === 'confidence' ? pct(v) : String(v))) : typeof v === 'boolean' ? (v ? 'yes' : 'no') : String(v); return h('td', {class: num ? 'n' : ''}, text); };
    const tbody = h('tbody', {}, rows.slice(0, 500).map((r) => h('tr', {}, cols.map((c) => cell(r, c)))));
    body.append(h('div', {class: 'tablewrap'}, h('table', {class: 'grid'}, h('thead', {}, h('tr', {}, cols.map((c) => h('th', {class: typeof rows[0][c] === 'number' ? 'n' : ''}, c)))), tbody)));
    if (n > 500) body.append(h('p', {class: 'muted small'}, `First 500 of ${n}; the CSV has them all.`));
  }
  function editView(v) {
    const f = v ? {...v} : {name: '', measure: 'attribution', filters: {}, group: '', show: 'grid', note: ''};
    const name = h('input', {type: 'text', value: f.name, placeholder: 'What this view answers'});
    const measure = h('select', {}, Object.entries(MEASURES).map(([k, t]) => h('option', {value: k, selected: f.measure === k || null}, t)));
    const filt = Object.fromEntries(FILTER_COLS.map((c) => [c, h('input', {type: 'text', value: f.filters[c] || '', placeholder: c})]));
    const group = h('select', {}, GROUP_COLS.map((g) => h('option', {value: g, selected: (f.group || '') === g || null}, g || 'rows, no grouping')));
    const show = h('select', {}, [['grid', 'grid'], ['bars', 'bars by group'], ['lines', 'lines by year per company'], ['shares', 'share grid']].map(([k, t]) => h('option', {value: k, selected: f.show === k || null}, t)));
    const note = h('input', {type: 'text', value: f.note || '', placeholder: 'One line on what to read into it'});
    const msg = h('p', {class: 'msg small'});
    drawer(h('h3', {}, v ? 'Edit view' : 'New view'),
      h('div', {class: 'form'}, h('label', {}, 'Name', name), h('label', {}, 'Measure', measure),
        h('div', {class: 'muted small'}, 'Filters, comma-separated values'), FILTER_COLS.map((c) => h('label', {}, c, filt[c])),
        h('label', {}, 'Group by', group), h('label', {}, 'Show as', show), h('label', {}, 'Note', note)),
      h('div', {class: 'row', style: 'margin-top:1rem'}, h('button', {type: 'button', class: 'btn', onclick: async () => {
        const filters = Object.fromEntries(FILTER_COLS.filter((c) => filt[c].value.trim()).map((c) => [c, filt[c].value.trim()]));
        try {
          const out = await api('/api/v1/views', {method: 'POST', body: JSON.stringify({view: {id: v ? v.id : undefined, name: name.value, measure: measure.value, filters, group: group.value || null, show: show.value, note: note.value}, by: me()})});
          closeDrawer(); go('#views/' + out.id); if (location.hash === '#views/' + out.id) route();
        } catch (e) { msg.textContent = e.message; msg.classList.add('bad'); }
      }}, v ? 'Save' : 'Create'), msg));
  }
}

// ── Routing ─────────────────────────────────────────────────────────────────
function go(hash) { location.hash = hash; }
async function route() {
  const raw = location.hash.slice(1) || 'flow';
  const [path, qs] = raw.split('?');
  const [page, arg] = path.split('/');
  const tab = {company: 'data', run: 'flow', pipeline: 'flow', insights: 'data'}[page] || page;
  document.querySelectorAll('nav [data-nav]').forEach((a) => a.classList.toggle('on', a.dataset.nav === tab));
  const view = $('#view');
  view.replaceChildren(h('h1', {class: 'sr'}, `DATAHQ, ${({flow: 'Flow', data: 'Dataset', company: 'Company', attribution: 'Attribution', views: 'Views', status: 'Status', releases: 'Releases', agents: 'Agents', run: 'Add a Company'})[page] || 'Data'}`));
  try {
    if (page === 'company') await dataPage(view, `t=${arg || ''}&f=ai_capex,capex`);
    else if (page === 'flow') await flowPage(view, qs);
    else if (page === 'attribution') await attributionPage(view);
    else if (page === 'views') await viewsPage(view, arg, qs);
    else if (page === 'agents') await agentsPage(view);
    else if (page === 'releases') await releasesPage(view);
    else if (page === 'run') await runPage(view);
    else if (page === 'status') await statusPage(view);
    else if (page === 'data' || page === 'insights') await dataPage(view, qs);
    else await flowPage(view, qs);
  } catch (e) {
    view.replaceChildren(h('p', {class: 'msg bad'}, e.message));
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
