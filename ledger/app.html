<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<title>DATAHQ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.3.2/dist/css/tabler.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.34.0/plotly.min.js" defer></script>
<style>
  /* DATAHQ on Tabler. The kit carries the look; this block maps the app's own layout classes onto the kit's tokens. */
  :root { --bg: var(--tblr-bg-surface); --fg: var(--tblr-body-color); --muted: var(--tblr-secondary); --faint: var(--tblr-border-color); --accent: var(--tblr-primary); --bad: var(--tblr-red); --bar: var(--tblr-bg-surface-secondary); --row: var(--tblr-active-bg, rgba(0,0,0,.03));
    --font: var(--tblr-font-sans-serif); --mono: var(--tblr-font-monospace); --tblr-font-sans-serif: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: -999px; top: .5rem; background: var(--tblr-bg-surface); padding: .4rem .7rem; z-index: 1100; }
  .skip:focus { left: .5rem; }
  body { font-size: .875rem; }
  main { padding-top: 1.25rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
  h2 { font-size: .95rem; font-weight: 600; margin: 0 0 .5rem; }
  h3 { font-size: .9rem; font-weight: 600; }
  p { margin: 0; }
  .lede { color: var(--tblr-secondary); max-width: 70ch; margin-top: .25rem; }
  .lede b { color: var(--tblr-body-color); font-weight: 600; }
  .muted { color: var(--tblr-secondary); }
  .bad { color: var(--tblr-red); }
  td > span.bad, td > span.muted { white-space: nowrap; }
  .small { font-size: .8rem; }
  .mono { font-family: var(--tblr-font-monospace); font-size: .8rem; }
  .brk { white-space: pre-wrap; word-break: break-word; }
  .num, td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.n { font-weight: 500; }
  td.n .note { font-weight: 400; }
  /* layout */
  .stack { display: grid; gap: 1.25rem; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 1.25rem; }
  .two > *, .stack > * { min-width: 0; }
  .hrow { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
  .pagehead { display: grid; gap: .3rem; margin-bottom: .25rem; }
  .sechead { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .6rem; }
  .sechead h2 { margin: 0; }
  section.card > .sechead { padding: .6rem 1rem; margin: 0; border-bottom: 1px solid var(--tblr-border-color); }
  section.card > .sechead h2 { font-size: .85rem; }
  section.card > :not(.sechead) { padding: .75rem 1rem; }
  section.card > .card-table-wrap { padding: 0; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(18rem, 24rem); gap: 1.25rem; align-items: start; }
  @media (max-width: 52rem) { .split { grid-template-columns: 1fr; } }
  /* figures: stat cards */
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); gap: .75rem; }
  .fig { background: var(--tblr-bg-surface); border: 1px solid var(--tblr-border-color); border-radius: var(--tblr-border-radius); padding: .6rem .85rem; }
  .fig .l { color: var(--tblr-secondary); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .fig .n { font-size: 1.35rem; line-height: 1.2; font-weight: 600; margin: .1rem 0; }
  .fig .s { color: var(--tblr-secondary); font-size: .78rem; }
  .fig .n.bad, .fig .s.bad { color: var(--tblr-red); }
  .strip { display: grid; }
  /* bars */
  .bars { display: grid; gap: .5rem; }
  .bars .bar { display: grid; grid-template-columns: minmax(8rem, 12rem) 1fr auto; gap: .75rem; align-items: center; }
  .bars .bar .v { color: var(--tblr-secondary); font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { position: relative; height: 8px; border-radius: 4px; background: var(--tblr-border-color); overflow: hidden; }
  .track i { position: absolute; left: 0; top: 0; display: block; height: 100%; border-radius: 4px; background: var(--tblr-primary); }
  .track i.bad { background: var(--tblr-red); }
  .track i.note { background: var(--tblr-secondary); opacity: .5; }
  .track i.rest { background: var(--tblr-border-color); filter: brightness(.93); }
  .mini { display: grid; grid-template-columns: 4.5rem auto; gap: .5rem; align-items: center; font-size: .8rem; color: var(--tblr-secondary); font-variant-numeric: tabular-nums; }
  .mini i { display: block; height: 6px; border-radius: 3px; background: var(--tblr-primary); }
  .dots { display: grid; gap: .35rem; }
  .dotrow { display: grid; grid-template-columns: 6rem 1fr minmax(8rem, auto); gap: .75rem; align-items: center; font-size: .8rem; }
  .dotrow .v { color: var(--tblr-secondary); text-align: right; font-variant-numeric: tabular-nums; }
  /* tables the pages build by hand (grid, heat) */
  .scroll { overflow-x: auto; }
  table.grid, table.heat { width: 100%; }
  table.grid th, table.heat th { position: sticky; top: 0; z-index: 2; background: var(--tblr-bg-surface); }
  table.grid th:first-child, table.grid td:first-child, table.heat th:first-child, table.heat td:first-child { position: sticky; left: 0; background: var(--tblr-bg-surface); z-index: 1; }
  table.grid td.cell, table.heat td.cell { cursor: pointer; }
  table.grid td.cell:hover, table.heat td.cell:hover { color: var(--tblr-primary); }
  table.grid .note { font-size: .72rem; color: var(--tblr-secondary); white-space: normal; max-width: 9rem; margin-left: auto; }
  table.heat td.c { padding-inline: .5rem; background: color-mix(in srgb, var(--tblr-primary) calc(var(--i, 0) * 28%), transparent); }
  table.heat td.c .note { font-size: .72rem; color: var(--tblr-secondary); }
  table.heat td.moved { box-shadow: inset 3px 0 0 var(--tblr-primary); }
  tr.click { cursor: pointer; }
  tr.open td { color: var(--tblr-primary); }
  .detail td { padding: .25rem .75rem 1.25rem !important; }
  .mk { display: inline-block; width: 1.1em; text-align: center; margin-left: .25rem; font-weight: 600; }
  .mk.t { color: var(--tblr-green); }
  .mk.u { color: var(--tblr-secondary); opacity: .6; }
  .mk.x { color: var(--tblr-red); }
  .mk.d { color: var(--tblr-orange, #f76707); }
  .mk.o { color: var(--tblr-orange, #f76707); }
  .src { display: grid; gap: .3rem; margin-bottom: .9rem; max-width: 60rem; }
  .src img { max-width: min(100%, 40rem); border-radius: 4px; margin-top: .3rem; border: 1px solid var(--tblr-border-color); }
  /* text controls that the kit does not reach */
  textarea { width: 100%; min-height: 28rem; font: .8rem/1.55 var(--tblr-font-monospace); }
  textarea[readonly] { background: var(--tblr-bg-surface-secondary); resize: none; }
  pre.raw { white-space: pre-wrap; word-break: break-word; font: .78rem/1.5 var(--tblr-font-monospace); max-height: 30rem; overflow: auto; margin: .5rem 0 0; background: var(--tblr-bg-surface-secondary); padding: .6rem .75rem; border-radius: var(--tblr-border-radius); }
  .msg { color: var(--tblr-secondary); padding: 2rem 0; }
  .tip { position: fixed; pointer-events: none; background: var(--tblr-bg-surface); box-shadow: var(--tblr-shadow); border: 1px solid var(--tblr-border-color); border-radius: 6px; padding: .35rem .6rem; font-size: .8rem; z-index: 1090; }
  ul.plain { margin: .2rem 0 0; padding-left: 1.1rem; }
  ul.plain li { margin: .15rem 0; }
  .picks { display: flex; flex-wrap: wrap; gap: .25rem .8rem; font-size: .84rem; }
  .picks label { white-space: nowrap; cursor: pointer; }
  .controls { display: grid; gap: 1.1rem; }
  /* the drawer: the kit's offcanvas, opened by script */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(100%, 32rem); background: var(--tblr-bg-surface); box-shadow: var(--tblr-shadow-dropdown, -8px 0 30px rgba(0,0,0,.12)); border-left: 1px solid var(--tblr-border-color); padding: 1.25rem 1.5rem 2rem; overflow: auto; overscroll-behavior: contain; z-index: 1050; }
  .drawer .close { position: absolute; top: .7rem; right: .9rem; }
  .drawer h3 { font-size: 1rem; margin: 0 2rem .6rem 0; }
  /* flow */
  .stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: .75rem; }
  .stage { background: var(--tblr-bg-surface); border: 1px solid var(--tblr-border-color); border-radius: var(--tblr-border-radius); padding: .75rem 1rem; }
  .stage ul.plain { padding-left: 0; list-style: none; }
  .stage li { margin: .2rem 0; }
  .steps { display: grid; gap: .6rem; }
  .stp { display: grid; grid-template-columns: 5rem 1fr; gap: 1rem; color: var(--tblr-secondary); }
  .stp.done, .stp.running { color: var(--tblr-body-color); }
  .stp .state { font-size: .8rem; color: var(--tblr-secondary); }
  .stp.running .state { color: var(--tblr-primary); }
  /* explore */
  .views { display: grid; grid-template-columns: 16rem 1fr; gap: 1.25rem; align-items: start; }
  .viewlist { display: flex; flex-direction: column; gap: .15rem; margin-top: .5rem; }
  .viewrow { display: flex; flex-direction: column; padding: .4rem .6rem; border-radius: var(--tblr-border-radius); color: var(--tblr-body-color); }
  .viewrow:hover { background: var(--tblr-bg-surface-secondary); text-decoration: none; }
  .viewrow.on { background: var(--tblr-active-bg, rgba(32,107,196,.08)); }
  .exc select, .exc input { max-width: 15rem; }
  .plot { min-height: 400px; margin-top: .6rem; }
  .plot .modebar { opacity: .5; }
  @media (max-width: 700px) { .views { grid-template-columns: 1fr; } }
  .form { display: flex; flex-direction: column; gap: .45rem; }
  .form label { display: grid; grid-template-columns: 6rem 1fr; gap: .5rem; align-items: center; font-size: .85rem; }
  /* reconcile */
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .table thead th { font-size: .72rem; letter-spacing: .03em; }
  tr.item { cursor: pointer; }
  tr.item:focus-visible { outline: 2px solid var(--tblr-primary); outline-offset: -2px; }
  tr.item.cur td { background: var(--tblr-active-bg, rgba(0,0,0,.03)); }
  tr.item.cur td:first-child { box-shadow: inset 3px 0 0 var(--tblr-primary); }
  tr.ev > td { padding: 1rem 1.25rem 1.25rem; background: var(--tblr-bg-surface-secondary); cursor: default; }
  .gg { position: relative; height: 8px; width: 7rem; background: var(--tblr-border-color); border-radius: 4px; }
  .gg .band { position: absolute; top: -3px; height: 14px; background: color-mix(in srgb, var(--tblr-body-color) 14%, transparent); border-radius: 2px; }
  .gg .ours { position: absolute; left: 0; top: 0; height: 8px; background: var(--tblr-primary); border-radius: 4px; }
  .gg .tick { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--tblr-body-color); }
  .gg .gap { position: absolute; top: 3px; height: 2px; background: repeating-linear-gradient(90deg, var(--tblr-red) 0 3px, transparent 3px 6px); }
  .gg.lg { width: 100%; height: 10px; margin: .35rem 0 .2rem; }
  .gg.lg .ours { height: 10px; }
  .gg.lg .band { top: -3px; height: 16px; }
  .gg.lg .tick { top: -5px; height: 20px; }
  .bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--tblr-primary); vertical-align: middle; margin-right: .35rem; opacity: .85; }
  .bars .bar { display: grid; height: auto; background: none; opacity: 1; margin: 0; }
  .bar.ref { background: var(--tblr-secondary); }
  .bar.tot { background: var(--tblr-border-color-active, #bbb); }
  .card-header .card-title { white-space: nowrap; font-size: .85rem; }
  .card-header .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 1rem; }
  .table .badge { white-space: nowrap; }
  .shot { max-width: 100%; border-radius: 4px; border: 1px solid var(--tblr-border-color); }
  details.words summary { cursor: pointer; font-size: .8rem; color: var(--tblr-secondary); list-style: none; }
  details.words summary::-webkit-details-marker { display: none; }
  details.words[open] summary { margin-bottom: .4rem; }
  .table-sm > :not(caption) > * > * { padding: .35rem .6rem; }
  .btn:active { transform: scale(.98); }
  .btn-group .btn.active { background: var(--tblr-primary); color: #fff; border-color: var(--tblr-primary); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="navbar navbar-expand-md d-print-none" data-bs-theme="dark">
  <div class="container-xl">
    <a class="navbar-brand" href="#proof"><span class="fw-bold" style="letter-spacing:.08em">DATAHQ</span></a>
    <div class="navbar-nav flex-row flex-wrap me-auto">
      <a class="nav-link px-2" href="#proof" data-nav="proof">Proof</a>
      <a class="nav-link px-2" href="#rules" data-nav="rules">Rules</a>
      <a class="nav-link px-2" href="#golden" data-nav="golden">Golden</a>
      <a class="nav-link px-2" href="#reconcile" data-nav="reconcile">Reconcile</a>
      <a class="nav-link px-2" href="#data" data-nav="data">Dataset</a>
      <a class="nav-link px-2" href="#attribution" data-nav="attribution">Attribution</a>
      <a class="nav-link px-2" href="#explore" data-nav="explore">Explore</a>
      <a class="nav-link px-2" href="#releases" data-nav="releases">Releases</a>
      <a class="nav-link px-2" href="#agents" data-nav="agents">Agents</a>
    </div>
    <div class="d-flex align-items-center gap-3">
      <input class="form-control form-control-sm" id="jump" name="jump" type="text" list="tickers" placeholder="Ticker or company…" aria-label="Jump to a company" autocomplete="off" spellcheck="false" style="width:13rem">
      <datalist id="tickers"></datalist>
      <span class="text-secondary small text-nowrap">signed as <input id="me" name="signer" type="text" class="form-control form-control-sm d-inline-block" style="width:9rem" aria-label="Your name, logged on every model or prompt change" autocomplete="name"></span>
    </div>
  </div>
</header>
<div class="page-wrapper"><div class="page-body"><div class="container-xl">
  <main id="view" tabindex="-1"><p class="msg">Loading…</p></main>
</div></div></div>
<div class="tip" id="tip" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k === 'class') el.className = v; else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
};
const int = (n) => (n == null || n === '' ? '—' : Number(n).toLocaleString('en-US'));
const usd = (n) => {
  if (n == null || n === '') return '—';
  const m = Number(n) / 1e6;
  return (m < 0 ? '−' : '') + '$' + Math.abs(m).toLocaleString('en-US', {maximumFractionDigits: Math.abs(m) >= 100 ? 0 : 1}) + 'M';
};
const day = (s) => (s ? new Date(String(s).slice(0, 10) + 'T00:00:00Z').toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'}) : '—');
const when = (s) => (s ? new Date(s).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : '—');
const compact = (n) => new Intl.NumberFormat('en', {notation: 'compact', maximumFractionDigits: 1}).format(n || 0);
const LABEL = {revenue: 'Revenue', capex: 'Capex', opex: 'Opex', cost_of_revenue: 'Cost of revenue', cost_of_revenue_part: 'Cost line', operating_income: 'Operating income'};
const XBRL = {agree: 'matches SEC data', definition_gap: 'differs from SEC data, explained by code', unresolved: 'differs from SEC data, decided by a person', not_reported: 'not reported'};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
let me = 'Kenny Geiler';
try { me = localStorage.getItem('datahq-me') || me; } catch {}
$('#me').value = me;
$('#me').addEventListener('input', (e) => { me = e.target.value; try { localStorage.setItem('datahq-me', me); } catch {} });
let NAMES = {};
api('/api/data?t=&f=none').then((d) => { NAMES = d.names; $('#tickers').replaceChildren(...Object.entries(NAMES).map(([t, n]) => h('option', {value: t}, n))); });
$('#jump').addEventListener('change', (e) => { const v = e.target.value.trim().toUpperCase(); const t = NAMES[v] ? v : Object.keys(NAMES).find((k) => NAMES[k].toUpperCase() === v); if (t) { e.target.value = ''; go(`data?t=${t}&f=ai_capex,capex`); } });

function table(cols, rows, {key, onRow, detail} = {}) {
  const tb = h('tbody');
  const draw = (list) => {
    tb.replaceChildren();
    for (const r of list) {
      const tr = h('tr', {class: onRow || detail ? 'click' : null, tabindex: onRow || detail ? 0 : null, role: onRow || detail ? 'button' : null, onkeydown: onRow || detail ? (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tr.click(); } } : null}, cols.map((c) => h('td', {class: [c.n && 'n', c.wide && 'wide'].filter(Boolean).join(' ') || null}, c.f ? c.f(r) : r[c.k] ?? '—')));
      tb.append(tr);
      if (onRow) tr.addEventListener('click', () => onRow(r));
      if (detail) tr.addEventListener('click', () => {
        const next = tr.nextElementSibling;
        if (next && next.classList.contains('detail')) { next.remove(); tr.classList.remove('open'); return; }
        tr.classList.add('open');
        tr.after(h('tr', {class: 'detail'}, h('td', {colspan: cols.length}, detail(r))));
      });
    }
  };
  let sort = null, dir = 1;
  const head = h('tr', {}, cols.map((c) => {
    const th = h('th', {class: [c.n && 'n', c.wide && 'wide'].filter(Boolean).join(' ') || null});
    if (c.sort === false) th.append(c.t);
    else th.append(h('button', {type: 'button', style: 'color:inherit', onclick: () => {
      dir = sort === c ? -dir : (c.n ? -1 : 1); sort = c;
      const v = c.s || ((r) => r[c.k]);
      draw([...rows].sort((a, b) => { const x = v(a), y = v(b); if (x == null || x === '') return 1; if (y == null || y === '') return -1; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * dir; }));
    }}, c.t));
    return th;
  }));
  draw(rows);
  return h('div', {class: 'card'}, h('div', {class: 'table-responsive'}, h('table', {class: 'table table-sm table-vcenter card-table table-hover'}, h('thead', {}, head), tb)));
}

function bars(list) {
  return h('div', {class: 'bars'}, list.map((b) => h('div', {class: 'bar'}, h('span', {}, b.name),
    h('div', {class: 'track'}, h('i', {class: b.cls || null, style: `width:${Math.max(0, Math.min(100, b.pct))}%`})), h('span', {class: 'v'}, b.v))));
}

const KIND = {restated: 'Restated', jump: 'Big move', capex_intensity: 'Capex vs revenue', opex_over_revenue: 'Opex above revenue', row_switch: 'Line renamed', other: 'Note'};
function attributionTable(rows) {
  return table([{t: 'Field', k: 'field', f: (a) => LABEL[a.field] || a.field}, {t: 'Year', k: 'period'}, {t: 'Kind', k: 'kind'}, {t: 'Method', k: 'method', f: (a) => METHOD[a.method] || a.method},
    {t: 'AI amount', n: 1, k: 'ai_amount', f: (a) => (a.ai_amount != null ? usd(a.ai_amount) : h('span', {class: 'muted'}, '—'))},
    {t: 'Share', n: 1, k: 'ai_share', f: (a) => (a.ai_share != null ? pct(a.ai_share) : '—')}, {t: 'Confidence', n: 1, k: 'confidence', f: (a) => pct(a.confidence)}],
    rows, {detail: (a) => h('div', {class: 'src'}, h('div', {}, a.basis), h('div', {class: 'muted small mono'}, a.inputs || '—'))});
}
const FACT = {segment_capex: 'Segment capex', segment_revenue: 'Segment revenue', ppe_category: 'PP&E by category', finance_lease_liability: 'Finance lease liabilities', purchase_commitments: 'Purchase commitments'};
function factsTable(rows) {
  return table([{t: 'Fact', k: 'field', f: (f) => FACT[f.field] || f.field}, {t: 'Segment / category', k: 'dimension', f: (f) => f.dimension || h('span', {class: 'muted'}, 'company')},
    {t: 'Year', k: 'period'}, {t: 'Value', n: 1, k: 'value', f: (f) => usd(f.value)},
    {t: 'XBRL', k: 'label', f: (f) => (f.label === 'agree' ? h('span', {class: 'muted'}, 'agrees') : f.label === 'unresolved' ? h('span', {class: 'bad'}, `differs: ${usd(f.xbrl_value ?? f.reference)}`) : h('span', {class: 'muted'}, 'not tagged'))}],
    rows, {detail: (f) => h('div', {class: 'src'}, h('div', {class: 'mono small'}, `${f.accession} ${f.table_id}, "${f.row_label}" / "${f.column_label}" = ${f.cell_text}`))});
}
const SOURCE = {mdna: '10-K MD&A', earnings_release: 'earnings release', transcript: 'call transcript', cfo_commentary: 'CFO commentary'};
const AI_CLASS = {explicit_amount: 'amount', explicit_share: 'share', qualitative: 'words only'};
function aiTable(rows) {
  const stated = (a) => a.class === 'explicit_amount' ? (a.amount_low === a.amount_high ? usd(a.amount_low) : `${usd(a.amount_low)} – ${usd(a.amount_high)}`) : a.class === 'explicit_share' ? pct(a.share) : '—';
  return table([{t: 'Field', k: 'field', f: (a) => LABEL[a.field] || a.field}, {t: 'Year', k: 'period'}, {t: 'Kind', k: 'kind'},
    {t: 'Says', sort: false, f: (a) => `${AI_CLASS[a.class]}${a.class !== 'qualitative' ? (a.scope === 'ai' ? ', AI part' : ', company total') : ''}`},
    {t: 'Stated', n: 1, sort: false, f: stated}, {t: 'AI amount', n: 1, k: 'ai_amount', f: (a) => (a.ai_amount != null ? usd(a.ai_amount) : h('span', {class: 'muted'}, '—'))},
    {t: 'Source', k: 'source', f: (a) => SOURCE[a.source] || a.source}],
    rows, {detail: (a) => h('div', {class: 'src'}, h('div', {}, `“${a.quote}”`), h('div', {class: 'muted small'}, a.accession || a.text_id))});
}

// Fields down, years across; a note under a value says what a reader must know. Click a value for its source.
function valueGrid(values, costLinesOpen) {
  const years = [...new Set(values.map((v) => v.period))].sort(), fields = ['revenue', 'capex', 'opex'];
  const by = new Map(values.map((v) => [`${v.field}|${v.period}`, v]));
  const rev = (y) => by.get(`revenue|${y}`)?.value;
  const panel = h('div', {style: 'margin-top:1rem'});
  const mark = (v) => {
    if (v.decision) return `decided: ${v.decision.kind}`;
    if (v.label === 'definition_gap') return costLinesOpen ? 'waits on your cost-line call' : 'cost lines confirmed';
    if (v.basis === 'restated') return `restated from ${usd(v.first_reported)}`;
    if (v.field === 'opex' && rev(v.period) != null && v.value > rev(v.period)) return 'above revenue';
    if (v.label !== 'agree') return XBRL[v.label] || v.label;
    return '';
  };
  return h('div', {}, h('div', {class: 'scroll'}, h('table', {class: 'grid'},
    h('thead', {}, h('tr', {}, h('th', {}, ''), years.map((y) => h('th', {class: 'n'}, y)))),
    h('tbody', {}, fields.map((f) => h('tr', {}, h('td', {}, LABEL[f]), years.map((y) => {
      const v = by.get(`${f}|${y}`);
      if (!v) return h('td', {class: 'n muted'}, '—');
      const m = mark(v);
      return h('td', {class: 'n cell', tabindex: 0, onclick: () => { panel.replaceChildren(h('h3', {style: 'margin:0 0 .5rem'}, `${LABEL[f]} ${y}: ${usd(v.value)}`), sources(v)); }},
        h('div', {}, usd(v.value)), m ? h('div', {class: 'note'}, m) : '');
    })))))), panel);
}

// The cleaning, one row per value: what the filing printed, what was done to it, what came out, and how it was checked.
function cleaningTable(values) {
  const rows = values.map((v) => {
    const s = v.sources, one = s[0] || {};
    const scale = one.scale ? ({1: 'units', 1000: 'thousands', 1000000: 'millions', 1000000000: 'billions'})[one.scale] || `×${one.scale}` : '';
    const steps = [];
    if (v.field === 'opex') steps.push('revenue − cost of revenue − operating income, one column');
    if (scale && scale !== 'units') steps.push(`in ${scale}`);
    if (s.some((x) => /^\(|^-/.test(x.cell || '') && x.value > 0)) steps.push('brackets → positive');
    if (s.some((x) => /^[—–-]$/.test((x.cell || '').trim()))) steps.push('dash → 0');
    if (s.some((x) => x.field === 'cost_of_revenue_part')) steps.push(`${s.filter((x) => x.field === 'cost_of_revenue_part').length} cost lines summed`);
    steps.push(`column “${(one.col || '').split(' | ').pop()}” → ${v.period}`);
    steps.push(v.basis === 'restated' ? `newest 10-K (${day(one.filed)}); first reported ${usd(v.first_reported)}` : `10-K filed ${day(one.filed)}`);
    const check = v.decision ? `decided: ${v.decision.kind}` : v.label === 'agree' ? 'matches SEC' : v.label === 'definition_gap' ? 'cost lines: your call' : XBRL[v.label] || v.label;
    return {v, field: LABEL[v.field], period: v.period, printed: v.field === 'opex' ? s.map((x) => `${({revenue: 'revenue', cost_of_revenue: 'cost', cost_of_revenue_part: 'cost line', operating_income: 'op. income'})[x.field] || x.field} ${x.cell}`).join('\n') : one.cell, row: v.field === 'opex' ? '' : one.row, steps, value: v.value, check,
      confirmed: s.length && s.every((x) => x.machine && x.machine.match)};
  });
  return table([{t: 'Value', k: 'field', s: (r) => r.field + r.period, f: (r) => [r.field, ' ', h('span', {class: 'muted'}, r.period)]},
    {t: 'In the 10-K', k: 'printed', f: (r) => [h('span', {class: 'mono brk'}, r.printed || '—'), r.row ? h('div', {class: 'muted small brk'}, r.row) : '']},
    {t: 'Cleaning', sort: false, f: (r) => h('div', {class: 'small brk'}, r.steps.join(', ')), wide: 1},
    {t: 'Value', k: 'value', n: 1, f: (r) => usd(r.value)},
    {t: 'Checked', k: 'check', f: (r) => h('span', {class: r.check === 'matches SEC' ? 'muted' : null}, r.check, r.confirmed ? h('div', {class: 'muted small'}, 're-read on filing') : '')}],
    rows, {detail: (r) => sources(r.v)});
}

const tok = (d) => (d.agent && d.agent.detail.input_tokens != null ? d.agent.detail.input_tokens + d.agent.detail.output_tokens : null);

function rawAnswer(accession) {
  const pre = h('pre', {class: 'raw'}, 'Loading…');
  fetch('/api/output?accession=' + encodeURIComponent(accession)).then((r) => (r.ok ? r.json() : Promise.reject(new Error('no saved answer'))))
    .then((j) => { pre.textContent = JSON.stringify(j, null, 1); }).catch((e) => { pre.textContent = e.message; });
  return pre;
}

function sources(v) {
  const wrap = h('div', {});
  if (v.decision) wrap.append(h('div', {class: 'src'}, h('div', {}, `${v.decision.reviewer} decided: ${v.decision.kind}`), h('div', {class: 'muted'}, v.decision.reason)));
  if (v.why) wrap.append(h('div', {class: 'src'}, h('div', {class: 'muted'}, 'The 10-K says: ', v.why.text.slice(0, 400)), h('a', {href: v.why.url, target: '_blank', rel: 'noopener'}, 'Open that passage')));
  for (const s of v.sources) {
    wrap.append(h('div', {class: 'src'},
      h('div', {}, `${LABEL[s.field] || s.field}: `, h('b', {}, s.cell), ` in row “${s.row}”, column “${s.col.replaceAll(' | ', ' ')}”`),
      h('div', {class: 'muted small'}, `10-K filed ${day(s.filed)}, table ${s.table_id}, ${s.unit || 'unit from the document'}, prompt ${s.prompt}`, s.notes ? `, ${s.notes}` : ''),
      h('div', {class: 'small' + (s.machine && !s.machine.match ? ' bad' : ' muted')}, s.machine ? (s.machine.match ? 'Confirmed on the rendered 10-K' : `Rendered 10-K shows ${s.machine.seen}`) : 'Not re-read'),
      s.machine?.img && h('img', {src: '/' + s.machine.img, alt: `Screenshot of the cited cell ${s.cell}`, loading: 'lazy'}),
      h('a', {href: s.deep, target: '_blank', rel: 'noopener', class: 'small'}, 'Open the 10-K at This Row')));
  }
  if (!v.sources.length) wrap.append(h('p', {class: 'muted'}, 'No citation.'));
  return wrap;
}

function agentCard(a) {
  let shown = a.prompt;
  const text = h('textarea', {readonly: true, 'aria-label': 'Prompt text', spellcheck: 'false'});
  const verSel = h('select', {'aria-label': 'Prompt version', onchange: (e) => { shown = e.target.value; showPrompt(); }},
    a.versions.map((v) => h('option', {value: v, selected: v === a.prompt || null}, v === a.prompt ? `${v} (in use)` : v)));
  const note = h('input', {type: 'text', placeholder: 'What changed and why…', 'aria-label': 'What changed and why', style: 'flex:1;min-width:14rem'});
  const status = h('span', {class: 'muted small', 'aria-live': 'polite'});
  const editBtn = h('button', {type: 'button', onclick: () => startEdit()}, 'Edit');
  const useBtn = h('button', {type: 'button', onclick: () => post('use', {version: shown}, `Now using ${shown}.`)}, 'Use This Version');
  const saveBtn = h('button', {type: 'button', class: 'btn', onclick: () => post('prompt', {text: text.value, note: note.value}, (r) => `Saved as ${r.version} and in use.`)}, 'Save as New Version');
  const cancelBtn = h('button', {type: 'button', onclick: () => { showPrompt(); }}, 'Cancel');
  const editRow = h('div', {class: 'hrow', hidden: true}, note, saveBtn, cancelBtn);
  function showPrompt() {
    text.value = a.prompts[shown]; text.readOnly = true; editRow.hidden = true; editBtn.hidden = false;
    useBtn.hidden = shown === a.prompt; text.style.height = 'auto'; text.style.height = Math.min(900, text.scrollHeight + 4) + 'px';
  }
  function startEdit() { text.readOnly = false; editRow.hidden = false; editBtn.hidden = true; useBtn.hidden = true; text.focus(); }
  async function post(what, body, done) {
    status.textContent = 'Saving…';
    try {
      const r = await api(`/api/agents/${a.id}/${what}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({...body, by: me})});
      status.textContent = typeof done === 'function' ? done(r) : done;
      setTimeout(route, 900);
    } catch (e) { status.textContent = e.message; status.classList.add('bad'); }
  }
  const model = h('input', {type: 'text', value: a.llm.model, 'aria-label': 'Model id', style: 'width:14rem'});
  const modelSave = h('button', {type: 'button', onclick: () => post('model', {model: model.value}, `Model set to ${model.value}.`)}, 'Save Model');

  const allRuns = a.runs;  // newest first
  const latest = [...allRuns.reduce((m, r) => (m.has(r.accession) ? m : m.set(r.accession, r)), new Map()).values()];  // the newest run of each filing
  let runs = latest;
  const tickers = [...new Set(allRuns.map((r) => r.ticker).filter(Boolean))].sort();
  const everyRun = h('label', {class: 'small muted'}, h('input', {type: 'checkbox', onchange: (e) => { runs = e.target.checked ? allRuns : latest; drawRuns(); }}), ` show every run (${int(allRuns.length)}), not just the latest per filing`);
  const runBox = h('div');
  const runFilter = h('select', {'aria-label': 'Filter runs by company', onchange: () => drawRuns()}, h('option', {value: ''}, 'All companies'), tickers.map((t) => h('option', {value: t}, t)));
  function drawRuns() {
    const list = runs.filter((r) => !runFilter.value || r.ticker === runFilter.value).sort((x, y) => (x.outcome === 'ok') - (y.outcome === 'ok'));
    runBox.replaceChildren(table([{t: 'When', k: 'started_at', f: (r) => when(r.started_at)}, {t: 'Company', k: 'ticker'}, {t: 'Fiscal year end', k: 'period', f: (r) => day(r.period), wide: 1},
      {t: 'Model', s: (r) => r.versions.model, f: (r) => r.versions.model || h('span', {class: 'muted'}, 'in-session')}, {t: 'Prompt', s: (r) => r.versions.prompt, f: (r) => r.versions.prompt},
      {t: 'Tokens', n: 1, s: (r) => (r.detail.input_tokens ?? 0) + (r.detail.output_tokens ?? 0), f: (r) => (r.detail.input_tokens != null ? int(r.detail.input_tokens + r.detail.output_tokens) : '—')},
      {t: 'Tries', n: 1, s: (r) => r.detail.attempts, f: (r) => r.detail.attempts ?? '—'},
      {t: 'Outcome', k: 'outcome', f: (r) => h('span', {class: r.outcome === 'ok' ? null : 'bad'}, r.outcome === 'ok' ? `${r.detail.values ?? '—'} values` : r.detail.error || r.outcome)}],
      list, {detail: (r) => rawAnswer(r.accession)}));
  }
  drawRuns();
  const tokens = latest.reduce((s, r) => s + (r.detail.input_tokens ?? 0) + (r.detail.output_tokens ?? 0), 0);
  const failed = latest.filter((r) => r.outcome !== 'ok').length;
  const per = a.cost;

  const card = h('div', {class: 'stack'},
    h('section', {}, h('h2', {}, a.name), h('p', {class: 'lede'}, a.job)),
    h('div', {class: 'two'},
      h('section', {}, h('h2', {}, 'Decides'), h('ul', {class: 'plain'}, a.decides.map((d) => h('li', {}, d)))),
      h('section', {}, h('h2', {}, 'Checked by'), h('ul', {class: 'plain'}, a.checked_by.map((d) => h('li', {}, d))))),
    h('section', {}, h('h2', {}, 'Model'), h('p', {class: 'muted', style: 'margin-bottom:.6rem'}, a.llm.runs_on), h('div', {class: 'hrow'}, model, modelSave)),
    h('section', {}, h('h2', {}, 'Prompt'), h('div', {class: 'hrow', style: 'margin-bottom:.8rem'}, verSel, editBtn, useBtn, h('span', {class: 'muted small'}, 'A saved prompt is not used until a person switches it on here. Switching the prompt or model makes the next run ask the agent again for every filing.')),
      text, editRow),
    h('section', {class: 'hrow'}, status),
    h('section', {}, h('h2', {}, 'History'), table([{t: 'When', k: 'at', f: (x) => when(x.at)}, {t: 'Who', k: 'by'}, {t: 'Change', k: 'change'}], [...a.history].reverse())),
    h('section', {}, h('h2', {}, 'Runs'), h('p', {class: 'muted', style: 'margin-bottom:.6rem'},
        `${int(latest.length)} filings read, ${compact(tokens)} tokens, ${failed} failed.`, per ? ` A new company costs about ${per.minutes} min and ${compact(per.tokens)} tokens (average of ${per.companies}).` : '', ' Failures first; click a run for its answer.'),
      h('div', {class: 'hrow', style: 'margin-bottom:.6rem'}, runFilter, everyRun), runBox));
  queueMicrotask(showPrompt);
  return card;
}

const COLORS = ['#2f5bd3', '#d9822b', '#2a9d8f', '#c43d6b', '#7a5cc4', '#6b8e23', '#8c6d46', '#3d8fc4'];  // fixed order: a colour follows its entity
function lineChart(rows, years, tickers, ratio) {
  const W = 520, H = 240, L = 56, R = 64, T = 10, B = 26;
  const vals = rows.map((r) => r.value);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const x = (y) => L + (years.length === 1 ? (W - L - R) / 2 : (years.indexOf(y) * (W - L - R)) / (years.length - 1));
  const yv = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ns = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs) => { const el = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
  const svg = s('svg', {viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img', 'aria-label': 'Line chart'});
  const fmtAxis = (v) => {
    if (ratio) return Math.round(v * 100) + '%';
    const a = Math.abs(v), sign = v < 0 ? '−' : '';
    return a >= 1e9 ? `${sign}$${+(a / 1e9).toFixed(a >= 1e10 ? 0 : 1)}B` : `${sign}$${+(a / 1e6).toFixed(a >= 1e7 ? 0 : 1)}M`;
  };
  for (let i = 0; i <= 4; i++) {
    const v = lo + ((hi - lo) * i) / 4;
    svg.append(s('line', {x1: L, x2: W - R, y1: yv(v), y2: yv(v), stroke: 'var(--faint)', 'stroke-width': 1}));
    const t = s('text', {x: L - 6, y: yv(v) + 4, 'text-anchor': 'end'}); t.textContent = fmtAxis(v); svg.append(t);
  }
  years.forEach((y) => { const t = s('text', {x: x(y), y: H - 6, 'text-anchor': 'middle'}); t.textContent = y.replace('FY', ''); svg.append(t); });
  const tip = $('#tip'), ends = [];
  tickers.forEach((tk, i) => {
    const pts = rows.filter((r) => r.ticker === tk).sort((a, b) => a.period.localeCompare(b.period));
    if (!pts.length) return;
    const color = COLORS[i % COLORS.length];
    svg.append(s('polyline', {points: pts.map((p) => `${x(p.period)},${yv(p.value)}`).join(' '), fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}));
    for (const p of pts) {
      const dot = s('circle', {cx: x(p.period), cy: yv(p.value), r: 3.5, fill: color});
      const hit = s('circle', {cx: x(p.period), cy: yv(p.value), r: 10, fill: 'transparent'});
      hit.addEventListener('mousemove', (e) => { tip.hidden = false; tip.textContent = `${p.company} ${p.period}: ${ratio ? (100 * p.value).toFixed(1) + '%' : usd(p.value)}`; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px'; });
      hit.addEventListener('mouseleave', () => { tip.hidden = true; });
      svg.append(dot, hit);
    }
    const last = pts[pts.length - 1];
    ends.push({tk, color, x: x(last.period) + 7, y: yv(last.value) + 4});
  });
  ends.sort((a, b) => a.y - b.y);  // end labels: keep 12px apart so none overlap
  for (let i = 1; i < ends.length; i++) if (ends[i].x === ends[i - 1].x && ends[i].y - ends[i - 1].y < 12) ends[i].y = ends[i - 1].y + 12;
  for (const e of ends) { const lab = s('text', {x: e.x, y: e.y}); lab.textContent = e.tk; lab.style.fill = e.color; svg.append(lab); }
  return h('div', {}, svg);
}

let hqCache = null;
const hq = async (fresh) => (hqCache = !fresh && hqCache ? hqCache : await api('/api/hq'));
const confirmedCell = (f) => (f.confirmed ? h('span', {class: 'muted'}, 'agrees') : h('span', {class: 'bad'}, "can't confirm"));
const pct = (x) => (x == null ? '—' : x < .001 ? '<0.1%' : `${(100 * x).toFixed(x < .1 ? 1 : 0)}%`);
const fig = (l, n, s, bad) => h('div', {class: 'fig'}, h('div', {class: 'l'}, l), h('div', {class: 'n' + (bad ? ' bad' : '')}, n), h('div', {class: 's' + (bad ? ' bad' : '')}, s));
const sect = (title, note, ...body) => h('section', {}, h('div', {class: 'sechead'}, h('h2', {}, title), note ? h('span', {class: 'muted small'}, note) : ''), ...body);
const INDUSTRY = {hyperscaler: 'Hyperscaler', neocloud: 'Neocloud', miner_to_hpc: 'Miner to HPC', chip_seller: 'Chip design', chip_equipment: 'Chip equipment', component_supplier: 'Memory, networking, servers', datacenter_build: 'Data-center build', datacenter_landlord: 'Data-center landlord', power: 'Power producer', ai_software: 'AI software', other: 'Adopters and other'};
const METHOD = {stated_share: 'stated share', stated_amount: 'stated amount', segment: 'segment', ppe_category: 'server category growth', whole_business: 'whole business', commitment: 'commitments', qualitative: 'words only', none: 'none'};
const METHOD_NOTE = {stated_share: 'the company said the share', stated_amount: 'the company said the amount', segment: 'the AI segment’s capex in the notes', ppe_category: 'growth in the server and network category; all servers, not only AI', whole_business: 'a single-segment AI business', qualitative: 'words, no number', none: 'nothing links the spend to AI'};
function change(f) {
  if (f.kind === 'restated') return `${usd(f.before)} → ${usd(f.after)} (${f.after >= f.before ? '+' : '−'}${pct(f.size)})`;
  if (f.kind === 'jump') return `${usd(f.before)} → ${usd(f.after)} (${f.size.toFixed(1)}×)`;
  if (f.kind === 'capex_intensity') return `capex ${pct(f.size)} of revenue`;
  if (f.kind === 'opex_over_revenue') return `opex ${usd(f.after)} on revenue ${usd(f.before)}`;
  return h('span', {class: 'small'}, (f.message || '').slice(0, 140));
}

// A job (add a company, or rerun attribution) and its steps, polled while it runs.
function jobBox(onDone, kind) {
  const box = h('div');
  let timer = null;
  async function poll() {
    clearTimeout(timer);
    const j = await api('/api/job');
    if (!j || (kind && (j.kind || 'run') !== kind)) { box.replaceChildren(); return; }
    const mark = {done: 'done', running: 'running', waiting: ''};
    box.replaceChildren(
      h('div', {class: 'sechead'}, h('h2', {}, j.kind === 'attribution' ? `Attribution: ${j.ticker === 'all' ? 'every company' : INDUSTRY[j.ticker] || j.ticker}` : j.ticker),
        h('span', {class: 'muted small'}, j.running ? `running since ${when(j.started)}` : j.exit === 0 ? 'finished' : j.exit == null ? '' : `stopped (exit ${j.exit})`)),
      h('div', {class: 'steps'}, j.steps.map((s) => h('div', {class: `stp ${s.state}`},
        h('span', {class: 'state'}, mark[s.state]), h('div', {}, h('div', {}, s.label), s.summary ? h('div', {class: 'muted small'}, s.summary) : '')))),
      !j.running && j.exit !== 0 && j.exit != null ? h('pre', {class: 'raw'}, j.tail.join('\n')) : '',
      !j.running && j.exit === 0 && j.kind !== 'attribution' ? h('p', {}, h('a', {href: '#company/' + j.ticker}, `Open ${j.ticker}`)) : '');
    if (j.running) timer = setTimeout(poll, 2000); else if (onDone) onDone(j);
  }
  poll();
  return box;
}

// ── Data-first pieces: a cell with intensity, a mini bar, year bars, a dot plot ──────────────────────────────────
const heat = (v, max, text, cls) => h('td', {class: 'n c ' + (cls || ''), role: 'button', style: `--i:${Math.max(0, Math.min(1, max ? v / max : 0)).toFixed(3)}`}, text);
const mini = (share, text) => h('div', {class: 'mini'}, h('i', {style: `width:${Math.max(0, Math.min(100, 100 * (share || 0))).toFixed(1)}%`}), h('span', {}, text));
// One row per year: a dark AI part inside a light whole, labelled with both.
function yearBars(rows, max) {
  return h('div', {class: 'bars'}, rows.map((r) => h('div', {class: 'bar'}, h('span', {}, r.label, r.sub ? h('span', {class: 'muted small'}, `, ${r.sub}`) : ''),
    h('div', {class: 'track'}, h('i', {class: 'rest', style: `width:${(100 * r.whole / max).toFixed(2)}%`}), h('i', {style: `width:${(100 * (r.part || 0) / max).toFixed(2)}%`})),
    h('span', {class: 'v'}, r.part != null ? `${usd(r.part)} of ${usd(r.whole)}` : usd(r.whole)))));
}
// Reference vs ours on a 0–100% axis: a bar for a floor or ceiling, a tick for a stated figure, a dot for ours.
function dotPlot(rows) {
  const W = 360, H = 22, L = 4, R = 4;
  const x = (v) => L + (W - L - R) * Math.max(0, Math.min(1, v));
  const ns = 'http://www.w3.org/2000/svg', s = (tag, a) => { const el = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(a)) el.setAttribute(k, v); return el; };
  return h('div', {class: 'dots'}, rows.map((r) => {
    const svg = s('svg', {viewBox: `0 0 ${W} ${H}`, width: '100%', height: H, role: 'img', 'aria-label': `${r.ticker} ${r.period}`});
    svg.append(s('line', {x1: L, x2: W - R, y1: H / 2, y2: H / 2, stroke: 'var(--faint)', 'stroke-width': 2}));
    if (r.relation === 'ge') svg.append(s('rect', {x: x(r.reference), y: H / 2 - 4, width: x(1) - x(r.reference), height: 8, fill: 'var(--faint)'}));
    if (r.relation === 'le') svg.append(s('rect', {x: x(0), y: H / 2 - 4, width: x(r.reference) - x(0), height: 8, fill: 'var(--faint)'}));
    svg.append(s('line', {x1: x(r.reference), x2: x(r.reference), y1: 2, y2: H - 2, stroke: 'var(--muted)', 'stroke-width': 2}));
    if (r.ours != null) svg.append(s('circle', {cx: x(r.ours), cy: H / 2, r: 5, fill: r.outcome === 'agree' ? 'var(--accent)' : 'var(--bad)'}));
    return h('div', {class: 'dotrow'}, h('span', {}, `${r.ticker} ${r.period.slice(2)}`), svg,
      h('span', {class: 'v'}, r.ours == null ? h('span', {class: 'muted'}, 'no estimate') : `${pct(r.ours)} vs ${({eq: '', ge: '≥', le: '≤'})[r.relation]}${pct(r.reference)}`));
  }));
}

// ── Data: the dataset as a grid, provenance one click deep ──────────────────
const FIELDS = {capex: 'Capex', ai_capex: 'AI capex', ai_revenue: 'AI revenue', ai_capex_committed: 'AI capex committed', revenue_guidance: 'Revenue guidance', revenue: 'Revenue', opex: 'Opex', ai_opex: 'AI opex', segment_capex: 'Segment capex', segment_revenue: 'Segment revenue', ppe_category: 'PP&E by category',

const KINDS = {spent: 'spent', committed: 'committed', planned: 'planned'};
const VIEWS = [

async function dataPage(view, qs) {
  const q = parseQ(qs || '');
  const [hqd, meta, ev] = await Promise.all([hq(), api('/api/data?t=&f='), api('/api/evaluation')]);
  const H = hqd.health[0];
  const all = Object.keys(meta.names).sort();
  const sel = {
    t: q.t ? q.t.split(',') : all.filter((t) => (!q.role || meta.roles[t] === q.role) && (!q.ind || meta.industries[t] === q.ind)),
    f: (q.f || 'ai_capex').split(','), k: q.k ? q.k.split(',') : ['spent', 'committed', 'planned'], y: q.y ? q.y.split(',') : null, wide: !!q.wide, eval: !!q.eval};
  const setQ = () => { const p = new URLSearchParams(); p.set('t', sel.t.join(',')); p.set('f', sel.f.join(',')); if (sel.y) p.set('y', sel.y.join(',')); if (sel.k.length < 3) p.set('k', sel.k.join(',')); if (sel.wide) p.set('wide', 1); if (sel.eval) p.set('eval', 1); location.hash = 'data?' + p.toString(); };

  const GROUPS = [['all', 'All companies'], ['buyer', 'Buyers'], ['seller', 'Sellers'], ...Object.keys(INDUSTRY).map((k) => ['ind:' + k, INDUSTRY[k]]), ['custom', 'Custom…']];
  const groupOf = () => { const set = new Set(sel.t); if (set.size === all.length) return 'all'; for (const r of ['buyer', 'seller']) if (all.filter((t) => meta.roles[t] === r).every((t) => set.has(t)) && [...set].every((t) => meta.roles[t] === r)) return r; for (const k of Object.keys(INDUSTRY)) if (all.filter((t) => meta.industries[t] === k).every((t) => set.has(t)) && [...set].every((t) => meta.industries[t] === k)) return 'ind:' + k; return 'custom'; };

  const fieldSel = h('select', {'aria-label': 'Field', onchange: (e) => { sel.f = [e.target.value]; setQ(); }}, Object.entries(FIELDS).map(([k, v]) => h('option', {value: k, selected: sel.f[0] === k || null}, v)));

    [['all', 'Spent, committed, planned'], ['spent', 'Spent'], ['committed', 'Committed'], ['planned', 'Planned']].map(([k, v]) => h('option', {value: k, selected: (sel.k.length === 3 ? 'all' : sel.k[0]) === k || null}, v)));
  function openPicker() {
    drawer(h('h3', {}, 'Companies'), h('div', {class: 'controls'}, Object.entries(groups).map(([ind, ts]) => h('div', {}, h('div', {class: 'muted small', style: 'margin-bottom:.2rem'}, INDUSTRY[ind] || ind),
      h('div', {class: 'picks'}, ts.map((t) => h('label', {}, h('input', {type: 'checkbox', checked: sel.t.includes(t) || null, onchange: (e) => { sel.t = e.target.checked ? [...sel.t, t] : sel.t.filter((x) => x !== t); }}), ' ', t)))))),
      h('div', {class: 'hrow', style: 'margin-top:1rem'}, h('button', {type: 'button', class: 'btn', onclick: () => { closeDrawer(); setQ(); }}, 'Apply')));
  }
  const groups = {};
  for (const t of all) (groups[meta.industries[t]] ||= []).push(t);

  // data for the selection
  const d = await api('/api/data?' + new URLSearchParams({t: sel.t.join(','), f: sel.f.join(','), k: sel.k.join(',')}).toString());
  const rows = q.check ? d.rows.filter((r) => q.check.split(',').includes(r.check) || (q.check.includes('flag') && r.flag)) : d.rows;
  const years = [...new Set(rows.map((r) => r.period))].sort().filter((y) => !sel.y || sel.y.includes(y));
  const changed = new Set([...(hqd.since?.changed || []).map((c) => c.key), ...((await api('/api/attribution')).diff?.rows || []).map((r) => r.key.split('|').slice(0, 3).join('|'))]);
  const seriesKey = (r) => `${r.ticker}|${r.field}|${r.dimension}`;
  const series = new Map();
  for (const r of rows) { if (!years.includes(r.period)) continue; const k = seriesKey(r); if (!series.has(k)) series.set(k, {ticker: r.ticker, field: r.field, dimension: r.dimension, y: {}}); series.get(k).y[r.period] = r; }
  const list = [...series.values()].sort((a, b) => Math.max(0, ...Object.values(b.y).map((r) => r.value)) - Math.max(0, ...Object.values(a.y).map((r) => r.value)));
  const maxV = Math.max(1, ...rows.map((r) => r.value));

  // panel
  async function showProv(r) {
    const p = r.prov;
    const bits = [h('h3', {style: 'margin:0 0 .4rem'}, `${d.names[r.ticker]}, ${FIELDS[r.field] || r.field}${r.dimension ? ', ' + r.dimension : ''}, ${r.period}`),
      h('div', {class: 'figs', style: 'margin-bottom:1rem'}, fig('Value', usd(r.value), r.range ? `${usd(r.range[0])} – ${usd(r.range[1])}` : KINDS[r.kind]),
        r.share != null ? fig('Share of capex', pct(r.share), `confidence ${pct(r.confidence)}`) : '',
        fig('Method', r.method === 'cell' ? 'cell' : METHOD[r.method] || r.method, r.check ? CHECK[r.check] || r.check : p.model ? `model ${p.model}` : p.source ? p.source.replace('_', ' ') : '')),
      r.basis && r.method !== 'cell' ? h('p', {style: 'margin-bottom:.6rem'}, r.basis) : '',
      p.inputs ? h('p', {class: 'muted small mono', style: 'margin-bottom:.6rem'}, p.inputs) : '',
      p.xbrl != null ? h('p', {class: 'muted small'}, `XBRL: ${usd(p.xbrl)}`) : '',
      p.url ? h('p', {class: 'small'}, h('a', {href: p.url, target: '_blank', rel: 'noopener'}, 'Open the Filing')) : ''];
    const box = drawer(...bits);
    if (p.table === 'values') {  // the cell, the cleaning and the screenshot, from the company's own data
      const c = await api('/api/company?t=' + r.ticker);
      const v = c.values.find((x) => x.field === r.field && x.period === r.period);
      if (v) box.append(sources(v));
    }
  }

  // the auditor's mark: traced (agrees with its source), untraced (checked, no source to agree with), disagrees
  const evOut = Object.fromEntries((ev?.rows || []).map((e) => [`${e.ticker}|${e.period}`, e.outcome]));
  function mark(r) {
    let k = 'u', why = 'checked, no tagged counterpart to agree with';
    if (r.check === 'agree') { k = 't'; why = 'agrees with the SEC’s XBRL'; }
    else if (r.check === 'unresolved') { k = 'd'; why = 'differs from the SEC’s XBRL'; }
    else if (r.check === 'definition_gap') { k = 't'; why = 'differs from the SEC’s tag by a definition on file'; }
    else if (r.field === 'ai_capex') { const o = evOut[`${r.ticker}|${r.period}`]; if (o === 'agree') { k = 't'; why = 'agrees with what the company stated'; } else if (o === 'disagree') { k = 'x'; why = 'disagrees with what the company stated'; } else { why = 'recomputed from its inputs; no stated figure to compare'; } }
    else if (r.method === 'stated') { k = 't'; why = 'quoted from the company, checked against the text'; }
    const marks = [h('span', {class: 'mk ' + k, title: why, 'aria-label': why}, k === 'x' ? '✗' : k === 'd' ? '≠' : '✓')];
    if (r.flag === 'share_over_total') marks.push(h('span', {class: 'mk o', title: 'the AI amount is more than the whole total: accrual segment capex against cash capex', 'aria-label': 'above the total'}, '!'));
    if (r.status) marks.push(h('span', {class: 'badge bg-' + ({fix_pending: 'yellow', accepted: 'green', explained: 'azure', blocks: 'red'})[r.status] + '-lt ms-1', title: r.status.replace('_', ' ')}, ({fix_pending: 'fix', accepted: 'ok', explained: 'expl', blocks: 'block'})[r.status]));
    return marks;
  }
  // grid
  const grid = h('div', {class: 'scroll'}, h('table', {class: 'heat'},
    h('thead', {}, h('tr', {}, h('th', {}, 'Entity'), sel.f.length > 1 ? h('th', {}, 'Field') : '', list.some((s) => s.dimension) ? h('th', {}, 'Segment / category') : '', years.map((y) => h('th', {class: 'n'}, y.slice(2))))),
    h('tbody', {}, list.map((s) => h('tr', {}, h('td', {}, h('a', {href: `#data?t=${s.ticker}&f=${sel.f.join(',')}`}, d.names[s.ticker]), ' ', h('span', {class: 'muted small'}, s.ticker)),
      sel.f.length > 1 ? h('td', {class: 'muted small'}, FIELDS[s.field] || s.field) : '', list.some((x) => x.dimension) ? h('td', {class: 'small'}, s.dimension || '') : '',
      years.map((y) => {
        const r = s.y[y];
        if (!r) return h('td', {class: 'n muted'}, '');
        const c = h('td', {class: 'n c', role: 'button'}, h('div', {}, usd(r.value), mark(r)), r.share != null ? h('div', {class: 'note'}, pct(r.share)) : '');
        c.classList.add('cell'); c.tabIndex = 0;
        if (changed.has(`${r.ticker}|${r.field}|${r.period}`)) c.classList.add('moved');
        c.addEventListener('click', () => showProv(r));
        return c;
      }))))));

  // chart of the selection: one series per entity (and dimension), up to eight

  const chart = chartRows.length ? lineChart(chartRows, years, [...new Set(chartRows.map((r) => r.ticker))], false) : h('p', {class: 'muted'}, 'Nothing selected.');

  function exportCsv() {
    const cols = ['ticker', 'company', 'field', 'dimension', 'period', 'kind', 'value', 'share', 'method', 'confidence', 'check', 'basis', 'source_url', 'provenance'];
    const esc = (v) => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replaceAll('"', '""') + '"' : s; };
    const out = rows.filter((r) => years.includes(r.period)).map((r) => [r.ticker, d.names[r.ticker], r.field, r.dimension, r.period, r.kind, r.value, r.share ?? '', r.method, r.confidence ?? '', r.check ?? '', r.basis, r.prov.url ?? '', r.prov.inputs || r.prov.extractions || r.prov.text || '']);
    const csv = [cols.join(','), ...out.map((x) => x.map(esc).join(','))].join('\n') + '\n';
    const a = h('a', {href: URL.createObjectURL(new Blob([csv], {type: 'text/csv'})), download: `capex-ledger-${sel.f.join('-')}.csv`});
    document.body.append(a); a.click(); a.remove();
  }

  const chartBox = h('details', {}, h('summary', {class: 'muted small', style: 'cursor:pointer'}, 'Chart'), h('div', {style: 'margin-top:.8rem'}, chart));
  view.append(h('div', {class: 'stack', style: 'gap:1rem'},
    h('div', {class: 'hrow'}, fieldSel, groupSel, kindSel, h('button', {type: 'button', class: 'btn', onclick: exportCsv}, 'Export CSV'),

// ── Flow: the job. A queue of issues, the four stages as context, ending at release ─────────────────────────────
const STATE = {blocked: 'Blocked', disagrees: 'Disagrees', new: 'New', moved: 'Moved', look: 'Look'};
const ACTION = {run: 'Run', definition: 'Add a definition', method: 'Open the model', release: 'Release', open: 'Open'};
const QKIND = {new_filing: 'New filing at the SEC, not read', blocked: 'Blocked: needs a definition', reference_disagrees: 'Attribution disagrees with a stated reference',
  fact_changed: 'Fact changed since the last release', fact_differs: 'Fact differs from the filing’s XBRL tag', attribution_moved: 'Attribution moved in the last load', finding_unconfirmed: 'Finding the SEC’s data can’t confirm'};
let attrCache = null, showResolved = false;
async function openModel(ind) {
  attrCache ||= await api('/api/attribution');
  const m = attrCache.models[ind];
  let shown = m.version;
  const status = h('span', {class: 'muted small', 'aria-live': 'polite'});
  const text = h('textarea', {readonly: true, 'aria-label': 'Model text', spellcheck: 'false', style: 'min-height:18rem'});
  const verSel = h('select', {'aria-label': 'Model version', onchange: (e) => { shown = e.target.value; show(); }}, m.versions.map((v) => h('option', {value: v, selected: v === m.version || null}, v === m.version ? `${v} (in use)` : v)));
  const note = h('input', {type: 'text', placeholder: 'What changed and why…', 'aria-label': 'What changed and why', style: 'flex:1;min-width:12rem'});
  const editBtn = h('button', {type: 'button', onclick: () => { text.readOnly = false; editRow.hidden = false; editBtn.hidden = true; useBtn.hidden = true; text.focus(); }}, 'Edit');
  const useBtn = h('button', {type: 'button', onclick: () => post('use', {version: shown}, `Now using ${shown}. Rerun the industry.`)}, 'Use This Version');
  const saveBtn = h('button', {type: 'button', class: 'btn', onclick: () => post('save', {text: text.value, note: note.value}, (r) => `Saved as ${r.version}; not in use until switched on.`)}, 'Save as New Version');
  const cancelBtn = h('button', {type: 'button', onclick: show}, 'Cancel');
  const editRow = h('div', {class: 'hrow', hidden: true}, note, saveBtn, cancelBtn);
  const dryBox = h('div', {style: 'margin-top:.8rem'});
  async function showDry() {
    const r = await api('/api/dryrun?version=' + encodeURIComponent(shown));
    dryBox.replaceChildren();
    if (!r) return;
    const rb = r.reference.before, ra = r.reference.after;
    dryBox.append(h('p', {class: 'small'}, h('b', {style: 'font-weight:500'}, `Dry run of ${r.version}`), ` (${day(r.at)}, ${r.companies.length} companies): ${int(r.changed.length)} rows would change, ${int(r.new.length)} new, ${int(r.removed.length)} removed. Reference: ${rb.agree} of ${rb.n} agree now, ${ra.agree} of ${ra.n} with ${r.version}${ra.disagree !== rb.disagree ? ` (${ra.disagree} disagree vs ${rb.disagree})` : ''}.`),
      r.changed.length ? table([{t: 'Row', sort: false, f: (c) => h('span', {class: 'mono small'}, c.key)}, {t: 'Now', sort: false, f: (c) => `${METHOD[c.before[0]] || c.before[0]}${c.before[1] != null ? ', ' + usd(c.before[1]) : ''}`}, {t: `With ${r.version}`, sort: false, f: (c) => `${METHOD[c.after[0]] || c.after[0]}${c.after[1] != null ? ', ' + usd(c.after[1]) : ''}`}], r.changed.slice(0, 20)) : '');
  }
  const dryBtn = h('button', {type: 'button', onclick: async () => {
    status.textContent = 'Starting the dry run…';
    try { await api('/api/dryrun', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({version: shown, by: me})}); status.textContent = 'Dry run running; reopen this model when it ends.'; dryBox.replaceChildren(jobBox(() => showDry(), 'dryrun')); }
    catch (e) { status.textContent = e.message; status.classList.add('bad'); }
  }}, 'Dry Run');
  const rerunBtn = h('button', {type: 'button', class: 'btn', onclick: async () => {
    status.textContent = 'Starting…';
    try { await api('/api/attribute', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({industry: ind, by: me})}); status.textContent = 'Running; the queue updates when it ends.'; setTimeout(route, 1500); }
    catch (e) { status.textContent = e.message; status.classList.add('bad'); }
  }}, `Rerun ${INDUSTRY[ind]}`);
  function show() { text.value = m.texts[shown]; text.readOnly = true; editRow.hidden = true; editBtn.hidden = false; useBtn.hidden = shown === m.version; dryBtn.hidden = shown === m.version; text.style.height = 'auto'; text.style.height = Math.min(520, text.scrollHeight + 4) + 'px'; showDry(); }
  async function post(what, body, done) {
    status.textContent = 'Saving…';
    try { const r = await api(`/api/models/${ind}/${what}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({...body, by: me})}); status.textContent = typeof done === 'function' ? done(r) : done; attrCache = null; setTimeout(route, 1200); }
    catch (e) { status.textContent = e.message; status.classList.add('bad'); }
  }
  drawer(h('h3', {}, `${INDUSTRY[ind]} model`), h('p', {class: 'muted small', style: 'margin-bottom:.6rem'}, m.companies.join(', ') || 'no company'),
    h('div', {class: 'hrow', style: 'margin-bottom:.6rem'}, verSel, editBtn, dryBtn, useBtn, rerunBtn, status), dryBox, text, editRow);

  const stage = (title, lines, actions) => h('div', {class: 'stage'}, h('h2', {}, title), h('ul', {class: 'plain'}, lines.map((l) => h('li', {}, l))), actions ? h('div', {class: 'hrow', style: 'margin-top:.5rem'}, actions) : '');

    else if (page === 'agents') await agentsPage(view);
    else if (page === 'releases') await releasesPage(view);
    else if (page === 'run') await runPage(view);
    else if (page === 'status') await statusPage(view);
    else if (page === 'data' || page === 'insights') await dataPage(view, qs);
    else await proofPage(view);
  } catch (e) {
    view.replaceChildren(h('p', {class: 'msg bad'}, e.message));
  }
  skin(view);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
