<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DATAHQ</title>
<style>
  /* Plain pages, whitespace instead of borders. One accent (ink blue); red only for a failure. */
  :root {
    --bg: #fbfbfa; --fg: #1c1d1f; --muted: #6b6e74; --faint: #e9e9e6; --accent: #2f5bd3; --bad: #c43d2f;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141518; --fg: #e8e8e6; --muted: #9a9da3; --faint: #26282d; --accent: #7a9cff; --bad: #ff7a6b; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 76rem; margin: 0 auto; padding: 0 max(16px, 3vw) 6rem; }
  nav { display: flex; gap: 1.75rem; align-items: baseline; padding-block: 1.25rem 2rem; flex-wrap: wrap; }
  nav .brand { font-weight: 600; letter-spacing: .06em; margin-right: auto; color: var(--fg); }
  nav a { color: var(--muted); }
  nav a.on { color: var(--fg); }
  nav .me { margin-left: 1rem; }
  nav .me input { width: 9rem; border: 0; border-bottom: 1px solid var(--faint); background: none; padding: .1rem 0; font-size: .82rem; }
  h1 { font-size: 1.6rem; font-weight: 500; margin: 0; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .6rem; }
  p { margin: 0; }
  .lede { color: var(--muted); max-width: 62ch; margin-top: .35rem; }
  .lede b { color: var(--fg); font-weight: 600; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .small { font-size: .82rem; }
  .mono { font-family: var(--mono); font-size: .82rem; }
  .stack { display: grid; gap: 3rem; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 3rem; }
  .two > *, .stack > * { min-width: 0; }
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); gap: 1.5rem; }
  .fig .n { font-size: 2.1rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .fig .l, .fig .s { color: var(--muted); font-size: .82rem; }
  .bars { display: grid; gap: .55rem; }
  .bar { display: grid; grid-template-columns: minmax(8rem, 12rem) 1fr auto; gap: .75rem; align-items: center; }
  .bar .v { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { height: 8px; border-radius: 4px; background: var(--faint); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .track i.bad { background: var(--bad); }
  .track i.note { background: var(--muted); opacity: .5; }
  .track i + i { margin-left: 0; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 400; color: var(--muted); font-size: .8rem; padding: 0 1rem .35rem 0; white-space: nowrap; }
  td { padding: .4rem 1rem .4rem 0; vertical-align: top; }
  td.n, th.n { text-align: right; }
  tr.click { cursor: pointer; }
  tr.click:hover td { color: var(--accent); }
  tr.open td { color: var(--accent); }
  .detail td { padding: .25rem 0 1.25rem; color: var(--fg); }
  .src { display: grid; gap: .3rem; margin-bottom: .9rem; max-width: 60rem; }
  .src img { max-width: min(100%, 40rem); border-radius: 4px; margin-top: .3rem; }
  .step { display: grid; grid-template-columns: 11rem 1fr; gap: 1.5rem; }
  .step > * { min-width: 0; }
  .step .head .state { font-size: .82rem; color: var(--muted); margin-top: .15rem; }
  @media (max-width: 44rem) { .step { grid-template-columns: 1fr; gap: .5rem; } .wide { display: none; } .bar { grid-template-columns: 1fr auto; row-gap: .25rem; } .bar .track { grid-column: 1 / -1; } }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  select, input[type=text] { background: var(--bg); border: 1px solid var(--faint); border-radius: 6px; padding: .35rem .55rem; }
  textarea { width: 100%; min-height: 28rem; background: var(--bg); border: 1px solid var(--faint); border-radius: 6px; padding: .75rem; font: .82rem/1.55 var(--mono); }
  textarea[readonly] { border-color: transparent; padding-inline: 0; resize: none; }
  .btn { background: var(--accent); color: var(--bg); border-radius: 6px; padding: .4rem .9rem; }
  .btn[disabled] { opacity: .4; cursor: default; }
  ul.plain { margin: .2rem 0 0; padding-left: 1.1rem; }
  ul.plain li { margin: .15rem 0; }
  .picks { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; }
  .picks label { white-space: nowrap; cursor: pointer; }
  .controls { display: grid; gap: 1.1rem; }
  .controls .k { color: var(--muted); font-size: .8rem; margin-bottom: .2rem; }
  svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
  .tip { position: fixed; pointer-events: none; background: var(--bg); box-shadow: 0 2px 12px rgba(0,0,0,.18); border-radius: 6px; padding: .35rem .6rem; font-size: .8rem; }
  pre.raw { white-space: pre-wrap; word-break: break-word; font: .78rem/1.5 var(--mono); max-height: 30rem; overflow: auto; margin: .5rem 0 0; }
  .msg { color: var(--muted); padding: 2rem 0; }
  .pagehead { display: grid; gap: .3rem; }
  .split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(14rem, 1fr); gap: 3rem; }
  @media (max-width: 52rem) { .split { grid-template-columns: 1fr; } }
  .sechead { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .6rem; }
  .sechead h2 { margin: 0; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: .45rem 1rem; font-variant-numeric: tabular-nums; }
  table.grid td.cell { cursor: pointer; }
  table.grid td.cell:hover { color: var(--accent); }
  table.grid .note { font-size: .74rem; color: var(--muted); white-space: normal; max-width: 9rem; margin-left: auto; }
  .brk { white-space: pre-wrap; word-break: break-word; }
  .steps { display: grid; gap: .8rem; }
  .stp { display: grid; grid-template-columns: 5rem 1fr; gap: 1rem; color: var(--muted); }
  .stp.done, .stp.running { color: var(--fg); }
  .stp .state { font-size: .8rem; color: var(--muted); }
  .stp.running .state { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="#pipeline">DATAHQ</a>
    <a href="#pipeline" data-nav="pipeline">Pipeline</a>
    <a href="#attribution" data-nav="attribution">Attribution</a>
    <a href="#insights" data-nav="insights">Insights</a>
    <span class="me muted small">signed as <input id="me" type="text" aria-label="Your name, logged on every model or prompt change"></span>
  </nav>
  <main id="view"><p class="msg">Loading…</p></main>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k === 'class') el.className = v; else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
};
const int = (n) => (n == null || n === '' ? '—' : Number(n).toLocaleString('en-US'));
const usd = (n) => {
  if (n == null || n === '') return '—';
  const m = Number(n) / 1e6;
  return (m < 0 ? '−' : '') + '$' + Math.abs(m).toLocaleString('en-US', {maximumFractionDigits: Math.abs(m) >= 100 ? 0 : 1}) + 'M';
};
const day = (s) => (s ? new Date(String(s).slice(0, 10) + 'T00:00:00Z').toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'}) : '—');
const when = (s) => (s ? new Date(s).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : '—');
const compact = (n) => new Intl.NumberFormat('en', {notation: 'compact', maximumFractionDigits: 1}).format(n || 0);
const LABEL = {revenue: 'Revenue', capex: 'Capex', opex: 'Opex', cost_of_revenue: 'Cost of revenue', cost_of_revenue_part: 'Cost line', operating_income: 'Operating income'};
const XBRL = {agree: 'matches SEC data', definition_gap: 'differs from SEC data, explained by code', unresolved: 'differs from SEC data, decided by a person', not_reported: 'not reported'};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
let me = 'Kenny Geiler';
try { me = localStorage.getItem('datahq-me') || me; } catch {}
$('#me').value = me;
$('#me').addEventListener('input', (e) => { me = e.target.value; try { localStorage.setItem('datahq-me', me); } catch {} });

function table(cols, rows, {key, onRow, detail} = {}) {
  const tb = h('tbody');
  const draw = (list) => {
    tb.replaceChildren();
    for (const r of list) {
      const tr = h('tr', {class: onRow || detail ? 'click' : null}, cols.map((c) => h('td', {class: [c.n && 'n', c.wide && 'wide'].filter(Boolean).join(' ') || null}, c.f ? c.f(r) : r[c.k] ?? '—')));
      tb.append(tr);
      if (onRow) tr.addEventListener('click', () => onRow(r));
      if (detail) tr.addEventListener('click', () => {
        const next = tr.nextElementSibling;
        if (next && next.classList.contains('detail')) { next.remove(); tr.classList.remove('open'); return; }
        tr.classList.add('open');
        tr.after(h('tr', {class: 'detail'}, h('td', {colspan: cols.length}, detail(r))));
      });
    }
  };
  let sort = null, dir = 1;
  const head = h('tr', {}, cols.map((c) => {
    const th = h('th', {class: [c.n && 'n', c.wide && 'wide'].filter(Boolean).join(' ') || null});
    if (c.sort === false) th.append(c.t);
    else th.append(h('button', {type: 'button', style: 'color:inherit', onclick: () => {
      dir = sort === c ? -dir : (c.n ? -1 : 1); sort = c;
      const v = c.s || ((r) => r[c.k]);
      draw([...rows].sort((a, b) => { const x = v(a), y = v(b); if (x == null || x === '') return 1; if (y == null || y === '') return -1; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * dir; }));
    }}, c.t));
    return th;
  }));
  draw(rows);
  return h('div', {class: 'scroll'}, h('table', {}, h('thead', {}, head), tb));
}

function bars(list) {
  return h('div', {class: 'bars'}, list.map((b) => h('div', {class: 'bar'}, h('span', {}, b.name),
    h('div', {class: 'track'}, h('i', {class: b.cls || null, style: `width:${Math.max(0, Math.min(100, b.pct))}%`})), h('span', {class: 'v'}, b.v))));
}

const KIND = {restated: 'Restated', jump: 'Big move', capex_intensity: 'Capex vs revenue', opex_over_revenue: 'Opex above revenue', row_switch: 'Line renamed', other: 'Note'};
function attributionTable(rows) {
  return table([{t: 'Field', k: 'field', f: (a) => LABEL[a.field] || a.field}, {t: 'Year', k: 'period'}, {t: 'Kind', k: 'kind'}, {t: 'Method', k: 'method', f: (a) => METHOD[a.method] || a.method},
    {t: 'AI amount', n: 1, k: 'ai_amount', f: (a) => (a.ai_amount != null ? usd(a.ai_amount) : h('span', {class: 'muted'}, '—'))},
    {t: 'Share', n: 1, k: 'ai_share', f: (a) => (a.ai_share != null ? pct(a.ai_share) : '—')}, {t: 'Confidence', n: 1, k: 'confidence', f: (a) => pct(a.confidence)}],
    rows, {detail: (a) => h('div', {class: 'src'}, h('div', {}, a.basis), h('div', {class: 'muted small mono'}, a.inputs || '—'))});
}
const FACT = {segment_capex: 'Segment capex', segment_revenue: 'Segment revenue', ppe_category: 'PP&E by category', finance_lease_liability: 'Finance lease liabilities', purchase_commitments: 'Purchase commitments'};
function factsTable(rows) {
  return table([{t: 'Fact', k: 'field', f: (f) => FACT[f.field] || f.field}, {t: 'Segment / category', k: 'dimension', f: (f) => f.dimension || h('span', {class: 'muted'}, 'company')},
    {t: 'Year', k: 'period'}, {t: 'Value', n: 1, k: 'value', f: (f) => usd(f.value)},
    {t: 'XBRL', k: 'label', f: (f) => (f.label === 'agree' ? h('span', {class: 'muted'}, 'agrees') : f.label === 'unresolved' ? h('span', {class: 'bad'}, `differs: ${usd(f.xbrl_value ?? f.reference)}`) : h('span', {class: 'muted'}, 'not tagged'))}],
    rows, {detail: (f) => h('div', {class: 'src'}, h('div', {class: 'mono small'}, `${f.accession} ${f.table_id} · "${f.row_label}" / "${f.column_label}" = ${f.cell_text}`))});
}
const SOURCE = {mdna: '10-K MD&A', earnings_release: 'earnings release', transcript: 'call transcript', cfo_commentary: 'CFO commentary'};
const AI_CLASS = {explicit_amount: 'amount', explicit_share: 'share', qualitative: 'words only'};
function aiTable(rows) {
  const stated = (a) => a.class === 'explicit_amount' ? (a.amount_low === a.amount_high ? usd(a.amount_low) : `${usd(a.amount_low)} – ${usd(a.amount_high)}`) : a.class === 'explicit_share' ? pct(a.share) : '—';
  return table([{t: 'Field', k: 'field', f: (a) => LABEL[a.field] || a.field}, {t: 'Year', k: 'period'}, {t: 'Kind', k: 'kind'},
    {t: 'Says', sort: false, f: (a) => `${AI_CLASS[a.class]}${a.class !== 'qualitative' ? (a.scope === 'ai' ? ', AI part' : ', company total') : ''}`},
    {t: 'Stated', n: 1, sort: false, f: stated}, {t: 'AI amount', n: 1, k: 'ai_amount', f: (a) => (a.ai_amount != null ? usd(a.ai_amount) : h('span', {class: 'muted'}, '—'))},
    {t: 'Source', k: 'source', f: (a) => SOURCE[a.source] || a.source}],
    rows, {detail: (a) => h('div', {class: 'src'}, h('div', {}, `“${a.quote}”`), h('div', {class: 'muted small'}, a.accession || a.text_id))});
}

// Fields down, years across; a note under a value says what a reader must know. Click a value for its source.
function valueGrid(values, costLinesOpen) {
  const years = [...new Set(values.map((v) => v.period))].sort(), fields = ['revenue', 'capex', 'opex'];
  const by = new Map(values.map((v) => [`${v.field}|${v.period}`, v]));
  const rev = (y) => by.get(`revenue|${y}`)?.value;
  const panel = h('div', {style: 'margin-top:1rem'});
  const mark = (v) => {
    if (v.decision) return `decided: ${v.decision.kind}`;
    if (v.label === 'definition_gap') return costLinesOpen ? 'waits on your cost-line call' : 'cost lines confirmed';
    if (v.basis === 'restated') return `restated from ${usd(v.first_reported)}`;
    if (v.field === 'opex' && rev(v.period) != null && v.value > rev(v.period)) return 'above revenue';
    if (v.label !== 'agree') return XBRL[v.label] || v.label;
    return '';
  };
  return h('div', {}, h('div', {class: 'scroll'}, h('table', {class: 'grid'},
    h('thead', {}, h('tr', {}, h('th', {}, ''), years.map((y) => h('th', {class: 'n'}, y)))),
    h('tbody', {}, fields.map((f) => h('tr', {}, h('td', {}, LABEL[f]), years.map((y) => {
      const v = by.get(`${f}|${y}`);
      if (!v) return h('td', {class: 'n muted'}, '—');
      const m = mark(v);
      return h('td', {class: 'n cell', tabindex: 0, onclick: () => { panel.replaceChildren(h('h3', {style: 'margin:0 0 .5rem'}, `${LABEL[f]} ${y}: ${usd(v.value)}`), sources(v)); }},
        h('div', {}, usd(v.value)), m ? h('div', {class: 'note'}, m) : '');
    })))))), panel);
}

// The cleaning, one row per value: what the filing printed, what was done to it, what came out, and how it was checked.
function cleaningTable(values) {
  const rows = values.map((v) => {
    const s = v.sources, one = s[0] || {};
    const scale = one.scale ? ({1: 'units', 1000: 'thousands', 1000000: 'millions', 1000000000: 'billions'})[one.scale] || `×${one.scale}` : '';
    const steps = [];
    if (v.field === 'opex') steps.push('revenue − cost of revenue − operating income, one column');
    if (scale && scale !== 'units') steps.push(`in ${scale}`);
    if (s.some((x) => /^\(|^-/.test(x.cell || '') && x.value > 0)) steps.push('brackets → positive');
    if (s.some((x) => /^[—–-]$/.test((x.cell || '').trim()))) steps.push('dash → 0');
    if (s.some((x) => x.field === 'cost_of_revenue_part')) steps.push(`${s.filter((x) => x.field === 'cost_of_revenue_part').length} cost lines summed`);
    steps.push(`column “${(one.col || '').split(' | ').pop()}” → ${v.period}`);
    steps.push(v.basis === 'restated' ? `newest 10-K (${day(one.filed)}); first reported ${usd(v.first_reported)}` : `10-K filed ${day(one.filed)}`);
    const check = v.decision ? `decided: ${v.decision.kind}` : v.label === 'agree' ? 'matches SEC' : v.label === 'definition_gap' ? 'cost lines: your call' : XBRL[v.label] || v.label;
    return {v, field: LABEL[v.field], period: v.period, printed: v.field === 'opex' ? s.map((x) => `${({revenue: 'revenue', cost_of_revenue: 'cost', cost_of_revenue_part: 'cost line', operating_income: 'op. income'})[x.field] || x.field} ${x.cell}`).join('\n') : one.cell, row: v.field === 'opex' ? '' : one.row, steps, value: v.value, check,
      confirmed: s.length && s.every((x) => x.machine && x.machine.match)};
  });
  return table([{t: 'Value', k: 'field', s: (r) => r.field + r.period, f: (r) => [r.field, ' ', h('span', {class: 'muted'}, r.period)]},
    {t: 'In the 10-K', k: 'printed', f: (r) => [h('span', {class: 'mono brk'}, r.printed || '—'), r.row ? h('div', {class: 'muted small brk'}, r.row) : '']},
    {t: 'Cleaning', sort: false, f: (r) => h('div', {class: 'small brk'}, r.steps.join(' · ')), wide: 1},
    {t: 'Value', k: 'value', n: 1, f: (r) => usd(r.value)},
    {t: 'Checked', k: 'check', f: (r) => h('span', {class: r.check === 'matches SEC' ? 'muted' : null}, r.check, r.confirmed ? h('div', {class: 'muted small'}, 're-read on filing') : '')}],
    rows, {detail: (r) => sources(r.v)});
}

const tok = (d) => (d.agent && d.agent.detail.input_tokens != null ? d.agent.detail.input_tokens + d.agent.detail.output_tokens : null);

function rawAnswer(accession) {
  const pre = h('pre', {class: 'raw'}, 'Loading…');
  fetch('/api/output?accession=' + encodeURIComponent(accession)).then((r) => (r.ok ? r.json() : Promise.reject(new Error('no saved answer'))))
    .then((j) => { pre.textContent = JSON.stringify(j, null, 1); }).catch((e) => { pre.textContent = e.message; });
  return pre;
}

function sources(v) {
  const wrap = h('div', {});
  if (v.decision) wrap.append(h('div', {class: 'src'}, h('div', {}, `${v.decision.reviewer} decided: ${v.decision.kind}`), h('div', {class: 'muted'}, v.decision.reason)));
  if (v.why) wrap.append(h('div', {class: 'src'}, h('div', {class: 'muted'}, 'The 10-K says: ', v.why.text.slice(0, 400)), h('a', {href: v.why.url, target: '_blank', rel: 'noopener'}, 'Open that passage')));
  for (const s of v.sources) {
    wrap.append(h('div', {class: 'src'},
      h('div', {}, `${LABEL[s.field] || s.field}: `, h('b', {}, s.cell), ` in row “${s.row}”, column “${s.col.replaceAll(' | ', ' ')}”`),
      h('div', {class: 'muted small'}, `10-K filed ${day(s.filed)} · table ${s.table_id} · ${s.unit || 'unit from the document'} · prompt ${s.prompt}`, s.notes ? ` · ${s.notes}` : ''),
      h('div', {class: 'small' + (s.machine && !s.machine.match ? ' bad' : ' muted')}, s.machine ? (s.machine.match ? 'Confirmed on the rendered 10-K' : `Rendered 10-K shows ${s.machine.seen}`) : 'Not re-read'),
      s.machine?.img && h('img', {src: '/' + s.machine.img, alt: `Screenshot of the cited cell ${s.cell}`, loading: 'lazy'}),
      h('a', {href: s.deep, target: '_blank', rel: 'noopener', class: 'small'}, 'Open the 10-K at this row')));
  }
  if (!v.sources.length) wrap.append(h('p', {class: 'muted'}, 'No citation.'));
  return wrap;
}

function agentCard(a) {
  let shown = a.prompt;
  const text = h('textarea', {readonly: true, 'aria-label': 'Prompt text', spellcheck: 'false'});
  const verSel = h('select', {'aria-label': 'Prompt version', onchange: (e) => { shown = e.target.value; showPrompt(); }},
    a.versions.map((v) => h('option', {value: v, selected: v === a.prompt || null}, v === a.prompt ? `${v} (in use)` : v)));
  const note = h('input', {type: 'text', placeholder: 'What changed and why', 'aria-label': 'What changed and why', style: 'flex:1;min-width:14rem'});
  const status = h('span', {class: 'muted small'});
  const editBtn = h('button', {type: 'button', onclick: () => startEdit()}, 'Edit');
  const useBtn = h('button', {type: 'button', onclick: () => post('use', {version: shown}, `Now using ${shown}.`)}, 'Use this version');
  const saveBtn = h('button', {type: 'button', class: 'btn', onclick: () => post('prompt', {text: text.value, note: note.value}, (r) => `Saved as ${r.version} and in use.`)}, 'Save as new version');

function lineChart(rows, years, tickers, ratio) {
  const W = 520, H = 240, L = 56, R = 64, T = 10, B = 26;
  const vals = rows.map((r) => r.value);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const x = (y) => L + (years.length === 1 ? (W - L - R) / 2 : (years.indexOf(y) * (W - L - R)) / (years.length - 1));
  const yv = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ns = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs) => { const el = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
  const svg = s('svg', {viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img', 'aria-label': 'Line chart'});
  const fmtAxis = (v) => {
    if (ratio) return Math.round(v * 100) + '%';
    const a = Math.abs(v), sign = v < 0 ? '−' : '';
    return a >= 1e9 ? `${sign}$${+(a / 1e9).toFixed(a >= 1e10 ? 0 : 1)}B` : `${sign}$${+(a / 1e6).toFixed(a >= 1e7 ? 0 : 1)}M`;
  };
  for (let i = 0; i <= 4; i++) {
    const v = lo + ((hi - lo) * i) / 4;
    svg.append(s('line', {x1: L, x2: W - R, y1: yv(v), y2: yv(v), stroke: 'var(--faint)', 'stroke-width': 1}));
    const t = s('text', {x: L - 6, y: yv(v) + 4, 'text-anchor': 'end'}); t.textContent = fmtAxis(v); svg.append(t);
  }
  years.forEach((y) => { const t = s('text', {x: x(y), y: H - 6, 'text-anchor': 'middle'}); t.textContent = y.replace('FY', ''); svg.append(t); });
  const tip = $('#tip'), ends = [];
  tickers.forEach((tk, i) => {
    const pts = rows.filter((r) => r.ticker === tk).sort((a, b) => a.period.localeCompare(b.period));
    if (!pts.length) return;
    const color = COLORS[i % COLORS.length];
    svg.append(s('polyline', {points: pts.map((p) => `${x(p.period)},${yv(p.value)}`).join(' '), fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}));
    for (const p of pts) {
      const dot = s('circle', {cx: x(p.period), cy: yv(p.value), r: 3.5, fill: color});
      const hit = s('circle', {cx: x(p.period), cy: yv(p.value), r: 10, fill: 'transparent'});
      hit.addEventListener('mousemove', (e) => { tip.hidden = false; tip.textContent = `${p.company} ${p.period}: ${ratio ? (100 * p.value).toFixed(1) + '%' : usd(p.value)}`; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px'; });
      hit.addEventListener('mouseleave', () => { tip.hidden = true; });
      svg.append(dot, hit);
    }
    const last = pts[pts.length - 1];
    ends.push({tk, color, x: x(last.period) + 7, y: yv(last.value) + 4});
  });
  ends.sort((a, b) => a.y - b.y);  // end labels: keep 12px apart so none overlap
  for (let i = 1; i < ends.length; i++) if (ends[i].x === ends[i - 1].x && ends[i].y - ends[i - 1].y < 12) ends[i].y = ends[i - 1].y + 12;
  for (const e of ends) { const lab = s('text', {x: e.x, y: e.y}); lab.textContent = e.tk; lab.style.fill = e.color; svg.append(lab); }
  return h('div', {}, svg);
}

let hqCache = null;
const hq = async (fresh) => (hqCache = !fresh && hqCache ? hqCache : await api('/api/hq'));
const confirmedCell = (f) => (f.confirmed ? h('span', {class: 'muted'}, 'agrees') : h('span', {class: 'bad'}, "can't confirm"));
const pct = (x) => (x == null ? '—' : x < .001 ? '<0.1%' : `${(100 * x).toFixed(x < .1 ? 1 : 0)}%`);
const fig = (l, n, s, bad) => h('div', {class: 'fig'}, h('div', {class: 'l'}, l), h('div', {class: 'n' + (bad ? ' bad' : '')}, n), h('div', {class: 's' + (bad ? ' bad' : '')}, s));
const sect = (title, note, ...body) => h('section', {}, h('div', {class: 'sechead'}, h('h2', {}, title), note ? h('span', {class: 'muted small'}, note) : ''), ...body);
const INDUSTRY = {hyperscaler: 'Hyperscaler', neocloud: 'Neocloud', miner_to_hpc: 'Miner to HPC', chip_seller: 'Chip seller', component_supplier: 'Memory and networking', other: 'Other'};
const METHOD = {stated_share: 'stated share', stated_amount: 'stated amount', segment: 'segment capex', ppe_category: 'server category growth', whole_business: 'whole business', qualitative: 'words only', none: 'none'};
const METHOD_NOTE = {stated_share: 'the company said the share', stated_amount: 'the company said the amount', segment: 'the AI segment’s capex in the notes', ppe_category: 'growth in the server and network category; all servers, not only AI', whole_business: 'a single-segment AI business', qualitative: 'words, no number', none: 'nothing links the spend to AI'};
function change(f) {
  if (f.kind === 'restated') return `${usd(f.before)} → ${usd(f.after)} (${f.after >= f.before ? '+' : '−'}${pct(f.size)})`;
  if (f.kind === 'jump') return `${usd(f.before)} → ${usd(f.after)} (${f.size.toFixed(1)}×)`;
  if (f.kind === 'capex_intensity') return `capex ${pct(f.size)} of revenue`;

// A job (add a company, or rerun attribution) and its steps, polled while it runs.
function jobBox(onDone, kind) {
  const box = h('div');
  let timer = null;
  async function poll() {
    clearTimeout(timer);
    const j = await api('/api/job');
    if (!j || (kind && (j.kind || 'run') !== kind)) { box.replaceChildren(); return; }
    const mark = {done: 'done', running: 'running', waiting: ''};
    box.replaceChildren(
      h('div', {class: 'sechead'}, h('h2', {}, j.kind === 'attribution' ? `Attribution: ${j.ticker === 'all' ? 'every company' : INDUSTRY[j.ticker] || j.ticker}` : j.ticker),
        h('span', {class: 'muted small'}, j.running ? `running since ${when(j.started)}` : j.exit === 0 ? 'finished' : j.exit == null ? '' : `stopped (exit ${j.exit})`)),
      h('div', {class: 'steps'}, j.steps.map((s) => h('div', {class: `stp ${s.state}`},
        h('span', {class: 'state'}, mark[s.state]), h('div', {}, h('div', {}, s.label), s.summary ? h('div', {class: 'muted small'}, s.summary) : '')))),
      !j.running && j.exit !== 0 && j.exit != null ? h('pre', {class: 'raw'}, j.tail.join('\n')) : '',
      !j.running && j.exit === 0 && j.kind !== 'attribution' ? h('p', {}, h('a', {href: '#company/' + j.ticker}, `Open ${j.ticker}`)) : '');
    if (j.running) timer = setTimeout(poll, 2000); else if (onDone) onDone(j);
  }
  poll();
  return box;
}

          h('p', {}, r.basis), h('p', {class: 'muted small mono', style: 'margin-top:.4rem'}, r.inputs || '—'), h('p', {class: 'muted small'}, `confidence ${pct(r.confidence)} · model ${r.model}`))},
        h('div', {}, r.ai_amount != null ? usd(r.ai_amount) : h('span', {class: 'muted'}, '—')), h('div', {class: 'note'}, r.ai_amount != null ? `${pct(r.ai_share)} · ${METHOD[r.method]}` : METHOD[r.method]));
    }))))));
  const diff = d.diff;
  view.append(h('div', {class: 'stack'},
    h('header', {class: 'pagehead'}, h('h1', {}, 'How much of the capex is AI'),
      h('p', {class: 'lede'}, 'The attributor reads the money-flow model for the company’s industry and the company’s data, and names every input; code recomputes each number. Edit a model here, save it as the next version, switch it on, rerun the industry. Nothing is re-read from filings.')),
    h('div', {class: 'split'},
      sect('Money-flow models', `prompt ${d.prompt}`, h('div', {class: 'row', style: 'margin-bottom:.8rem'}, pick), editor, h('p', {class: 'row', style: 'margin-top:.6rem'}, status)),
      sect('Last rerun', null, progress, diff ? h('div', {class: 'kv', style: 'margin-top:.8rem'},
        [['Changed', diff.changed], ['New', diff.new], ['Removed', diff.removed]].flatMap(([k, v]) => [h('span', {class: 'muted'}, k), h('span', {}, int(v))]),
        h('span', {class: 'muted small', style: 'grid-column:1/-1'}, `loaded ${when(diff.at)} for ${diff.scope}`),
        diff.rows && diff.rows.length ? h('div', {style: 'grid-column:1/-1;margin-top:.4rem'}, diff.rows.slice(0, 12).map((r) => h('div', {class: 'small'}, h('span', {class: 'mono'}, r.key), ` ${r.before[0]} ${r.before[1] != null ? usd(r.before[1]) : ''} → ${r.after[0]} ${r.after[1] != null ? usd(r.after[1]) : ''}`))) : '')
        : h('p', {class: 'muted'}, 'No load yet.'), h('div', {class: 'row', style: 'margin-top:1rem'}, rerun(null)))),
    sect('AI capex by company and year', 'click a cell for the basis and the inputs', grid, panel),
    h('p', {class: 'muted small'}, 'Methods, hardest first: ', Object.entries(METHOD_NOTE).map(([k, v], i) => [i ? ' · ' : '', h('b', {style: 'font-weight:500'}, METHOD[k]), `: ${v}`]))));
}

// ── Insights: the AI buildout in the live numbers ───────────────────────────
async function insightsPage(view) {
  const d = await api('/api/insights');
  const ev = await api('/api/evaluation');
  const yrs = d.by_year.filter((y) => y.buyers > 0);
  const latest = d.latest.filter((c) => c.role === 'buyer');
  const maxC = Math.max(...yrs.map((y) => y.capex), 1);
  view.append(h('div', {class: 'stack'},
    h('header', {class: 'pagehead'}, h('h1', {}, 'The AI buildout'),
      h('p', {class: 'muted small'}, `From the current run, not a signed release. ${d.release ? `The signed release ${d.release} carries ${d.release_has_attribution ? 'this attribution' : 'values and statements only'}.` : 'No signed release yet.'} Fiscal years are each company’s own.`)),
    sect('Buyers’ AI capex against their total capex', 'dark: attributed to AI; light: the rest of capex at companies with an attribution; faint: companies with none',
      stackedBars(yrs.map((y) => ({label: y.period.replace('FY', ''), parts: [y.ai_capex, y.capex_covered - y.ai_capex, y.capex - y.capex_covered], total: y.capex, n: y.buyers})), maxC)),
    h('div', {class: 'two'},
      sect('AI capex, latest year', 'buyers; the method says what kind of number it is',
        bars(latest.map((c) => ({name: `${c.company} ${c.period.slice(2)}`, pct: 100 * c.ai_amount / (latest[0]?.ai_amount || 1), v: `${usd(c.ai_amount)} · ${pct(c.share)} · ${METHOD[c.method]}`, cls: c.method === 'ppe_category' ? 'note' : null})))),
      sect('Who gets paid', 'sellers’ data-center revenue, from the segment notes, beside buyers’ AI capex',
        h('div', {class: 'scroll'}, table([{t: 'Year', k: 'period', sort: false, f: (y) => y.period.replace('FY', '')},
          {t: 'Buyers’ AI capex', n: 1, sort: false, f: (y) => usd(y.ai_capex)}, {t: 'Buyers’ capex', n: 1, sort: false, f: (y) => usd(y.capex)},
          {t: 'Sellers’ DC revenue', n: 1, sort: false, f: (y) => (y.sellers ? [usd(y.sellers_dc), h('div', {class: 'muted small'}, `${y.sellers} sellers`)] : h('span', {class: 'muted'}, '—'))}], yrs)),
        h('p', {class: 'muted small', style: 'margin-top:.6rem'}, 'Sellers’ data-center revenue counts only sellers whose segment note names a data-center line; Nvidia and AMD so far.'))),
    ev && sect('How wrong is it', `${ev.n} sourced reference figures · we have a number for ${ev.with_estimate}: ${ev.agree} agree, ${ev.disagree} disagree · ${ev.no_estimate} without an estimate`,
      table([{t: 'Company', k: 'ticker'}, {t: 'Year', k: 'period'}, {t: 'Reference', sort: false, f: (r) => `${({eq: '', ge: '≥ ', le: '≤ '})[r.relation]}${r.measure === 'share' ? pct(r.reference) : usd(r.reference)}`},
        {t: 'Ours', sort: false, f: (r) => (r.ours == null ? h('span', {class: 'muted'}, 'no estimate') : r.measure === 'share' ? pct(r.ours) : usd(r.ours))},
        {t: 'Method', k: 'method', f: (r) => (r.method ? METHOD[r.method] : '—')},
        {t: 'Outcome', k: 'outcome', f: (r) => h('span', {class: r.outcome === 'disagree' ? 'bad' : r.outcome === 'agree' ? 'muted' : null}, r.outcome.replace('_', ' '))}],
        ev.rows, {detail: (r) => h('div', {class: 'src'}, h('div', {}, r.basis), h('div', {class: 'muted small'}, `“${r.source.quote}” · `, h('a', {href: r.source.url, target: '_blank', rel: 'noopener'}, 'source'), ` · ${r.source.date || ''}`))}),
      h('p', {class: 'muted small', style: 'margin-top:.6rem'}, 'Every reference entry names its source and what it measures; a server share includes CPUs, a "vast majority" is a floor. Add an entry to gold/ai_capex.yaml when you find a sourced figure. ', Object.entries(ev.bands).map(([m, b]) => `${METHOD[m]}: ${b.agree} of ${b.n} agree${b.median_abs_error != null ? `, median error ${pct(b.median_abs_error)} on ${b.n_eq}` : ''}`).join('; '), '.')),
    sect('Every attributed company', null,
      table([{t: 'Company', k: 'company'}, {t: 'Industry', k: 'industry', f: (c) => INDUSTRY[c.industry]}, {t: 'Year', k: 'period'},
        {t: 'AI capex', k: 'ai_amount', n: 1, f: (c) => usd(c.ai_amount)}, {t: 'Capex', k: 'capex', n: 1, f: (c) => usd(c.capex)}, {t: 'Share', k: 'share', n: 1, f: (c) => pct(c.share)},
        {t: 'Method', k: 'method', f: (c) => METHOD[c.method]}, {t: 'Confidence', k: 'confidence', n: 1, f: (c) => pct(c.confidence)}], d.latest, {onRow: (c) => go('company/' + c.ticker)})),
    h('p', {class: 'muted small'}, 'Method mix across every attributed company-year: ', Object.entries(d.methods).sort((a, b) => b[1] - a[1]).map(([k, v], i) => `${i ? ', ' : ''}${v} ${METHOD[k]}`), '. Server-category growth counts all server and network growth, not only AI; it is the hardest number a hyperscaler’s 10-K gives.')));
}

// Horizontal stacked bars: one row per year, three parts of one whole.
function stackedBars(rows, max) {
  return h('div', {class: 'bars'}, rows.map((r) => {
    const w = (v) => `${Math.max(0, 100 * v / max)}%`;
    return h('div', {class: 'bar'}, h('span', {}, r.label, h('span', {class: 'muted small'}, ` · ${r.n} buyers`)),
      h('div', {class: 'track'}, h('i', {style: `width:${w(r.parts[0])};float:left`}), h('i', {class: 'note', style: `width:${w(r.parts[1])};float:left;opacity:.35`}), h('i', {class: 'note', style: `width:${w(r.parts[2])};float:left;opacity:.15`})),
      h('span', {class: 'v'}, `${usd(r.parts[0])} of ${usd(r.total)}`));
  }));
}

// ── Company: the attribution first, then down to the cells ──────────────────
async function companyPage(view, ticker) {
  const d = await hq();
  ticker ||= d.companies[0].ticker;
  const pick = h('select', {'aria-label': 'Company', onchange: (e) => go('company/' + e.target.value)},
    d.companies.map((c) => h('option', {value: c.ticker, selected: c.ticker === ticker || null}, `${c.company} (${c.ticker})`)));
  view.append(h('div', {class: 'row', style: 'margin-bottom:1.5rem'}, pick));
  const c = await api('/api/company?t=' + encodeURIComponent(ticker));
  const docs = c.documents, sc = c.scorecard, info = d.companies.find((x) => x.ticker === ticker) || {};
  const findings = d.findings.filter((f) => f.ticker === ticker), questions = d.questions.filter((q) => q.ticker === ticker);
  const cells = c.values.flatMap((v) => v.sources), confirmed = cells.filter((s) => s.machine && s.machine.match).length;
  const read = docs.filter((x) => x.agent && x.agent.outcome === 'ok').length;
  const best = c.attribution.filter((a) => a.field === 'capex' && a.kind === 'actual' && a.ai_amount != null).sort((a, b) => b.period.localeCompare(a.period))[0];
  view.append(h('div', {class: 'stack'},
    h('header', {class: 'pagehead'}, h('h1', {}, c.name),
      h('p', {class: 'muted small'}, [c.ticker, INDUSTRY[info.industry] || '', docs.length ? `${docs.length} 10-Ks` : 'no 10-K yet', `${int(info.texts)} texts`, `${int(sc.values)} values`, `${int(info.facts)} facts`, c.note].filter(Boolean).join(' · ')),
      best ? h('p', {class: 'lede'}, h('b', {}, `${usd(best.ai_amount)} of ${best.period} capex attributed to AI`), ` (${pct(best.ai_share)}, ${METHOD[best.method]}, confidence ${pct(best.confidence)}). ${best.basis}`) : h('p', {class: 'lede'}, 'No AI capex amount attributed: ', c.attribution.find((a) => a.field === 'capex')?.basis || 'nothing attributed yet.')),
    questions.length > 0 && sect('Blocked', 'needs a definition in definitions/companies.yaml', h('ul', {class: 'plain'}, questions.map((q) => h('li', {}, h('b', {}, q.title), ' ', h('span', {class: 'muted'}, q.message))))),
    c.attribution.length > 0 && sect('AI attribution', `model ${c.attribution[0].model} · click a row for the basis and inputs`, attributionTable(c.attribution)),
    c.ai_spend.length > 0 && sect('What the company said', `${c.ai_spend.filter((a) => a.ai_amount != null).length} of ${c.ai_spend.length} statements give an AI dollar amount`, aiTable(c.ai_spend)),
    c.facts.length > 0 && sect('Facts from the notes', `${c.facts.filter((f) => f.label === 'agree').length} of ${c.facts.length} agree with the filing's own XBRL`, factsTable(c.facts)),
    docs.length > 0 && sect('The numbers', `${int(sc.agree)} of ${int(sc.values)} match the SEC's data`, valueGrid(c.values, false)),
    docs.length > 0 && sect('How each number was cleaned', 'from the cell in the 10-K to the released value', cleaningTable(c.values)),
    findings.length > 0 && sect('What happened', "a finding the SEC's data can't confirm is worth a look, not a decision", table([{t: 'Year', k: 'period', f: (f) => f.period || '—'}, {t: 'What', k: 'kind', f: (f) => `${KIND[f.kind]}, ${(LABEL[f.field] || f.field || '').toLowerCase()}`}, {t: 'Change', sort: false, f: change}, {t: 'SEC data', k: 'confirmed', f: confirmedCell}], findings)),
    sect('Filings', `${read} of ${docs.length} read by the agent · ${confirmed} of ${cells.length} cited cells re-read on the filing`,
      docs.length ? table([{t: 'Form', k: 'form'}, {t: 'Year end', k: 'period', f: (x) => day(x.period)}, {t: 'Filed', k: 'filed', f: (x) => day(x.filed)},
        {t: 'Accession', k: 'accession', f: (x) => h('a', {href: x.url, target: '_blank', rel: 'noopener', class: 'mono'}, x.accession)},
        {t: 'Agent', s: (x) => x.agent?.outcome, f: (x) => h('span', {class: x.agent?.outcome === 'ok' ? 'muted' : 'bad'}, x.agent ? (x.agent.outcome === 'ok' ? `read, ${x.agent.detail.attempts || 1} tr${(x.agent.detail.attempts || 1) > 1 ? 'ies' : 'y'}` : x.agent.detail.error || x.agent.outcome) : 'not read')},
        {t: 'Tokens', n: 1, wide: 1, s: (x) => tok(x), f: (x) => (tok(x) ? int(tok(x)) : '—')}], docs, {detail: (x) => rawAnswer(x.accession)}) : h('p', {class: 'muted'}, 'No 10-K yet.'),
      c.skipped.length ? h('p', {class: 'muted small', style: 'margin-top:.5rem'}, `Skipped: ${c.skipped.map((s) => `${s.form} for the year ended ${day(s.period)} (no financial statements)`).join('; ')}.`) : ''),
    c.exceptions.length > 0 && h('details', {}, h('summary', {class: 'muted small', style: 'cursor:pointer'}, `Every check that fired (${c.exceptions.length}), including notes and decided items`),
      table([{t: 'Check', k: 'rule_id', f: (e) => e.rule_id.replaceAll('_', ' ')}, {t: 'Field', k: 'field', f: (e) => LABEL[e.field] || e.field || '—'}, {t: 'Year', k: 'period', f: (e) => e.period || '—'},
        {t: 'Status', k: 'status', f: (e) => (e.status === 'decided' ? `decided by ${e.decision?.reviewer || '—'}` : e.status)}],
        c.exceptions, {detail: (e) => h('div', {class: 'src'}, h('div', {}, e.message), e.decision && h('div', {class: 'muted'}, `${e.decision.reviewer}, ${day(e.decision.decided_at)}: ${e.decision.reason}`))}))));
}

// ── Agents (the readers) and Releases ───────────────────────────────────────
async function agentsPage(view) {
  const all = await api('/api/agents');
  view.append(h('header', {style: 'margin-bottom:2.5rem'}, h('h1', {}, 'The readers'),
    h('p', {class: 'lede'}, 'Every agent in the pipeline: what it decides, what checks it, its model and prompt. A prompt is never edited in place: a change becomes the next version and is switched on as a second step, both logged with a name. The attributor’s models are edited on the Attribution tab.')));
  for (const a of Object.values(all)) view.append(agentCard(a));
}

async function releasesPage(view) {
  const d = await api('/api/outputs');
  view.append(h('div', {class: 'stack'}, h('header', {class: 'pagehead'}, h('h1', {}, 'Releases'), h('p', {class: 'lede'}, 'A release is a folder of plain files whose content hash a person signs. A signed one has a packet to send.')),
    ...[...d.releases].reverse().map((r) => sect(r.version, r.signed_by ? `signed by ${r.signed_by}, ${day(r.signed_at)}` : 'not signed',
      h('p', {class: 'muted small', style: 'margin-bottom:.5rem'}, `${int(r.rows.length)} values`, r.packet ? [' · ', h('a', {href: `/packet/${r.version}.zip`}, 'Download the packet (zip)')] : ' · a packet needs a signature'),
      h('details', {}, h('summary', {class: 'muted small', style: 'cursor:pointer'}, 'Values'), table([{t: 'Company', k: 'company'}, {t: 'Field', k: 'field'}, {t: 'Year', k: 'period'}, {t: 'Value', n: 1, k: 'value', f: (x) => (x.value === '' ? h('span', {class: 'muted'}, 'blank') : usd(Number(x.value)))}, {t: 'SEC data', k: 'xbrl'}], r.rows))))));
}

// ── Routing ─────────────────────────────────────────────────────────────────
function go(hash) { location.hash = hash; }
async function route() {
  const [page, arg] = (location.hash.slice(1) || 'pipeline').split('/');
  const tab = {company: 'pipeline', agents: 'pipeline', releases: 'pipeline', dashboard: 'pipeline', add: 'pipeline'}[page] || page;
  document.querySelectorAll('nav [data-nav]').forEach((a) => a.classList.toggle('on', a.dataset.nav === tab));
  const view = $('#view');
  view.replaceChildren();
  try {
    if (page === 'company') await companyPage(view, arg);
    else if (page === 'attribution') await attributionPage(view);
    else if (page === 'insights') await insightsPage(view);
    else if (page === 'agents') await agentsPage(view);
    else if (page === 'releases') await releasesPage(view);
    else await pipelinePage(view);
  } catch (e) {
    view.replaceChildren(h('p', {class: 'msg bad'}, e.message));
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
