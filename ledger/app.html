<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DATAHQ</title>
<style>
  /* Plain pages, whitespace instead of borders. One accent (ink blue); red only for a failure. */
  :root {
    --bg: #fbfbfa; --fg: #1c1d1f; --muted: #6b6e74; --faint: #e9e9e6; --accent: #2f5bd3; --bad: #c43d2f;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141518; --fg: #e8e8e6; --muted: #9a9da3; --faint: #26282d; --accent: #7a9cff; --bad: #ff7a6b; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 76rem; margin: 0 auto; padding: 0 max(16px, 3vw) 6rem; }
  nav { display: flex; gap: 1.75rem; align-items: baseline; padding-block: 1.25rem 2rem; flex-wrap: wrap; }
  nav .brand { font-weight: 600; letter-spacing: .06em; margin-right: auto; color: var(--fg); }
  nav a { color: var(--muted); }
  nav a.on { color: var(--fg); }
  nav .me { margin-left: 1rem; }
  nav .me input { width: 9rem; border: 0; border-bottom: 1px solid var(--faint); background: none; padding: .1rem 0; font-size: .82rem; }
  h1 { font-size: 1.6rem; font-weight: 500; margin: 0; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .6rem; }
  p { margin: 0; }
  .lede { color: var(--muted); max-width: 62ch; margin-top: .35rem; }
  .lede b { color: var(--fg); font-weight: 600; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .small { font-size: .82rem; }
  .mono { font-family: var(--mono); font-size: .82rem; }
  .stack { display: grid; gap: 3rem; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 3rem; }
  .two > *, .stack > * { min-width: 0; }
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); gap: 1.5rem; }
  .fig .n { font-size: 2.1rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .fig .l, .fig .s { color: var(--muted); font-size: .82rem; }
  .bars { display: grid; gap: .55rem; }
  .bar { display: grid; grid-template-columns: minmax(8rem, 12rem) 1fr auto; gap: .75rem; align-items: center; }
  .bar .v { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { height: 8px; border-radius: 4px; background: var(--faint); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .track i.bad { background: var(--bad); }
  .track i.note { background: var(--muted); opacity: .5; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 400; color: var(--muted); font-size: .8rem; padding: 0 1rem .35rem 0; white-space: nowrap; }
  td { padding: .4rem 1rem .4rem 0; vertical-align: top; }
  td.n, th.n { text-align: right; }
  tr.click { cursor: pointer; }
  tr.click:hover td { color: var(--accent); }
  tr.open td { color: var(--accent); }
  .detail td { padding: .25rem 0 1.25rem; color: var(--fg); }
  .src { display: grid; gap: .3rem; margin-bottom: .9rem; max-width: 60rem; }
  .src img { max-width: min(100%, 40rem); border-radius: 4px; margin-top: .3rem; }
  .step { display: grid; grid-template-columns: 11rem 1fr; gap: 1.5rem; }
  .step > * { min-width: 0; }
  .step .head .state { font-size: .82rem; color: var(--muted); margin-top: .15rem; }
  @media (max-width: 44rem) { .step { grid-template-columns: 1fr; gap: .5rem; } .wide { display: none; } }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  select, input[type=text] { background: var(--bg); border: 1px solid var(--faint); border-radius: 6px; padding: .35rem .55rem; }
  textarea { width: 100%; min-height: 28rem; background: var(--bg); border: 1px solid var(--faint); border-radius: 6px; padding: .75rem; font: .82rem/1.55 var(--mono); }
  textarea[readonly] { border-color: transparent; padding-inline: 0; resize: none; }
  .btn { background: var(--accent); color: var(--bg); border-radius: 6px; padding: .4rem .9rem; }
  .btn[disabled] { opacity: .4; cursor: default; }
  ul.plain { margin: .2rem 0 0; padding-left: 1.1rem; }
  ul.plain li { margin: .15rem 0; }
  .picks { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; }
  .picks label { white-space: nowrap; cursor: pointer; }
  .controls { display: grid; gap: 1.1rem; }
  .controls .k { color: var(--muted); font-size: .8rem; margin-bottom: .2rem; }
  svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
  .tip { position: fixed; pointer-events: none; background: var(--bg); box-shadow: 0 2px 12px rgba(0,0,0,.18); border-radius: 6px; padding: .35rem .6rem; font-size: .8rem; }
  pre.raw { white-space: pre-wrap; word-break: break-word; font: .78rem/1.5 var(--mono); max-height: 30rem; overflow: auto; margin: .5rem 0 0; }
  .msg { color: var(--muted); padding: 2rem 0; }
  .pagehead { display: grid; gap: .3rem; }
  .split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(14rem, 1fr); gap: 3rem; }
  @media (max-width: 52rem) { .split { grid-template-columns: 1fr; } }
  .sechead { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .6rem; }
  .sechead h2 { margin: 0; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: .45rem 1rem; font-variant-numeric: tabular-nums; }
  table.grid td.cell { cursor: pointer; }
  table.grid td.cell:hover { color: var(--accent); }
  table.grid .note { font-size: .74rem; color: var(--muted); white-space: normal; max-width: 9rem; margin-left: auto; }
  .brk { white-space: pre-wrap; word-break: break-word; }
  .steps { display: grid; gap: .8rem; }
  .stp { display: grid; grid-template-columns: 5rem 1fr; gap: 1rem; color: var(--muted); }
  .stp.done, .stp.running { color: var(--fg); }
  .stp .state { font-size: .8rem; color: var(--muted); }
  .stp.running .state { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="#dashboard">DATAHQ</a>
    <a href="#dashboard" data-nav="dashboard">Dashboard</a>
    <a href="#company" data-nav="company">Companies</a>
    <a href="#insights" data-nav="insights">Insights</a>
    <a href="#outputs" data-nav="outputs">Outputs</a>
    <a href="#agents" data-nav="agents">Agents</a>
    <span class="me muted small">signed as <input id="me" type="text" aria-label="Your name, used on every decision"></span>
  </nav>
  <main id="view"><p class="msg">Loading…</p></main>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k === 'class') el.className = v; else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
};
const int = (n) => (n == null || n === '' ? '—' : Number(n).toLocaleString('en-US'));
const usd = (n) => {
  if (n == null || n === '') return '—';
  const m = Number(n) / 1e6;
  return (m < 0 ? '−' : '') + '$' + Math.abs(m).toLocaleString('en-US', {maximumFractionDigits: Math.abs(m) >= 100 ? 0 : 1}) + 'M';
};
const day = (s) => (s ? new Date(String(s).slice(0, 10) + 'T00:00:00Z').toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'}) : '—');
const when = (s) => (s ? new Date(s).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : '—');
const compact = (n) => new Intl.NumberFormat('en', {notation: 'compact', maximumFractionDigits: 1}).format(n || 0);
const LABEL = {revenue: 'Revenue', capex: 'Capex', opex: 'Opex', cost_of_revenue: 'Cost of revenue', cost_of_revenue_part: 'Cost line', operating_income: 'Operating income'};
const XBRL = {agree: 'matches SEC data', definition_gap: 'differs from SEC data, explained by code', unresolved: 'differs from SEC data, decided by a person', not_reported: 'not reported'};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
let me = 'Kenny Geiler';
try { me = localStorage.getItem('datahq-me') || me; } catch {}
$('#me').value = me;
$('#me').addEventListener('input', (e) => { me = e.target.value; try { localStorage.setItem('datahq-me', me); } catch {} });

function table(cols, rows, {key, onRow, detail} = {}) {
  const tb = h('tbody');
  const draw = (list) => {
    tb.replaceChildren();
    for (const r of list) {
      const tr = h('tr', {class: onRow || detail ? 'click' : null}, cols.map((c) => h('td', {class: [c.n && 'n', c.wide && 'wide'].filter(Boolean).join(' ') || null}, c.f ? c.f(r) : r[c.k] ?? '—')));
      tb.append(tr);
      if (onRow) tr.addEventListener('click', () => onRow(r));
      if (detail) tr.addEventListener('click', () => {
        const next = tr.nextElementSibling;
        if (next && next.classList.contains('detail')) { next.remove(); tr.classList.remove('open'); return; }
        tr.classList.add('open');
        tr.after(h('tr', {class: 'detail'}, h('td', {colspan: cols.length}, detail(r))));
      });
    }
  };
  let sort = null, dir = 1;
  const head = h('tr', {}, cols.map((c) => {
    const th = h('th', {class: [c.n && 'n', c.wide && 'wide'].filter(Boolean).join(' ') || null});
    if (c.sort === false) th.append(c.t);
    else th.append(h('button', {type: 'button', style: 'color:inherit', onclick: () => {
      dir = sort === c ? -dir : (c.n ? -1 : 1); sort = c;
      const v = c.s || ((r) => r[c.k]);
      draw([...rows].sort((a, b) => { const x = v(a), y = v(b); if (x == null || x === '') return 1; if (y == null || y === '') return -1; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * dir; }));
    }}, c.t));
    return th;
  }));
  draw(rows);
  return h('div', {class: 'scroll'}, h('table', {}, h('thead', {}, head), tb));
}

function bars(list) {
  return h('div', {class: 'bars'}, list.map((b) => h('div', {class: 'bar'}, h('span', {}, b.name),
    h('div', {class: 'track'}, h('i', {class: b.cls || null, style: `width:${Math.max(0, Math.min(100, b.pct))}%`})), h('span', {class: 'v'}, b.v))));
}

// ── Dashboard ───────────────────────────────────────────────────────────────
let hqCache = null;
const hq = async (fresh) => (hqCache = !fresh && hqCache ? hqCache : await api('/api/hq'));
const SHORT = {cost_lines_summed: 'Confirm the cost-of-revenue lines', xbrl_reconcile: "Disagrees with the SEC's data", row_label_switch: 'Line renamed, not confirmed',
  jump: 'Big move, not confirmed', outlier_vs_own_history: 'Unusual year, not confirmed', coverage: 'A year is missing'};
const KIND = {restated: 'Restated', jump: 'Big move', capex_intensity: 'Capex vs revenue', opex_over_revenue: 'Opex above revenue'};
const where = (list) => list.map((x) => [LABEL[x.field] || x.field, x.period].filter(Boolean).join(' ')).filter(Boolean).join(', ');
const pct = (x) => (x < .001 ? '<0.1%' : `${(100 * x).toFixed(x < .1 ? 1 : 0)}%`);
function change(f) {
  if (f.kind === 'restated') return `${usd(f.before)} → ${usd(f.after)} (${f.after >= f.before ? '+' : '−'}${pct(f.size)})`;
  if (f.kind === 'jump') return `${usd(f.before)} → ${usd(f.after)} (${f.size.toFixed(1)}×)`;
  if (f.kind === 'capex_intensity') return `capex ${pct(f.size)} of revenue`;
  return `opex ${usd(f.after)} on revenue ${usd(f.before)}`;
}
const groupQuestions = (qs) => { const g = new Map(); for (const q of qs) { const k = `${q.ticker}|${q.rule}`; if (!g.has(k)) g.set(k, []); g.get(k).push(q); } return [...g.values()]; };

function decideRow(list, label) {
  const reason = h('input', {type: 'text', placeholder: 'Your reason', 'aria-label': 'Reason', style: 'flex:1;min-width:14rem'});
  const status = h('span', {class: 'muted small'});
  const btn = h('button', {type: 'button', class: 'btn', onclick: async () => {
    status.textContent = 'Saving…';
    try {
      const r = await api('/api/decide', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ids: list.map((e) => e.exception_id), reason: reason.value, by: me})});
      status.textContent = `Saved for ${me}.`; hqCache = null; setTimeout(route, 800);
    } catch (err) { status.textContent = err.message; status.classList.add('bad'); }
  }}, label);
  return h('div', {class: 'row', style: 'margin-top:.6rem'}, reason, btn, status);
}

// ── Dashboard ───────────────────────────────────────────────────────────────
async function dashboard(view) {
  const d = await hq(true);
  const H = d.health[0];
  const next = d.companies.filter((c) => c.next_10k_expected).sort((a, b) => a.next_10k_expected.localeCompare(b.next_10k_expected))[0];
  const stale = H.changed_since_release > 0;
  const W = d.watch, unread = W ? W.new.length : 0, oldCheck = !W || (Date.now() - new Date(W.checked_at)) > 2 * 864e5;
  const groups = groupQuestions(d.questions), blocking = groups.filter((g) => g[0].severity === 'block').length;
  const S = d.since;
  let shown = 10;
  const findBox = h('div');
  const drawFindings = () => findBox.replaceChildren(
    table([{t: 'Company', k: 'company'}, {t: 'Year', k: 'period'}, {t: 'What', k: 'kind', f: (f) => `${KIND[f.kind]}, ${(LABEL[f.field] || f.field).toLowerCase()}`},
      {t: 'Change', sort: false, f: change}], d.findings.slice(0, shown), {onRow: (f) => go('company/' + f.ticker)}),
    d.findings.length > shown ? h('button', {type: 'button', class: 'small', style: 'margin-top:.5rem', onclick: () => { shown = d.findings.length; drawFindings(); }}, `Show all ${d.findings.length}`) : '');
  drawFindings();

  view.append(h('div', {class: 'stack'},
    h('header', {class: 'pagehead'}, h('h1', {}, 'Morning check'),
      h('p', {class: 'muted small'}, `Last full run ${H.full_run ? when(H.full_run.at) : when(H.run_at)} · `,
        W ? h('span', {class: oldCheck || unread ? 'bad' : null}, `SEC checked ${when(W.checked_at)}${unread ? `, ${unread} new filing${unread > 1 ? 's' : ''} not read` : ', nothing new'}`) : h('span', {class: 'bad'}, 'SEC not checked'))),
    h('section', {class: 'figs'},
      fig('Questions for you', int(groups.length), blocking ? `${blocking} block the next release` : 'none block a release'),
      fig('Values accounted for', `${int(H.agree + H.explained + H.decided)} / ${int(H.values)}`, `${int(H.agree)} match the SEC's data`, H.waiting > 0),
      fig('Release', H.latest_release || '—', stale ? `${int(H.changed_since_release)} changes since. Release again: ledger release vX.Y.Z --stage 3, then signoff.` : `current, signed ${day(H.latest_release_at)}`, stale),
      fig('Next 10-K', next ? next.company : '—', next ? `around ${day(next.next_10k_expected)}` : '')),
    h('div', {class: 'split'},
      h('section', {}, h('h2', {}, 'Your judgement'),
        groups.length ? table([{t: 'Company', k: 'company', s: (g) => g[0].company, f: (g) => g[0].company},
          {t: 'Question', s: (g) => g[0].rule, f: (g) => [SHORT[g[0].rule] || g[0].title, g[0].severity === 'block' ? h('span', {class: 'muted small'}, ' · blocks release') : '']},
          {t: 'Where', sort: false, f: (g) => h('span', {class: 'muted'}, where(g) || '—')}], groups, {onRow: (g) => go('company/' + g[0].ticker)})
          : h('p', {class: 'muted'}, 'Nothing needs a person.')),
      h('section', {}, h('h2', {}, 'Since last run'),
        S ? h('div', {class: 'kv'}, [['Filings read', S.new_filings.length], ['Values changed', S.changed.length], ['Newly restated', S.newly_restated.length], ['Items opened', S.opened.length], ['Items closed', S.closed.length]]
          .flatMap(([k, v]) => [h('span', {class: 'muted'}, k), h('span', {class: 'n'}, int(v))]), h('span', {class: 'muted small', style: 'grid-column:1/-1'}, `since ${when(S.since)}`))
          : h('p', {class: 'muted'}, 'Shows from the next run.'))),
    h('section', {}, h('h2', {}, 'What happened at the companies'), d.findings.length ? findBox : h('p', {class: 'muted'}, 'Nothing unusual.')),
    h('section', {}, h('h2', {}, 'Companies'),
      table([{t: 'Company', k: 'company', f: (r) => [r.company, ' ', h('span', {class: 'muted small'}, r.ticker)]},
        {t: 'Questions', k: 'questions', n: 1, f: (r) => h('span', {class: r.questions ? null : 'muted'}, int(r.questions))},
        {t: 'Restated', k: 'restated', n: 1, f: (r) => h('span', {class: r.restated ? null : 'muted'}, int(r.restated))},
        {t: 'AI spend', k: 'ai_statements', n: 1, f: (r) => h('span', {class: r.ai_statements ? null : 'muted'}, r.ai_statements ? `${int(r.ai_statements)} stmt${r.ai_statements > 1 ? 's' : ''}` : 'none')},
        {t: 'Values', k: 'values', n: 1, f: (r) => (r.filings ? int(r.values) : h('span', {class: 'muted small'}, 'no 10-K yet'))},
        {t: 'Last 10-K', k: 'last_10k_filed', n: 1, wide: 1, f: (r) => day(r.last_10k_filed)},
        {t: 'Next 10-K', k: 'next_10k_expected', n: 1, f: (r) => day(r.next_10k_expected)}],
        [...d.companies].sort((a, b) => b.questions - a.questions || b.restated - a.restated || a.company.localeCompare(b.company)), {onRow: (r) => go('company/' + r.ticker)})),
    h('p', {class: 'muted small'}, d.pipeline.every((s) => s.ok) || d.pipeline.filter((s) => !s.ok).every((s) => s.step === "Match the SEC's data")
      ? `Pipeline: every step passed. ${int(H.filings)} 10-Ks read, ${int(H.cells_confirmed)} cited cells confirmed on the filings, 0 of ${int(H.faults)} planted mistakes got through.`
      : h('span', {class: 'bad'}, 'Pipeline: ' + d.pipeline.filter((s) => !s.ok).map((s) => `${s.step} ${int(s.done)} / ${int(s.of)}`).join(', ')))));
}

const fig = (l, n, s, bad) => h('div', {class: 'fig'}, h('div', {class: 'l'}, l), h('div', {class: 'n' + (bad ? ' bad' : '')}, n), h('div', {class: 's' + (bad ? ' bad' : '')}, s));

// ── Company: from the filing to the number ───────────────────────────────────
async function companyPage(view, ticker) {
  const d = await hq();
  ticker ||= d.companies[0].ticker;
  const pick = h('select', {'aria-label': 'Company', onchange: (e) => go('company/' + e.target.value)},
    d.companies.map((c) => h('option', {value: c.ticker, selected: c.ticker === ticker || null}, `${c.company} (${c.ticker})`)));
  view.append(h('div', {class: 'row', style: 'margin-bottom:1.5rem'}, pick, h('a', {href: '#add', class: 'small'}, 'Add a company')));
  const c = await api('/api/company?t=' + encodeURIComponent(ticker));
  const docs = c.documents, sc = c.scorecard;
  const questions = d.questions.filter((q) => q.ticker === ticker), findings = d.findings.filter((f) => f.ticker === ticker);
  const groups = groupQuestions(questions);
  const cells = c.values.flatMap((v) => v.sources), confirmed = cells.filter((s) => s.machine && s.machine.match).length;
  const read = docs.filter((x) => x.agent && x.agent.outcome === 'ok').length;
  const sect = (title, note, body) => h('section', {}, h('div', {class: 'sechead'}, h('h2', {}, title), note ? h('span', {class: 'muted small'}, note) : ''), body);

  view.append(h('div', {class: 'stack'},
    h('header', {class: 'pagehead'}, h('h1', {}, c.name),
      h('p', {class: 'muted small'}, [c.ticker, docs.length ? `${docs.length} 10-Ks read` : 'no 10-K yet', `${int(sc.values)} values`, groups.length ? `${groups.length} question${groups.length > 1 ? 's' : ''} for you` : 'no questions', c.note].filter(Boolean).join(' · '))),
    groups.length > 0 && sect('Your judgement', null, h('div', {class: 'stack', style: 'gap:1.75rem'}, groups.map((g) => questionCard(g)))),
    docs.length > 0 && sect('The numbers', `${int(sc.agree)} of ${int(sc.values)} match the SEC's data`, valueGrid(c.values, questions.some((q) => q.rule === 'cost_lines_summed'))),
    docs.length > 0 && sect('How each number was cleaned', 'from the cell in the 10-K to the released value', cleaningTable(c.values)),
    c.ai_spend.length > 0 && sect('What the filing says about AI spend', `${c.ai_spend.filter((a) => a.ai_amount != null).length} of ${c.ai_spend.length} give an AI dollar amount`, aiTable(c.ai_spend)),
    findings.length > 0 && sect('What happened', null, table([{t: 'Year', k: 'period'}, {t: 'What', k: 'kind', f: (f) => `${KIND[f.kind]}, ${(LABEL[f.field] || f.field).toLowerCase()}`}, {t: 'Change', sort: false, f: change}], findings)),
    sect('Filings', `${read} of ${docs.length} read by the agent · ${confirmed} of ${cells.length} cited cells re-read on the filing`, [

// Fields down, years across; a note under a value says what a reader must know. Click a value for its source.
function valueGrid(values, costLinesOpen) {
  const years = [...new Set(values.map((v) => v.period))].sort(), fields = ['revenue', 'capex', 'opex'];
  const by = new Map(values.map((v) => [`${v.field}|${v.period}`, v]));
  const rev = (y) => by.get(`revenue|${y}`)?.value;
  const panel = h('div', {style: 'margin-top:1rem'});
  const mark = (v) => {
    if (v.decision) return `decided: ${v.decision.kind}`;
    if (v.label === 'definition_gap') return costLinesOpen ? 'waits on your cost-line call' : 'cost lines confirmed';
    if (v.basis === 'restated') return `restated from ${usd(v.first_reported)}`;
    if (v.field === 'opex' && rev(v.period) != null && v.value > rev(v.period)) return 'above revenue';
    if (v.label !== 'agree') return XBRL[v.label] || v.label;
    return '';
  };
  return h('div', {}, h('div', {class: 'scroll'}, h('table', {class: 'grid'},
    h('thead', {}, h('tr', {}, h('th', {}, ''), years.map((y) => h('th', {class: 'n'}, y)))),
    h('tbody', {}, fields.map((f) => h('tr', {}, h('td', {}, LABEL[f]), years.map((y) => {
      const v = by.get(`${f}|${y}`);
      if (!v) return h('td', {class: 'n muted'}, '—');
      const m = mark(v);
      return h('td', {class: 'n cell', tabindex: 0, onclick: () => { panel.replaceChildren(h('h3', {style: 'margin:0 0 .5rem'}, `${LABEL[f]} ${y}: ${usd(v.value)}`), sources(v)); }},
        h('div', {}, usd(v.value)), m ? h('div', {class: 'note'}, m) : '');
    })))))), panel);
}

// The cleaning, one row per value: what the filing printed, what was done to it, what came out, and how it was checked.
function cleaningTable(values) {
  const rows = values.map((v) => {
    const s = v.sources, one = s[0] || {};
    const scale = one.scale ? ({1: 'units', 1000: 'thousands', 1000000: 'millions', 1000000000: 'billions'})[one.scale] || `×${one.scale}` : '';
    const steps = [];
    if (v.field === 'opex') steps.push('revenue − cost of revenue − operating income, one column');
    if (scale && scale !== 'units') steps.push(`in ${scale}`);
    if (s.some((x) => /^\(|^-/.test(x.cell || '') && x.value > 0)) steps.push('brackets → positive');
    if (s.some((x) => /^[—–-]$/.test((x.cell || '').trim()))) steps.push('dash → 0');
    if (s.some((x) => x.field === 'cost_of_revenue_part')) steps.push(`${s.filter((x) => x.field === 'cost_of_revenue_part').length} cost lines summed`);
    steps.push(`column “${(one.col || '').split(' | ').pop()}” → ${v.period}`);
    steps.push(v.basis === 'restated' ? `newest 10-K (${day(one.filed)}); first reported ${usd(v.first_reported)}` : `10-K filed ${day(one.filed)}`);
    const check = v.decision ? `decided: ${v.decision.kind}` : v.label === 'agree' ? 'matches SEC' : v.label === 'definition_gap' ? 'cost lines: your call' : XBRL[v.label] || v.label;
    return {v, field: LABEL[v.field], period: v.period, printed: v.field === 'opex' ? s.map((x) => `${({revenue: 'revenue', cost_of_revenue: 'cost', cost_of_revenue_part: 'cost line', operating_income: 'op. income'})[x.field] || x.field} ${x.cell}`).join('\n') : one.cell, row: v.field === 'opex' ? '' : one.row, steps, value: v.value, check,
      confirmed: s.length && s.every((x) => x.machine && x.machine.match)};
  });
  return table([{t: 'Value', k: 'field', s: (r) => r.field + r.period, f: (r) => [r.field, ' ', h('span', {class: 'muted'}, r.period)]},
    {t: 'In the 10-K', k: 'printed', f: (r) => [h('span', {class: 'mono brk'}, r.printed || '—'), r.row ? h('div', {class: 'muted small brk'}, r.row) : '']},
    {t: 'Cleaning', sort: false, f: (r) => h('div', {class: 'small brk'}, r.steps.join(' · ')), wide: 1},
    {t: 'Value', k: 'value', n: 1, f: (r) => usd(r.value)},
    {t: 'Checked', k: 'check', f: (r) => h('span', {class: r.check === 'matches SEC' ? 'muted' : null}, r.check, r.confirmed ? h('div', {class: 'muted small'}, 're-read on filing') : '')}],
    rows, {detail: (r) => sources(r.v)});
}

async function addPage(view) {

function agentCard(a) {

  const status = h('span', {class: 'muted small'});

  const useBtn = h('button', {type: 'button', onclick: () => post('use', {version: shown}, `Now using ${shown}.`)}, 'Use this version');
  const saveBtn = h('button', {type: 'button', class: 'btn', onclick: () => post('prompt', {text: text.value, note: note.value}, (r) => `Saved as ${r.version} and in use.`)}, 'Save as new version');

  async function post(what, body, done) {
    status.textContent = 'Saving…';
    try {
      const r = await api(`/api/agents/${a.id}/${what}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({...body, by: me})});
      status.textContent = typeof done === 'function' ? done(r) : done;
      setTimeout(route, 900);
    } catch (e) { status.textContent = e.message; status.classList.add('bad'); }

  const model = h('input', {type: 'text', value: a.llm.model, 'aria-label': 'Model id', style: 'width:14rem'});

  const allRuns = a.runs;  // newest first
  const latest = [...allRuns.reduce((m, r) => (m.has(r.accession) ? m : m.set(r.accession, r)), new Map()).values()];  // the newest run of each filing
  let runs = latest;
  const tickers = [...new Set(allRuns.map((r) => r.ticker).filter(Boolean))].sort();
  const everyRun = h('label', {class: 'small muted'}, h('input', {type: 'checkbox', onchange: (e) => { runs = e.target.checked ? allRuns : latest; drawRuns(); }}), ` show every run (${int(allRuns.length)}), not just the latest per filing`);
  const runBox = h('div');

  function drawRuns() {
    const list = runs.filter((r) => !runFilter.value || r.ticker === runFilter.value).sort((x, y) => (x.outcome === 'ok') - (y.outcome === 'ok'));
    runBox.replaceChildren(table([{t: 'When', k: 'started_at', f: (r) => when(r.started_at)}, {t: 'Company', k: 'ticker'}, {t: 'Fiscal year end', k: 'period', f: (r) => day(r.period), wide: 1},
      {t: 'Model', s: (r) => r.versions.model, f: (r) => r.versions.model || h('span', {class: 'muted'}, 'in-session')}, {t: 'Prompt', s: (r) => r.versions.prompt, f: (r) => r.versions.prompt},
      {t: 'Tokens', n: 1, s: (r) => (r.detail.input_tokens ?? 0) + (r.detail.output_tokens ?? 0), f: (r) => (r.detail.input_tokens != null ? int(r.detail.input_tokens + r.detail.output_tokens) : '—')},
      {t: 'Tries', n: 1, s: (r) => r.detail.attempts, f: (r) => r.detail.attempts ?? '—'},
      {t: 'Outcome', k: 'outcome', f: (r) => h('span', {class: r.outcome === 'ok' ? null : 'bad'}, r.outcome === 'ok' ? `${r.detail.values ?? '—'} values` : r.detail.error || r.outcome)}],

    h('section', {}, h('h2', {}, 'History'), table([{t: 'When', k: 'at', f: (x) => when(x.at)}, {t: 'Who', k: 'by'}, {t: 'Change', k: 'change'}], [...a.history].reverse())),

      h('div', {class: 'row', style: 'margin-bottom:.6rem'}, runFilter, everyRun), runBox));
  queueMicrotask(showPrompt);
  return card;

        h('label', {}, h('span', {class: 'muted small'}, 'Layout '), h('select', {onchange: (e) => { state.layout = e.target.value; render(); }},
          h('option', {value: 'wide', selected: state.layout === 'wide' || null}, 'Years across'), h('option', {value: 'long', selected: state.layout === 'long' || null}, 'One row per value'))),
        h('button', {type: 'button', class: 'btn', onclick: exportCsv}, 'Export CSV'),
        relOf().packet ? h('a', {href: `/packet/${relOf().version}.zip`, class: 'small'}, 'Download the signed packet (zip)') : h('span', {class: 'muted small'}, 'Packet: only a signed release has one')),
      h('div', {}, h('div', {class: 'k'}, 'Companies ', h('button', {type: 'button', class: 'small', onclick: () => { state.tickers = all().map(([t]) => t); drawControls(); render(); }}, 'all'), ' ',
        h('button', {type: 'button', class: 'small', onclick: () => { state.tickers = []; drawControls(); render(); }}, 'none')),
        checks(all().map(([t, n]) => [t, `${n}`]), state.tickers, toggle('tickers'))),
      h('div', {class: 'row', style: 'gap:3rem;align-items:flex-start'},
        h('div', {}, h('div', {class: 'k'}, 'Metrics'), checks(METRICS.map((m) => [m.id, m.t]), state.metrics, toggle('metrics')),
          h('div', {class: 'muted small', style: 'margin-top:.5rem;max-width:34rem'}, METRICS.map((m) => h('div', {}, `${m.t}: ${m.def}`)),
            h('div', {}, "Years are each company's own fiscal year; the year end is in the export."))),
        h('div', {}, h('div', {class: 'k'}, 'Fiscal years'), checks(yearsAll().map((y) => [y, y]), state.years, toggle('years')))));
  }

  function cells() {  // one row per company, metric and year, in the chosen order
    const rel = relOf(), by = new Map(rel.rows.map((r) => [`${r.ticker}|${r.field}|${r.period}`, r]));
    const names = new Map(all());
    const span = new Map();  // each company's first and last released fiscal year, to say why a year is blank
    for (const r of rel.rows) { const s = span.get(r.ticker) || [r.period, r.period]; span.set(r.ticker, [r.period < s[0] ? r.period : s[0], r.period > s[1] ? r.period : s[1]]); }
    const why = (t, y) => { const [a, b] = span.get(t) || []; return !a ? 'no 10-K yet' : y > b ? '10-K not filed yet' : y < a ? 'before first 10-K' : 'not in this release'; };
    const out = [];
    for (const t of all().map(([x]) => x).filter((x) => state.tickers.includes(x)))
      for (const m of METRICS.filter((m) => state.metrics.includes(m.id)))
        for (const y of state.years.slice().sort()) {
          let value = null, basis = '', xbrl = '', citations = '', period_end = '', note = '';
          if (m.ratio) {
            const c = by.get(`${t}|capex|${y}`), r = by.get(`${t}|revenue|${y}`);
            if (c && r && c.value !== '' && r.value !== '' && Number(r.value)) { value = Number(c.value) / Number(r.value); period_end = r.period_end; }
            else note = c || r ? 'needs both revenue and capex' : why(t, y);
          } else {
            const r = by.get(`${t}|${m.id}|${y}`);
            if (r) { value = r.value === '' ? null : Number(r.value); basis = r.basis; xbrl = r.xbrl; citations = r.citations; period_end = r.period_end;
              if (value == null) note = r.source === 'missing' ? 'rejected by a reviewer' : 'not reported in the 10-K'; }
            else note = why(t, y);
          }
          out.push({ticker: t, company: names.get(t), metric: m.id, metric_label: m.t, ratio: !!m.ratio, period: y, period_end, value, note, basis, xbrl, citations});
        }
    return out;
  }
  const fmt = (c) => (c.value == null ? h('span', {class: 'muted small'}, c.note || '—') : c.ratio ? (100 * c.value).toFixed(1) + '%' : usd(c.value));

  function render() {
    const rows = cells();
    out.replaceChildren();
    if (!rows.length) { out.append(h('p', {class: 'msg'}, 'Nothing selected.')); return; }
    out.append(charts(rows));
    if (state.layout === 'long') {
      out.append(h('section', {}, h('h2', {}, `${int(rows.length)} values`), table([{t: 'Company', k: 'company'}, {t: 'Metric', k: 'metric_label'}, {t: 'Year', k: 'period'},
        {t: 'Value', k: 'value', n: 1, f: fmt}, {t: 'Basis', k: 'basis', wide: 1}, {t: 'SEC data', k: 'xbrl', wide: 1}], rows,
        {detail: (c) => h('div', {class: 'src mono'}, c.citations || 'Computed from the released revenue and capex.')})));
    } else {
      const years = state.years.slice().sort();
      const groups = new Map();
      for (const c of rows) { const k = `${c.ticker}|${c.metric}`; if (!groups.has(k)) groups.set(k, {company: c.company, metric_label: c.metric_label, ratio: c.ratio, y: {}}); groups.get(k).y[c.period] = c; }
      out.append(h('section', {}, h('h2', {}, `${int(groups.size)} series`), table([{t: 'Company', k: 'company'}, {t: 'Metric', k: 'metric_label'},
        ...years.map((y) => ({t: y, n: 1, s: (g) => g.y[y]?.value, f: (g) => (g.y[y] ? fmt(g.y[y]) : '—')}))], [...groups.values()])));
    }
  }

  function charts(rows) {
    const wrap = h('div', {class: 'two'});
    const tick = [...new Set(rows.map((r) => r.ticker))];
    if (tick.length > COLORS.length) { wrap.append(h('p', {class: 'muted'}, `Charts show up to ${COLORS.length} companies; ${tick.length} are selected. The table has them all.`)); return wrap; }
    const years = state.years.slice().sort();
    for (const m of METRICS.filter((m) => state.metrics.includes(m.id))) {
      const mine = rows.filter((r) => r.metric === m.id && r.value != null);
      if (!mine.length) continue;
      wrap.append(h('section', {}, h('h2', {}, m.t), lineChart(mine, years, tick, m.ratio)));
    }
    return wrap;
  }

  function exportCsv() {
    const rows = cells();
    const cols = ['ticker', 'company', 'metric', 'period', 'period_end', 'value', 'note', 'basis', 'xbrl', 'citations'];
    const esc = (v) => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replaceAll('"', '""') + '"' : s; };
    const csv = [cols.join(','), ...rows.map((r) => cols.map((c) => esc(r[c])).join(','))].join('\n') + '\n';
    const a = h('a', {href: URL.createObjectURL(new Blob([csv], {type: 'text/csv'})), download: `capex-ledger-${state.rel}.csv`});
    document.body.append(a); a.click(); a.remove();
  }

  drawControls();
  render();
}

function lineChart(rows, years, tickers, ratio) {
  const W = 520, H = 240, L = 56, R = 64, T = 10, B = 26;
  const vals = rows.map((r) => r.value);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const x = (y) => L + (years.length === 1 ? (W - L - R) / 2 : (years.indexOf(y) * (W - L - R)) / (years.length - 1));
  const yv = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ns = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs) => { const el = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
  const svg = s('svg', {viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img', 'aria-label': 'Line chart'});
  const fmtAxis = (v) => {
    if (ratio) return Math.round(v * 100) + '%';
    const a = Math.abs(v), sign = v < 0 ? '−' : '';
    return a >= 1e9 ? `${sign}$${+(a / 1e9).toFixed(a >= 1e10 ? 0 : 1)}B` : `${sign}$${+(a / 1e6).toFixed(a >= 1e7 ? 0 : 1)}M`;
  };
  for (let i = 0; i <= 4; i++) {
    const v = lo + ((hi - lo) * i) / 4;
    svg.append(s('line', {x1: L, x2: W - R, y1: yv(v), y2: yv(v), stroke: 'var(--faint)', 'stroke-width': 1}));
    const t = s('text', {x: L - 6, y: yv(v) + 4, 'text-anchor': 'end'}); t.textContent = fmtAxis(v); svg.append(t);
  }
  years.forEach((y) => { const t = s('text', {x: x(y), y: H - 6, 'text-anchor': 'middle'}); t.textContent = y.replace('FY', ''); svg.append(t); });
  const tip = $('#tip'), ends = [];
  tickers.forEach((tk, i) => {
    const pts = rows.filter((r) => r.ticker === tk).sort((a, b) => a.period.localeCompare(b.period));
    if (!pts.length) return;
    const color = COLORS[i % COLORS.length];
    svg.append(s('polyline', {points: pts.map((p) => `${x(p.period)},${yv(p.value)}`).join(' '), fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}));
    for (const p of pts) {
      const dot = s('circle', {cx: x(p.period), cy: yv(p.value), r: 3.5, fill: color});
      const hit = s('circle', {cx: x(p.period), cy: yv(p.value), r: 10, fill: 'transparent'});
      hit.addEventListener('mousemove', (e) => { tip.hidden = false; tip.textContent = `${p.company} ${p.period}: ${ratio ? (100 * p.value).toFixed(1) + '%' : usd(p.value)}`; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px'; });
      hit.addEventListener('mouseleave', () => { tip.hidden = true; });
      svg.append(dot, hit);
    }
    const last = pts[pts.length - 1];
    ends.push({tk, color, x: x(last.period) + 7, y: yv(last.value) + 4});
  });
  ends.sort((a, b) => a.y - b.y);  // end labels: keep 12px apart so none overlap
  for (let i = 1; i < ends.length; i++) if (ends[i].x === ends[i - 1].x && ends[i].y - ends[i - 1].y < 12) ends[i].y = ends[i - 1].y + 12;
  for (const e of ends) { const lab = s('text', {x: e.x, y: e.y}); lab.textContent = e.tk; lab.style.fill = e.color; svg.append(lab); }
  return h('div', {}, svg);
}

// ── Insights: what the signed numbers say ────────────────────────────────────
const ROLE = {buyer: 'AI buyers', seller: 'AI sellers', other: 'Other majors'};
const x_ = (n) => `${n.toFixed(1)}×`;
async function insightsPage(view) {
  const d = await api('/api/insights');
  if (!d.release) { view.append(h('p', {class: 'msg'}, 'No signed release yet. Insights only read signed numbers.')); return; }
  const ys = d.years, B = d.totals.buyer, S = d.totals.seller;
  const y0 = ys.find((y) => B[y].n > 0), y1 = [...ys].reverse().find((y) => B[y].n >= B[y0].n) || ys[ys.length - 1];
  const bars_ = (list, key, fmt) => { const max = Math.max(...list.map(key)) || 1; return bars(list.map((c) => ({name: c.company, pct: 100 * key(c) / max, v: fmt(c), cls: c.role === 'seller' ? 'note' : null}))); };
  const byRole = (role) => d.companies.filter((c) => c.role === role);
  const intensity = [...d.companies].sort((a, b) => b.intensity - a.intensity);
  const growth = d.companies.filter((c) => c.capex_growth).sort((a, b) => b.capex_growth - a.capex_growth);
  const bc = B[y1].capex / B[y0].capex, sr = S[y1].revenue / S[y0].revenue;
  const yrs = ys.filter((y) => B[y].n > 0 || S[y].n > 0);

  view.append(h('div', {class: 'stack'},
    h('header', {class: 'pagehead'}, h('h1', {}, 'The AI buildout, in the signed numbers'),
      h('p', {class: 'muted small'}, `From release ${d.release}, signed by ${d.signed_by} on ${day(d.signed_at)}. ${byRole('buyer').length} buyers, ${byRole('seller').length} sellers, ${byRole('other').length} other majors. Fiscal years are each company's own.`)),
    h('section', {}, h('h2', {}, 'Who pays, who gets paid'),
      h('p', {class: 'lede', style: 'margin-bottom:1rem'}, `Buyers' capex went from ${usd(B[y0].capex)} in ${y0} to ${usd(B[y1].capex)} in ${y1} (${x_(bc)}). Sellers' revenue went from ${usd(S[y0].revenue)} to ${usd(S[y1].revenue)} (${x_(sr)}).`),
      h('div', {class: 'scroll'}, table([{t: '', sort: false, f: (r) => r.name},
        ...yrs.map((y) => ({t: y, n: 1, sort: false, f: (r) => (r.v[y] ? usd(r.v[y]) : h('span', {class: 'muted'}, '—'))}))],
        [{name: "Buyers' capex", v: Object.fromEntries(yrs.map((y) => [y, B[y].capex]))}, {name: "Sellers' revenue", v: Object.fromEntries(yrs.map((y) => [y, S[y].revenue]))},
         {name: "Buyers' revenue", v: Object.fromEntries(yrs.map((y) => [y, B[y].revenue]))}])),
      h('p', {class: 'muted small', style: 'margin-top:.5rem'}, `Sums over the companies with a 10-K for the year (${yrs.map((y) => `${y}: ${B[y].n + S[y].n}`).join(', ')}). A company's first year is missing where its 10-Ks start later.`)),
    h('div', {class: 'two'},
      h('section', {}, h('h2', {}, 'Capex as a share of revenue, latest year'), h('p', {class: 'muted small', style: 'margin-bottom:.6rem'}, 'Grey bars are sellers.'),
        bars_(intensity, (c) => c.intensity, (c) => `${pct(c.intensity)} · ${c.last}`)),
      h('section', {}, h('h2', {}, 'Capex growth, first year to latest'), h('p', {class: 'muted small', style: 'margin-bottom:.6rem'}, 'How many times capex grew over the window.'),
        bars_(growth, (c) => Math.log10(c.capex_growth) + 1, (c) => `${x_(c.capex_growth)} · ${c.first}→${c.last}`))),
    h('section', {}, h('h2', {}, 'Every company'),
      table([{t: 'Company', k: 'company'}, {t: 'Role', k: 'role', f: (c) => ROLE[c.role]}, {t: 'Years', sort: false, f: (c) => `${c.first.slice(2)}–${c.last.slice(2)}`},
        {t: 'Revenue, latest', k: 'revenue_last', n: 1, f: (c) => usd(c.revenue_last)}, {t: 'Capex, latest', k: 'capex_last', n: 1, f: (c) => usd(c.capex_last)},
        {t: 'Capex ÷ revenue', k: 'intensity', n: 1, f: (c) => pct(c.intensity)}, {t: 'Capex growth', k: 'capex_growth', n: 1, f: (c) => (c.capex_growth ? x_(c.capex_growth) : '—')},
        {t: 'Revenue growth', k: 'revenue_growth', n: 1, f: (c) => (c.revenue_growth ? x_(c.revenue_growth) : '—')}],
        [...d.companies].sort((a, b) => b.capex_last - a.capex_last), {onRow: (c) => go('company/' + c.ticker)})),
    h('p', {class: 'muted small'}, 'Capex is cash paid for property and equipment as each company reports it; where a line includes more or less (Nvidia: intangibles; IREN: net of hardware prepayments), the release notes say so.')));
}

// ── Routing ─────────────────────────────────────────────────────────────────
function go(hash) { location.hash = hash; }
async function route() {
  const [page, arg] = (location.hash.slice(1) || 'dashboard').split('/');
  document.querySelectorAll('nav [data-nav]').forEach((a) => a.classList.toggle('on', a.dataset.nav === (page === 'add' ? 'company' : page)));
  const view = $('#view');
  view.replaceChildren();
  try {
    if (page === 'company') await companyPage(view, arg);
    else if (page === 'agents') await agentsPage(view);
    else if (page === 'add') await addPage(view);
    else if (page === 'insights') await insightsPage(view);
    else if (page === 'outputs') await outputsPage(view, arg);
    else await dashboard(view);
  } catch (e) {
    view.replaceChildren(h('p', {class: 'msg bad'}, e.message));
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
