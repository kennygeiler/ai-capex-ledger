<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<title>DATAHQ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.3.2/dist/css/tabler.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.34.0/plotly.min.js" defer></script>
<style>
  /* DATAHQ on Tabler. The kit carries the look; this block maps the app's own layout classes onto the kit's tokens. */
  :root { --bg: var(--tblr-bg-surface); --fg: var(--tblr-body-color); --muted: var(--tblr-secondary); --faint: var(--tblr-border-color); --accent: var(--tblr-primary); --bad: var(--tblr-red); --bar: var(--tblr-bg-surface-secondary); --row: var(--tblr-active-bg, rgba(0,0,0,.03));
    --font: var(--tblr-font-sans-serif); --mono: var(--tblr-font-monospace); --tblr-font-sans-serif: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: -999px; top: .5rem; background: var(--tblr-bg-surface); padding: .4rem .7rem; z-index: 1100; }
  .skip:focus { left: .5rem; }
  body { font-size: .875rem; }
  main { padding-top: 1.25rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
  h2 { font-size: .95rem; font-weight: 600; margin: 0 0 .5rem; }
  h3 { font-size: .9rem; font-weight: 600; }
  p { margin: 0; }
  .lede { color: var(--tblr-secondary); max-width: 70ch; margin-top: .25rem; }
  .lede b { color: var(--tblr-body-color); font-weight: 600; }
  .muted { color: var(--tblr-secondary); }
  .bad { color: var(--tblr-red); }
  td > span.bad, td > span.muted { white-space: nowrap; }
  .small { font-size: .8rem; }
  .mono { font-family: var(--tblr-font-monospace); font-size: .8rem; }
  .brk { white-space: pre-wrap; word-break: break-word; }
  .num, td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.n { font-weight: 500; }
  td.n .note { font-weight: 400; }
  /* layout */
  .stack { display: grid; gap: 1.25rem; }
  .stack > * { min-width: 0; }
  .hrow { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
  .pagehead { display: grid; gap: .3rem; margin-bottom: .25rem; }
  /* figures: stat cards */
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); gap: .75rem; }
  .fig { background: var(--tblr-bg-surface); border: 1px solid var(--tblr-border-color); border-radius: var(--tblr-border-radius); padding: .6rem .85rem; }
  .fig .l { color: var(--tblr-secondary); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .fig .n { font-size: 1.35rem; line-height: 1.2; font-weight: 600; margin: .1rem 0; }
  .fig .s { color: var(--tblr-secondary); font-size: .78rem; }
  .fig .n.bad, .fig .s.bad { color: var(--tblr-red); }
  /* bars */
  /* tables the pages build by hand (grid, heat) */
  .scroll { overflow-x: auto; }
  table.grid, table.heat { width: 100%; }
  table.grid th, table.heat th { position: sticky; top: 0; z-index: 2; background: var(--tblr-bg-surface); }
  table.grid th:first-child, table.grid td:first-child, table.heat th:first-child, table.heat td:first-child { position: sticky; left: 0; background: var(--tblr-bg-surface); z-index: 1; }
  table.grid td.cell, table.heat td.cell { cursor: pointer; }
  table.grid td.cell:hover, table.heat td.cell:hover { color: var(--tblr-primary); }
  table.grid .note { font-size: .72rem; color: var(--tblr-secondary); white-space: normal; max-width: 9rem; margin-left: auto; }
  table.heat td.c { padding-inline: .5rem; background: color-mix(in srgb, var(--tblr-primary) calc(var(--i, 0) * 28%), transparent); }
  table.heat td.c .note { font-size: .72rem; color: var(--tblr-secondary); }
  table.heat td.moved { box-shadow: inset 3px 0 0 var(--tblr-primary); }
  tr.click { cursor: pointer; }
  tr.open td { color: var(--tblr-primary); }
  .detail td { padding: .25rem .75rem 1.25rem !important; }
  .mk { display: inline-block; width: 1.1em; text-align: center; margin-left: .25rem; font-weight: 600; }
  .mk.t { color: var(--tblr-green); }
  .mk.u { color: var(--tblr-secondary); opacity: .6; }
  .mk.x { color: var(--tblr-red); }
  .mk.d { color: var(--tblr-orange, #f76707); }
  .mk.o { color: var(--tblr-orange, #f76707); }
  .src { display: grid; gap: .3rem; margin-bottom: .9rem; max-width: 60rem; }
  .src img { max-width: min(100%, 40rem); border-radius: 4px; margin-top: .3rem; border: 1px solid var(--tblr-border-color); }
  /* text controls that the kit does not reach */
  textarea { width: 100%; min-height: 28rem; font: .8rem/1.55 var(--tblr-font-monospace); }
  textarea[readonly] { background: var(--tblr-bg-surface-secondary); resize: none; }
  pre.raw { white-space: pre-wrap; word-break: break-word; font: .78rem/1.5 var(--tblr-font-monospace); max-height: 30rem; overflow: auto; margin: .5rem 0 0; background: var(--tblr-bg-surface-secondary); padding: .6rem .75rem; border-radius: var(--tblr-border-radius); }
  .msg { color: var(--tblr-secondary); padding: 2rem 0; }
  .tip { position: fixed; pointer-events: none; background: var(--tblr-bg-surface); box-shadow: var(--tblr-shadow); border: 1px solid var(--tblr-border-color); border-radius: 6px; padding: .35rem .6rem; font-size: .8rem; z-index: 1090; }
  ul.plain { margin: .2rem 0 0; padding-left: 1.1rem; }
  ul.plain li { margin: .15rem 0; }
  .picks { display: flex; flex-wrap: wrap; gap: .25rem .8rem; font-size: .84rem; }
  .picks label { white-space: nowrap; cursor: pointer; }
  .controls { display: grid; gap: 1.1rem; }
  /* the drawer: the kit's offcanvas, opened by script */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(100%, 32rem); background: var(--tblr-bg-surface); box-shadow: var(--tblr-shadow-dropdown, -8px 0 30px rgba(0,0,0,.12)); border-left: 1px solid var(--tblr-border-color); padding: 1.25rem 1.5rem 2rem; overflow: auto; overscroll-behavior: contain; z-index: 1050; }
  .drawer .close { position: absolute; top: .7rem; right: .9rem; }
  .drawer h3 { font-size: 1rem; margin: 0 2rem .6rem 0; }
  /* flow */
  .steps { display: grid; gap: .6rem; }
  .stp { display: grid; grid-template-columns: 5rem 1fr; gap: 1rem; color: var(--tblr-secondary); }
  .stp.done, .stp.running { color: var(--tblr-body-color); }
  .stp .state { font-size: .8rem; color: var(--tblr-secondary); }
  .stp.running .state { color: var(--tblr-primary); }
  /* explore */
  .views { display: grid; grid-template-columns: 16rem 1fr; gap: 1.25rem; align-items: start; }
  .viewlist { display: flex; flex-direction: column; gap: .15rem; margin-top: .5rem; }
  .viewrow { display: flex; flex-direction: column; padding: .4rem .6rem; border-radius: var(--tblr-border-radius); color: var(--tblr-body-color); }
  .viewrow:hover { background: var(--tblr-bg-surface-secondary); text-decoration: none; }
  .viewrow.on { background: var(--tblr-active-bg, rgba(32,107,196,.08)); }
  .exc select, .exc input { max-width: 15rem; }
  .plot { min-height: 400px; margin-top: .6rem; }
  .plot .modebar { opacity: .5; }
  @media (max-width: 700px) { .views { grid-template-columns: 1fr; } }
  .form { display: flex; flex-direction: column; gap: .45rem; }
  .form label { display: grid; grid-template-columns: 6rem 1fr; gap: .5rem; align-items: center; font-size: .85rem; }
  /* reconcile */
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .table thead th { font-size: .72rem; letter-spacing: .03em; }
  tr.item { cursor: pointer; }
  tr.item:focus-visible { outline: 2px solid var(--tblr-primary); outline-offset: -2px; }
  tr.item.cur td { background: var(--tblr-active-bg, rgba(0,0,0,.03)); }
  tr.item.cur td:first-child { box-shadow: inset 3px 0 0 var(--tblr-primary); }
  tr.ev > td { padding: 1rem 1.25rem 1.25rem; background: var(--tblr-bg-surface-secondary); cursor: default; }
  .gg { position: relative; height: 8px; width: 7rem; background: var(--tblr-border-color); border-radius: 4px; }
  .gg .band { position: absolute; top: -3px; height: 14px; background: color-mix(in srgb, var(--tblr-body-color) 14%, transparent); border-radius: 2px; }
  .gg .ours { position: absolute; left: 0; top: 0; height: 8px; background: var(--tblr-primary); border-radius: 4px; }
  .gg .tick { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--tblr-body-color); }
  .gg .gap { position: absolute; top: 3px; height: 2px; background: repeating-linear-gradient(90deg, var(--tblr-red) 0 3px, transparent 3px 6px); }
  .gg.lg { width: 100%; height: 10px; margin: .35rem 0 .2rem; }
  .gg.lg .ours { height: 10px; }
  .gg.lg .band { top: -3px; height: 16px; }
  .gg.lg .tick { top: -5px; height: 20px; }
  .bar.ref { background: var(--tblr-secondary); }
  .bar.tot { background: var(--tblr-border-color-active, #bbb); }
  .card-header .card-title { white-space: nowrap; font-size: .85rem; }
  .card-header .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 1rem; }
  .table .badge { white-space: nowrap; }
  .shot { max-width: 100%; border-radius: 4px; border: 1px solid var(--tblr-border-color); }
  details.words summary { cursor: pointer; font-size: .8rem; color: var(--tblr-secondary); list-style: none; }
  details.words summary::-webkit-details-marker { display: none; }
  details.words[open] summary { margin-bottom: .4rem; }
  .table-sm > :not(caption) > * > * { padding: .35rem .6rem; }
  .btn:active { transform: scale(.98); }
  .btn-group .btn.active { background: var(--tblr-primary); color: #fff; border-color: var(--tblr-primary); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="navbar navbar-expand-md d-print-none" data-bs-theme="dark">
  <div class="container-xl">
    <a class="navbar-brand" href="#proof"><span class="fw-bold" style="letter-spacing:.08em">DATAHQ</span></a>
    <div class="navbar-nav flex-row flex-wrap me-auto">
      <a class="nav-link px-2" href="#proof" data-nav="proof">Proof</a>
      <a class="nav-link px-2" href="#rules" data-nav="rules">Rules</a>
      <a class="nav-link px-2" href="#reconcile" data-nav="reconcile">Reconcile</a>
      <a class="nav-link px-2" href="#data" data-nav="data">Dataset</a>
      <a class="nav-link px-2" href="#explore" data-nav="explore">Explore</a>
    </div>
    <div class="d-flex align-items-center gap-3">
      <input class="form-control form-control-sm" id="jump" name="jump" type="text" list="tickers" placeholder="Ticker or company…" aria-label="Jump to a company" autocomplete="off" spellcheck="false" style="width:13rem">
      <datalist id="tickers"></datalist>
      <span class="text-secondary small text-nowrap">signed as <input id="me" name="signer" type="text" class="form-control form-control-sm d-inline-block" style="width:9rem" aria-label="Your name, logged on every model or prompt change" autocomplete="name"></span>
    </div>
  </div>
</header>
<div class="page-wrapper"><div class="page-body"><div class="container-xl">
  <main id="view" tabindex="-1"><p class="msg">Loading…</p></main>
</div></div></div>
<div class="tip" id="tip" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k === 'class') el.className = v; else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
};
const int = (n) => (n == null || n === '' ? '—' : Number(n).toLocaleString('en-US'));
const usd = (n) => {
  if (n == null || n === '') return '—';
  const m = Number(n) / 1e6;
  return (m < 0 ? '−' : '') + '$' + Math.abs(m).toLocaleString('en-US', {maximumFractionDigits: Math.abs(m) >= 100 ? 0 : 1}) + 'M';
};
const day = (s) => (s ? new Date(String(s).slice(0, 10) + 'T00:00:00Z').toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'}) : '—');
const when = (s) => (s ? new Date(s).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : '—');
const compact = (n) => new Intl.NumberFormat('en', {notation: 'compact', maximumFractionDigits: 1}).format(n || 0);
const LABEL = {revenue: 'Revenue', capex: 'Capex', opex: 'Opex', cost_of_revenue: 'Cost of revenue', cost_of_revenue_part: 'Cost line', operating_income: 'Operating income'};
const XBRL = {agree: 'matches SEC data', definition_gap: 'differs from SEC data, explained by code', unresolved: 'differs from SEC data, decided by a person', not_reported: 'not reported'};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
let me = 'Kenny Geiler';
try { me = localStorage.getItem('datahq-me') || me; } catch {}
$('#me').value = me;
$('#me').addEventListener('input', (e) => { me = e.target.value; try { localStorage.setItem('datahq-me', me); } catch {} });
let NAMES = {};
api('/api/data?t=&f=none').then((d) => { NAMES = d.names; $('#tickers').replaceChildren(...Object.entries(NAMES).map(([t, n]) => h('option', {value: t}, n))); });
$('#jump').addEventListener('change', (e) => { const v = e.target.value.trim().toUpperCase(); const t = NAMES[v] ? v : Object.keys(NAMES).find((k) => NAMES[k].toUpperCase() === v); if (t) { e.target.value = ''; go(`data?t=${t}&f=capex`); } });

function table(cols, rows, {key, onRow, detail} = {}) {
  const tb = h('tbody');
  const draw = (list) => {
    tb.replaceChildren();
    for (const r of list) {
      const tr = h('tr', {class: onRow || detail ? 'click' : null, tabindex: onRow || detail ? 0 : null, role: onRow || detail ? 'button' : null, onkeydown: onRow || detail ? (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tr.click(); } } : null}, cols.map((c) => h('td', {class: [c.n && 'n', c.wide && 'wide'].filter(Boolean).join(' ') || null}, c.f ? c.f(r) : r[c.k] ?? '—')));
      tb.append(tr);
      if (onRow) tr.addEventListener('click', () => onRow(r));
      if (detail) tr.addEventListener('click', () => {
        const next = tr.nextElementSibling;
        if (next && next.classList.contains('detail')) { next.remove(); tr.classList.remove('open'); return; }
        tr.classList.add('open');
        tr.after(h('tr', {class: 'detail'}, h('td', {colspan: cols.length}, detail(r))));
      });
    }
  };
  let sort = null, dir = 1;
  const head = h('tr', {}, cols.map((c) => {
    const th = h('th', {class: [c.n && 'n', c.wide && 'wide'].filter(Boolean).join(' ') || null});
    if (c.sort === false) th.append(c.t);
    else th.append(h('button', {type: 'button', style: 'color:inherit', onclick: () => {
      dir = sort === c ? -dir : (c.n ? -1 : 1); sort = c;
      const v = c.s || ((r) => r[c.k]);
      draw([...rows].sort((a, b) => { const x = v(a), y = v(b); if (x == null || x === '') return 1; if (y == null || y === '') return -1; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * dir; }));
    }}, c.t));
    return th;
  }));
  draw(rows);
  return h('div', {class: 'card'}, h('div', {class: 'table-responsive'}, h('table', {class: 'table table-sm table-vcenter card-table table-hover'}, h('thead', {}, head), tb)));
}

const FACT = {segment_capex: 'Segment capex', segment_revenue: 'Segment revenue', ppe_category: 'PP&E by category', finance_lease_liability: 'Finance lease liabilities', purchase_commitments: 'Purchase commitments'};
const SOURCE = {mdna: '10-K MD&A', earnings_release: 'earnings release', transcript: 'call transcript', cfo_commentary: 'CFO commentary'};
const AI_CLASS = {explicit_amount: 'amount', explicit_share: 'share', qualitative: 'words only'};

function sources(v) {
  const wrap = h('div', {});
  if (v.decision) wrap.append(h('div', {class: 'src'}, h('div', {}, `${v.decision.reviewer} decided: ${v.decision.kind}`), h('div', {class: 'muted'}, v.decision.reason)));
  if (v.why) wrap.append(h('div', {class: 'src'}, h('div', {class: 'muted'}, 'The 10-K says: ', v.why.text.slice(0, 400)), h('a', {href: v.why.url, target: '_blank', rel: 'noopener'}, 'Open that passage')));
  for (const s of v.sources) {
    wrap.append(h('div', {class: 'src'},
      h('div', {}, `${LABEL[s.field] || s.field}: `, h('b', {}, s.cell), ` in row “${s.row}”, column “${s.col.replaceAll(' | ', ' ')}”`),
      h('div', {class: 'muted small'}, `10-K filed ${day(s.filed)}, table ${s.table_id}, ${s.unit || 'unit from the document'}, prompt ${s.prompt}`, s.notes ? `, ${s.notes}` : ''),
      h('div', {class: 'small' + (s.machine && !s.machine.match ? ' bad' : ' muted')}, s.machine ? (s.machine.match ? 'Confirmed on the rendered 10-K' : `Rendered 10-K shows ${s.machine.seen}`) : 'Not re-read'),
      s.machine?.img && h('img', {src: '/' + s.machine.img, alt: `Screenshot of the cited cell ${s.cell}`, loading: 'lazy'}),
      h('a', {href: s.deep, target: '_blank', rel: 'noopener', class: 'small'}, 'Open the 10-K at This Row')));
  }
  if (!v.sources.length) wrap.append(h('p', {class: 'muted'}, 'No citation.'));
  return wrap;
}

// ── Shared ──────────────────────────────────────────────────────────────────
let hqCache = null;
const hq = async (fresh) => (hqCache = !fresh && hqCache ? hqCache : await api('/api/hq'));
const pct = (x) => (x == null ? '—' : x < .001 ? '<0.1%' : `${(100 * x).toFixed(x < .1 ? 1 : 0)}%`);
const fig = (l, n, s, bad) => h('div', {class: 'fig'}, h('div', {class: 'l'}, l), h('div', {class: 'n' + (bad ? ' bad' : '')}, n), h('div', {class: 's' + (bad ? ' bad' : '')}, s));
const INDUSTRY = {hyperscaler: 'Hyperscaler', neocloud: 'Neocloud', miner_to_hpc: 'Miner to HPC', chip_seller: 'Chip design', chip_equipment: 'Chip equipment', component_supplier: 'Memory, networking, servers', datacenter_build: 'Data-center build', datacenter_landlord: 'Data-center landlord', power: 'Power producer', ai_software: 'AI software', other: 'Adopters and other'};
// ── Data-first pieces: a cell with intensity, a mini bar, year bars, a dot plot ──────────────────────────────────
// One row per year: a dark AI part inside a light whole, labelled with both.
// ── Data: the dataset as a grid, provenance one click deep ──────────────────
const FIELDS = {capex: 'Capex', revenue: 'Revenue', opex: 'Opex', segment_capex: 'Segment capex', segment_revenue: 'Segment revenue', ppe_category: 'PP&E by category', finance_lease_liability: 'Finance lease liabilities', purchase_commitments: 'Purchase commitments'};
const KINDS = {spent: 'spent', committed: 'committed', derived: 'derived', planned: 'planned'};
const ALL_KINDS = Object.keys(KINDS);
const parseQ = (s) => Object.fromEntries(new URLSearchParams(s));
const CHECK = {agree: 'agrees with XBRL', definition_gap: 'definition gap, explained', unresolved: 'differs from XBRL', no_reference: 'no tagged counterpart', not_reported: 'not reported'};

async function dataPage(view, qs) {
  const q = parseQ(qs || '');
  const [hqd, meta] = await Promise.all([hq(), api('/api/data?t=&f=')]);
  const H = hqd.health[0];
  const all = Object.keys(meta.names).sort();
  const sel = {
    t: q.t ? q.t.split(',') : all.filter((t) => (!q.role || meta.roles[t] === q.role) && (!q.ind || meta.industries[t] === q.ind)),
    f: (q.f || 'capex').split(','), k: q.k ? q.k.split(',') : ALL_KINDS, y: q.y ? q.y.split(',') : null, wide: !!q.wide, eval: !!q.eval};
  const setQ = () => { const p = new URLSearchParams(); p.set('t', sel.t.join(',')); p.set('f', sel.f.join(',')); if (sel.y) p.set('y', sel.y.join(',')); if (sel.k.length < ALL_KINDS.length) p.set('k', sel.k.join(',')); if (sel.wide) p.set('wide', 1); if (sel.eval) p.set('eval', 1); location.hash = 'data?' + p.toString(); };

  // one line of controls: field, companies (a group or a custom list), kind, years hidden unless set
  const GROUPS = [['all', 'All companies'], ['buyer', 'Buyers'], ['seller', 'Sellers'], ...Object.keys(INDUSTRY).map((k) => ['ind:' + k, INDUSTRY[k]]), ['custom', 'Custom…']];

  root.querySelectorAll('section:not(.card):not(.figs):not(.hrow)').forEach((el) => { if (el.querySelector(':scope > .sechead, :scope > h2')) el.classList.add('card'); });
  root.querySelectorAll('section.card > h2:first-child').forEach((el) => { const head = h('div', {class: 'sechead'}); el.replaceWith(head); head.append(el); });
  root.querySelectorAll('section.card > .card').forEach((el) => { el.classList.remove('card'); el.classList.add('card-table-wrap'); });
}
async function route() {
  const raw = location.hash.slice(1) || 'proof';
  const [path, qs] = raw.split('?');
  const [page, arg] = path.split('/');
  const tab = {company: 'data', views: 'explore', flow: 'proof', status: 'proof', golden: 'proof', releases: 'proof', agents: 'rules', attribution: 'rules', run: 'proof'}[page] || page;
  document.querySelectorAll('header [data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === tab));
  const view = $('#view');
  view.replaceChildren(h('h1', {class: 'sr'}, `DATAHQ, ${({proof: 'Proof', rules: 'Rules', reconcile: 'Reconcile', data: 'Dataset', company: 'Company', explore: 'Explore'})[page] || 'Data'}`));
  try {
    if (page === 'proof' && arg) await trailPage(view, arg);
    else if (page === 'proof') await proofPage(view);
    else if (page === 'rules') await rulesPage(view);
    else if (page === 'company') await dataPage(view, `t=${arg || ''}&f=capex`);
    else if (page === 'reconcile') await reconcilePage(view, qs);
    else if (page === 'views' || page === 'explore') await explorePage(view, arg, qs);
    else if (page === 'data' || page === 'insights') await dataPage(view, qs);
    else await proofPage(view);
  } catch (e) {
    view.replaceChildren(h('p', {class: 'msg bad'}, e.message));
  }
  skin(view);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
