<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<title>Kenny's Data Emporium</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.3.2/dist/css/tabler.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.34.0/plotly.min.js" defer></script>
<style>
  /* Kenny's Data Emporium on Tabler. The kit carries the look; this block maps the app's own layout classes onto the kit's tokens. */
  :root { --bg: var(--tblr-bg-surface); --fg: var(--tblr-body-color); --muted: var(--tblr-secondary); --faint: var(--tblr-border-color); --accent: var(--tblr-primary); --bad: var(--tblr-red); --bar: var(--tblr-bg-surface-secondary); --row: var(--tblr-active-bg, rgba(0,0,0,.03));
    --font: var(--tblr-font-sans-serif); --mono: var(--tblr-font-monospace); --tblr-font-sans-serif: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: -999px; top: .5rem; background: var(--tblr-bg-surface); padding: .4rem .7rem; z-index: 1100; }
  .skip:focus { left: .5rem; }
  body { font-size: .875rem; }
  main { padding-top: 1.25rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
  h2 { font-size: .95rem; font-weight: 600; margin: 0 0 .5rem; }
  h3 { font-size: .9rem; font-weight: 600; }
  p { margin: 0; }
  .muted { color: var(--tblr-secondary); }
  .bad { color: var(--tblr-red); }
  td > span.bad, td > span.muted { white-space: nowrap; }
  .small { font-size: .8rem; }
  .mono { font-family: var(--tblr-font-monospace); font-size: .8rem; }
  .brk { white-space: pre-wrap; word-break: break-word; }
  .raw td, .raw th { white-space: nowrap; max-width: 22rem; overflow: hidden; text-overflow: ellipsis; font-size: .8rem; }
  .raw td.n { font-family: var(--tblr-font-monospace); font-weight: 400; }
  .raw tr.detail td { white-space: normal; max-width: none; }
  .num, td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.n { font-weight: 500; }
  td.n .note { font-weight: 400; }
  /* layout */
  .stack { display: grid; gap: 1.25rem; }
  .stack > * { min-width: 0; }
  .hrow { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
  .pagehead { display: grid; gap: .3rem; margin-bottom: .25rem; }
  /* figures: stat cards */
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); gap: .75rem; }
  .fig { background: var(--tblr-bg-surface); border: 1px solid var(--tblr-border-color); border-radius: var(--tblr-border-radius); padding: .6rem .85rem; }
  .fig .l { color: var(--tblr-secondary); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .fig .n { font-size: 1.35rem; line-height: 1.2; font-weight: 600; margin: .1rem 0; }
  .fig .s { color: var(--tblr-secondary); font-size: .78rem; }
  .fig .n.bad, .fig .s.bad { color: var(--tblr-red); }
  /* bars */
  .bar { display: inline-block; height: 8px; background: var(--tblr-primary); border-radius: 2px; margin-right: .4rem; vertical-align: middle; }
  /* tables the pages build by hand (grid, heat) */
  .scroll { overflow-x: auto; }
  table.grid, table.heat { width: 100%; }
  table.grid th, table.heat th { position: sticky; top: 0; z-index: 2; background: var(--tblr-bg-surface); }
  table.grid th:first-child, table.grid td:first-child, table.heat th:first-child, table.heat td:first-child { position: sticky; left: 0; background: var(--tblr-bg-surface); z-index: 1; }
  table.grid td.cell, table.heat td.cell { cursor: pointer; }
  table.grid td.cell:hover, table.heat td.cell:hover { color: var(--tblr-primary); }
  table.grid .note { font-size: .72rem; color: var(--tblr-secondary); white-space: normal; max-width: 9rem; margin-left: auto; }
  table.heat td.c { padding-inline: .5rem; background: color-mix(in srgb, var(--tblr-primary) calc(var(--i, 0) * 28%), transparent); }
  table.heat td.c .note { font-size: .72rem; color: var(--tblr-secondary); }
  table.heat td.moved { box-shadow: inset 3px 0 0 var(--tblr-primary); }
  tr.click { cursor: pointer; }
  tr.open td { color: var(--tblr-primary); }
  .detail td { padding: .25rem .75rem 1.25rem !important; }
  .mk { display: inline-block; width: 1.1em; text-align: center; margin-left: .25rem; font-weight: 600; }
  .mk.t { color: var(--tblr-green); }
  .mk.u { color: var(--tblr-secondary); opacity: .6; }
  .mk.x { color: var(--tblr-red); }
  .mk.d { color: var(--tblr-orange, #f76707); }
  .mk.o { color: var(--tblr-orange, #f76707); }
  /* evidence: extracted | filing, or filing A | filing B */
  .ev-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem; align-items: start; margin-top: 1rem; }
  .ev-grid:has(> section:first-child .ev-kv) { grid-template-columns: minmax(16rem, 22rem) minmax(0, 1fr); }
  @media (max-width: 900px) { .ev-grid, .ev-grid:has(> section:first-child .ev-kv) { grid-template-columns: minmax(0, 1fr); } }
  .ev-wide { width: min(calc(100vw - 64px), 112rem); position: relative; left: 50%; transform: translateX(-50%); }  /* two crops side by side: wider than the page column */
  .ev-side { display: grid; gap: .6rem; }
  .ev-value { font-size: 1.6rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .ev-kv { display: grid; gap: .05rem; }
  .ev-crop { display: block; width: 100%; max-width: 64rem; height: auto; border-radius: 4px; box-shadow: 0 0 0 1px var(--tblr-border-color); background: #fff; }
  /* the trail: fixed columns, the value on one line, the cited cells' crops in the row */
  table.trail { table-layout: fixed; width: 100%; }
  table.trail col.c-item { width: 22%; } table.trail col.c-value { width: 7.5rem; } table.trail col.c-source { width: 42%; } table.trail col.c-verify { width: auto; }
  table.trail-quote col.c-item { width: 20%; } table.trail-quote col.c-value { width: 34%; } table.trail-quote col.c-source { width: 22%; }
  table.trail-quote td.num { white-space: normal; text-align: left; }
  table.trail td { vertical-align: top; overflow-wrap: anywhere; }
  table.trail td.num { font-weight: 500; }
  .cites { display: grid; grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr)); gap: .6rem .9rem; }
  .cite { display: grid; gap: .25rem; min-width: 0; }
  .cites > .cite-line { grid-column: 1 / -1; }
  .cite-line { font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tblr-secondary); }
  .crop-thumb { display: flex; align-items: center; position: relative; overflow: hidden; height: 7.5rem; padding: 0; border: 0; background: #fff; cursor: zoom-in; border-radius: 3px; box-shadow: 0 0 0 1px var(--tblr-border-color); width: 100%; }
  .crop-thumb img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; }
  .crop-thumb:hover, .crop-thumb:focus-visible { box-shadow: 0 0 0 2px var(--tblr-primary); outline: none; }
  .crop-none { min-height: 1.25rem; }
  details.why > summary { list-style: none; cursor: pointer; }
  details.why > summary::-webkit-details-marker { display: none; }
  details.why > summary > div::after { content: " ›"; color: var(--tblr-secondary); }
  details.why[open] > summary > div::after { content: " ⌄"; }
  .cropbox { position: fixed; inset: 0; z-index: 1080; background: rgba(15, 18, 24, .72); display: grid; place-items: center; padding: 2rem; }
  .cropbox-fig { margin: 0; background: var(--tblr-bg-surface); border-radius: 6px; padding: 1rem 1.25rem; max-width: min(96vw, 80rem); max-height: 92vh; overflow: auto; }
  .cropbox-fig img { display: block; max-width: 100%; height: auto; background: #fff; }
  .src { display: grid; gap: .3rem; margin-bottom: .9rem; max-width: 60rem; }
  .src img { max-width: min(100%, 40rem); border-radius: 4px; margin-top: .3rem; border: 1px solid var(--tblr-border-color); }
  pre.raw { white-space: pre-wrap; word-break: break-word; font: .78rem/1.5 var(--tblr-font-monospace); max-height: 30rem; overflow: auto; margin: .5rem 0 0; background: var(--tblr-bg-surface-secondary); padding: .6rem .75rem; border-radius: var(--tblr-border-radius); }
  .msg { color: var(--tblr-secondary); padding: 2rem 0; }
  ul.plain { margin: .2rem 0 0; padding-left: 1.1rem; }
  ul.plain li { margin: .15rem 0; }
  .picks { display: flex; flex-wrap: wrap; gap: .25rem .8rem; font-size: .84rem; }
  .picks label { white-space: nowrap; cursor: pointer; }
  .controls { display: grid; gap: 1.1rem; }
  /* the drawer: the kit's offcanvas, opened by script */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(100%, 32rem); background: var(--tblr-bg-surface); box-shadow: var(--tblr-shadow-dropdown, -8px 0 30px rgba(0,0,0,.12)); border-left: 1px solid var(--tblr-border-color); padding: 1.25rem 1.5rem 2rem; overflow: auto; overscroll-behavior: contain; z-index: 1050; }
  .drawer .close { position: absolute; top: .7rem; right: .9rem; }
  .drawer h3 { font-size: 1rem; margin: 0 2rem .6rem 0; }
  /* explore */
  .views { display: grid; grid-template-columns: 16rem 1fr; gap: 1.25rem; align-items: start; }
  .viewlist { display: flex; flex-direction: column; gap: .15rem; margin-top: .5rem; }
  .viewrow { display: flex; flex-direction: column; padding: .4rem .6rem; border-radius: var(--tblr-border-radius); color: var(--tblr-body-color); }
  .viewrow:hover { background: var(--tblr-bg-surface-secondary); text-decoration: none; }
  .viewrow.on { background: var(--tblr-active-bg, rgba(32,107,196,.08)); }
  .exc select, .exc input { max-width: 15rem; }
  .plot { min-height: 400px; margin-top: .6rem; }
  .plot .modebar { opacity: .5; }
  @media (max-width: 700px) { .views { grid-template-columns: 1fr; } }
  .form { display: flex; flex-direction: column; gap: .45rem; }
  .form label { display: grid; grid-template-columns: 6rem 1fr; gap: .5rem; align-items: center; font-size: .85rem; }
  /* reconcile */
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .table thead th { font-size: .72rem; letter-spacing: .03em; }
  tr.item { cursor: pointer; }
  tr.item:focus-visible { outline: 2px solid var(--tblr-primary); outline-offset: -2px; }
  tr.item.cur td { background: var(--tblr-active-bg, rgba(0,0,0,.03)); }
  tr.item.cur td:first-child { box-shadow: inset 3px 0 0 var(--tblr-primary); }
  tr.ev > td { padding: 1rem 1.25rem 1.25rem; background: var(--tblr-bg-surface-secondary); cursor: default; }
  .gg { position: relative; height: 8px; width: 7rem; background: var(--tblr-border-color); border-radius: 4px; }
  .gg .band { position: absolute; top: -3px; height: 14px; background: color-mix(in srgb, var(--tblr-body-color) 14%, transparent); border-radius: 2px; }
  .gg .ours { position: absolute; left: 0; top: 0; height: 8px; background: var(--tblr-primary); border-radius: 4px; }
  .gg .tick { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--tblr-body-color); }
  .gg .gap { position: absolute; top: 3px; height: 2px; background: repeating-linear-gradient(90deg, var(--tblr-red) 0 3px, transparent 3px 6px); }
  .gg.lg { width: 100%; height: 10px; margin: .35rem 0 .2rem; }
  .gg.lg .ours { height: 10px; }
  .gg.lg .band { top: -3px; height: 16px; }
  .gg.lg .tick { top: -5px; height: 20px; }
  .bar.ref { background: var(--tblr-secondary); }
  .card-header .card-title { white-space: nowrap; font-size: .85rem; }
  .card-header .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 1rem; }
  .table .badge { white-space: nowrap; }
  .shot { max-width: 100%; border-radius: 4px; border: 1px solid var(--tblr-border-color); }
  details.words summary { cursor: pointer; font-size: .8rem; color: var(--tblr-secondary); list-style: none; }
  details.words summary::-webkit-details-marker { display: none; }
  details.words[open] summary { margin-bottom: .4rem; }
  .table-sm > :not(caption) > * > * { padding: .35rem .6rem; }
  .btn:active { transform: scale(.98); }
  .btn-group .btn.active { background: var(--tblr-primary); color: #fff; border-color: var(--tblr-primary); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="navbar navbar-expand-md d-print-none" data-bs-theme="dark">
  <div class="container-xl">
    <a class="navbar-brand" href="#proof"><span class="fw-bold">Kenny's Data Emporium</span></a>
    <div class="navbar-nav flex-row flex-nowrap me-auto">
      <a class="nav-link px-2" href="#proof" data-nav="proof">Proof</a>
      <a class="nav-link px-2" href="#rules" data-nav="rules">Rules</a>
      <a class="nav-link px-2" href="#reconcile" data-nav="reconcile">Reconcile</a>
      <a class="nav-link px-2" href="#data" data-nav="data">Dataset</a>
      <a class="nav-link px-2" href="#explore" data-nav="explore">Explore</a>
      <a class="nav-link px-2" href="#release" data-nav="release">Release</a>
      <a class="nav-link px-2" href="#gaps" data-nav="gaps">Known gaps</a>
    </div>
    <div class="d-flex align-items-center gap-3">
      <input class="form-control form-control-sm" id="jump" name="jump" type="text" list="tickers" placeholder="Ticker or company…" aria-label="Jump to a company" autocomplete="off" spellcheck="false" style="width:10rem">
      <datalist id="tickers"></datalist>
      <span class="text-secondary small text-nowrap">Signer <input id="me" name="signer" type="text" class="form-control form-control-sm d-inline-block" style="width:9rem" aria-label="Signer name" autocomplete="name"></span>
    </div>
  </div>
</header>
<div class="page-wrapper"><div class="page-body"><div class="container-xl">
  <main id="view" tabindex="-1"><p class="msg">Loading…</p></main>
</div></div></div>

<script src="/pages/_states.js"></script>
<script src="/pages/_shared.js"></script>
<script src="/pages/proof.js"></script>
<script src="/pages/trail.js"></script>
<script src="/pages/rules.js"></script>
<script src="/pages/reconcile.js"></script>
<script src="/pages/data.js"></script>
<script src="/pages/explore.js"></script>
<script src="/pages/release.js"></script>
<script src="/pages/gaps.js"></script>
<script src="/pages/evidence.js"></script>
<script src="/pages/_router.js"></script>
</body>
</html>
