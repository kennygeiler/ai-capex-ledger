id: unit_from_document
severity: warn
description: The unit (thousands, millions) was not stated with the table and was taken from elsewhere in the same
  filing.
rationale: 'Decision 2026-10-27 (Kenny): allowed, but a person should see it, because a wrong unit is a 1,000× error.'
owner: Kenny Geiler
check: unit_from_document
title: The table didn't say whether it was in thousands or millions.
plain: The AI found the unit written elsewhere in the same report and used that. Usually fine, but a wrong unit
  makes a number 1,000 times too big or too small.
action: Open the filing and confirm the unit (look for "in thousands" or "in millions" near the table). If it's
  right, accept.
