id: row_label_switch
severity: warn
description: The row a field is read from has the same label in every filing for a company.
rationale: Agents choose the row. If the choice changes between filings, either the company renamed the line or
  an agent picked a different one, and the series may not be comparable.
owner: Kenny Geiler
check: row_label_switch
title: The line's name changed between reports.
plain: The AI read this item from lines with different names in different reports. Usually the company just renamed
  the line (for example "Operating income" became "Operating loss"), but it could mean the AI picked a different
  line.
action: Look at the names listed. If they clearly mean the same thing, accept, saying the company renamed the line.
  If one is a different line, tell the data owner.
