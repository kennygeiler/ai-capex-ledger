id: statement_tie
severity: block
description: 'In each income statement: revenue − cost of revenue − total operating expenses = operating income,
  in every column.'
rationale: If the statement doesn't tie, we parsed the wrong table or misread a row, whatever the agent did.
owner: Kenny Geiler
check: statement_tie
params:
  labels:
    revenue: ^(total )?(net )?(revenues?|sales)$|^total net sales|^total revenues?
    cost_of_revenue: ^(total )?cost of (revenues?|sales)
    total_opex: ^total operating expenses|^total costs and expenses
    operating_income: ^operating income|^income from operations|^operating (loss|\(loss\) income|income \(loss\))
  tolerance_cells: 1
title: The income statement doesn't add up.
plain: Revenue minus costs should equal operating income. In this table it doesn't, which usually means the wrong
  table or row was used.
action: Tell the data owner. This usually needs a fix to the system, not a decision.
