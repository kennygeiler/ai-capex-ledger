id: segment_basis_mixed
severity: warn
description: A segment series (revenue or capex by segment) takes every release year from filings on the same side of
  the company's latest re-segmentation. A re-segmentation is read from the filings only - a later 10-K prints segment
  names the earlier one did not (or drops some), or restates two or more segments of a year while their total holds
  (amounts moved between segments). A single figure printed differently with the same segments and a changed total is a
  correction, not a re-segmentation, and does not fire.
rationale: The newest filing wins for each year, but a re-segmenting 10-K restates only the comparative years it
  prints. An older year stays on the old segments while the later years use the new ones, so the series compares two
  definitions (Microsoft's FY2025 10-K moved amounts between its three segments for FY2023 and FY2024, the totals
  unchanged; FY2022 is only in older 10-Ks). Code cannot pick a basis; the item goes to Reconcile for a person.
owner: Kenny Geiler
check: segment_basis_mixed
params:
  fields: [segment_revenue, segment_capex]
title: A segment series mixes segment definitions.
plain: A later report moved amounts between segments, or renamed, added or dropped them. Later years use the new
  segments; this year is only printed on the old ones, so it does not compare with the years after it.
action: Decide whether this year ships on the old segments (explain, saying so) or is left out of the series. No value is
  changed by code.
