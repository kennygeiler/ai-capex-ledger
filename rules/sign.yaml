id: sign
severity: block
description: Revenue, cost of revenue and capex are never negative.
rationale: A negative capex means a sign error or the wrong line (proceeds instead of purchases). Honeywell and
  Intuit showed this in the XBRL reference.
owner: Kenny Geiler
check: sign
params:
  non_negative:
  - revenue
  - cost_of_revenue
  - capex
title: A number is negative that should never be.
plain: Revenue, cost and equipment spending can't be below zero. Usually a minus sign or the wrong line (money coming
  in instead of going out).
action: Check the filing. Override with the correct number, or reject.
