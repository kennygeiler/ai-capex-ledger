id: definition_note
severity: info
description: The line read for a field says it covers more (or less) than the field's definition.
rationale: Comparing companies requires the same definition. NVDA's capex line includes intangible assets; most
  companies report property and equipment only.
owner: Kenny Geiler
check: definition_note
params:
  patterns:
    capex: intangible|software|including|and other
    revenue: net of|excluding
    cost_of_revenue: exclusive of|excluding
