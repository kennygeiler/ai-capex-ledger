id: definition_note
severity: info
description: The line read for a field says it covers more (or less) than the field's definition.
rationale: Comparing companies requires the same definition. NVDA's capex line includes intangible assets; IREN's is
  net of computer-hardware prepayments; most companies report property and equipment only. XBRL usually tags the
  same line, so agreement with it does not show the definition matches.
owner: Kenny Geiler
check: definition_note
params:
  patterns:
    capex: intangible|software|including|and other|net of|excluding|deposit|prepayment
    revenue: net of|excluding
    cost_of_revenue: exclusive of|excluding
title: The company's line includes a bit more than our definition.
plain: Our definition of the field is narrower than what this company reports. For example, its equipment-spending
  line also includes software or intangible assets. The number is used as reported.
action: Nothing to decide. Remember it when comparing this company with others.
