id: coverage
severity: warn
description: Every released field has a value (or a stated reason) for every fiscal year in the window. A year after the newest 10-K is not missing until that year's 10-K is due (90 days after the year ends).
rationale: A gap must carry a reason. It is never silently left out or filled.
owner: Kenny Geiler
check: coverage
params:
  filing_days: 90  # the fields are config.RELEASE_FIELDS, the list the release checklist's completeness line reads (T81)
title: A number is missing.
plain: There is no value for this fiscal year. Usually the company wasn't public yet, or hasn't filed that year's
  10-K yet.
action: If the company wasn't public yet or the year isn't filed yet, accept with that reason. Otherwise tell the
  data owner.
