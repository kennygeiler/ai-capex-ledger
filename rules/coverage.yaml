id: coverage
severity: warn
description: Every released field has a value (or a stated reason) for every fiscal year in the window.
rationale: A gap must carry a reason. It is never silently left out or filled.
owner: Kenny Geiler
check: coverage
params:
  fields:
  - revenue
  - capex
  - opex
title: A number is missing.
plain: There is no value for this fiscal year. Usually the company wasn't public yet, or hasn't filed that year's
  10-K yet.
action: If the company wasn't public yet or the year isn't filed yet, accept with that reason. Otherwise tell the
  data owner.
