id: quarters_sum_to_ytd
severity: block
description: Three-month cells add up to the filing's own six- and nine-month cells.
rationale: Both sides are read from filings, so this independently catches a misread cell or a wrong column. A quarters-sum-to-year
  check would be circular because Q4 is derived from the year (found in the 2026-10-28 QA pass).
owner: Kenny Geiler
check: quarters_sum_to_ytd
title: The quarters don't add up to the company's own year-to-date total.
plain: Companies also report running totals, such as the first 6 or 9 months. Here, adding up the quarters gives
  a different total than the company's own running total. Usually the company later rewrote its past numbers (a
  restatement, for example after selling part of the business), so older and newer reports disagree. Less often,
  a number was misread.
action: 'Open both reports. If the newer one says the past was restated (look for "recast", "restated" or "discontinued
  operations"), accept with that reason. If not, a number was probably misread: tell the data owner.'
