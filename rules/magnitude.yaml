id: magnitude
severity: block
description: Cost of revenue does not exceed revenue, and operating income does not exceed gross profit.
rationale: Basic accounting identities; breaking one means a misread.
owner: Kenny Geiler
check: magnitude
title: A number is bigger than should be possible.
plain: For example, operating income above gross profit. That's impossible unless the company booked a one-time
  gain inside operating expenses.
action: Look in the filing for a gain or one-time item in operating expenses. If you find one, accept with that
  reason. If not, tell the data owner.
