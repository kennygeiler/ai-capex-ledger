# Reference set for the AI attribution: what the companies themselves, or an independent source, said AI's part of
# capex was. Each entry names its source, quotes it, and says what the figure measures, because none of these is
# "AI capex" in exactly the ledger's sense: a server share includes CPUs; a "vast majority" is a floor, not a number.
# `ledger eval` scores every attribution row against these. Add an entry when you find a sourced figure; never one
# from memory. relation: eq (the figure), ge (at least), le (at most). measure: share of capex, or amount in USD.

- ticker: GOOGL
  period: FY2025
  field: capex
  measure: share
  relation: eq
  value: 0.60
  basis: Servers' share of 2025 capital expenditures (the rest data centers and networking), as stated by the CFO on the Q4 2025 call. Servers include CPUs, not only AI accelerators.
  source:
    kind: company_statement
    url: https://nasdaq.com/articles/alphabet-spends-about-60-cents-every-technical-infrastructure-dollar-servers-nvidias
    quote: "60 per cent of Alphabet's capex in 2025 was spent on servers"
    date: 2026-02-05
  by: Kenny Geiler
  at: 2026-10-29

- ticker: GOOGL
  period: FY2024
  field: capex
  measure: share
  relation: ge
  value: 0.90
  basis: Share of 2024 capex going to technical infrastructure (servers, data centers, networking), a planning statement on the Q4 2023 call. Wider than servers; a floor on the infrastructure share, not on AI.
  source:
    kind: company_statement
    url: https://accelerationeconomy.com/?p=64061
    quote: "at least 90% of 2024 spending would focus on technical infrastructure"
    date: 2024-01-30
  by: Kenny Geiler
  at: 2026-10-29

- ticker: MSFT
  period: FY2025
  field: capex
  measure: share
  relation: le
  value: 0.50
  basis: Short-lived assets (servers, CPUs and GPUs) were at most about half of cloud and AI spend through fiscal 2025; the CFO said "roughly half" long-lived in Q1 and "more than half" long-lived in Q2 and Q4. So the server share of the year is at most about 0.5.
  source:
    kind: company_statement
    url: https://itpro.com/business/business-strategy/microsoft-promises-more-ai-spending-despite-cloud-cost-stumble
    quote: "more than half of cloud and AI-related spending at the firm was directed toward long-lived assets ... the remaining spend was primarily for servers, both CPUs and GPUs"
    date: 2025-01-29
  by: Kenny Geiler
  at: 2026-10-29

- ticker: AMZN
  period: FY2025
  field: capex
  measure: share
  relation: ge
  value: 0.50
  basis: The CEO said the vast majority of 2025 capex is AI for AWS; a floor of half on the AI share of total capex, which includes fulfillment and transportation.
  source:
    kind: company_statement
    url: https://www.rcrwireless.com/20250207/business/amazon-100-billion-ai-infrastructure-spend-2025
    quote: "The vast majority of that capex spend is on AI for AWS"
    date: 2025-02-06
  by: Kenny Geiler
  at: 2026-10-29

- ticker: TSLA
  period: FY2024
  field: capex
  measure: amount
  relation: ge
  value: 5000000000
  basis: AI-related capex including infrastructure, as stated by the CFO on the Q4 2024 call; the wording leaves open whether it is the year or cumulative, so a floor.
  source:
    kind: company_statement
    url: https://www.tomshardware.com/tech-industry/artificial-intelligence/elon-musk-spent-roughly-usd10-billion-on-ai-training-hardware-in-2024
    quote: "total AI-related capex, including infrastructure, is now more than $5 billion"
    date: 2025-01-29
  by: Kenny Geiler
  at: 2026-10-29

- ticker: ORCL
  period: FY2026
  field: capex
  measure: share
  relation: ge
  value: 0.50
  basis: The vast majority of fiscal 2026 capex is revenue-generating data center equipment, per the company's plan; a floor of half on the data-center share.
  source:
    kind: company_statement
    url: https://datacentremagazine.com/news/oracles-data-centre-strategy-cloud-ai-and-more-capacity
    quote: "vast majority of it dedicated to revenue-generating data center equipment"
    date: 2025-09-10
  by: Kenny Geiler
  at: 2026-10-29
