<style>

    --agent: #4b93ea; --xbrl: #f4f4f5; --ok: #4ade80; --ok-bg: #14532d55; --bad: #f87171; --bad-bg: #7f1d1d55; --hl: #a16207; --hl-ink: #fff; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 80px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 36px 0 10px; }
.sub { color: var(--muted); max-width: 820px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0 4px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tile .n { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--muted); font-size: 12px; }
.tile.good .n { color: var(--ok); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px; }
.chart { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 6px; }
.chart h3 { font-size: 13px; margin: 0; display: flex; justify-content: space-between; }
.chart h3 span { color: var(--muted); font-weight: 400; }
.chart svg { width: 100%; height: 150px; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--sans); }
.legend { display: flex; gap: 16px; color: var(--muted); font-size: 12px; margin: 8px 0 0; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
.ring { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--xbrl); vertical-align: -1px; margin-right: 5px; }
.bar { fill: var(--agent); }
.bar.bad { fill: var(--bad); }
.mark { fill: none; stroke: var(--xbrl); stroke-width: 1.6; }

.grid { stroke: var(--line); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 10px; }

.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }

.vals tr.main:hover td { background: var(--soft); }

.abbr { display: none; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }

.pill.bad { background: var(--bad-bg); color: var(--bad); }

.detail td { background: var(--bg); padding: 16px 18px 20px; }

.tbl th, .tbl td { padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }

.tbl th:first-child, .tbl td:first-child { text-align: left; white-space: normal; min-width: 220px; }
.tbl td { text-align: right; font-family: var(--mono); }
.tbl td:first-child { font-family: var(--sans); }
.tbl tr.cited td { background: color-mix(in oklab, var(--hl) 35%, transparent); }
.tbl td.cell { background: var(--hl); color: var(--hl-ink); font-weight: 700; outline: 2px solid var(--ink); outline-offset: -2px; }
.check { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.check input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--ok); }
.note { width: 100%; min-width: 120px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--card); color: var(--ink); font: inherit; font-size: 12px; }
.tip { position: fixed; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 8px 24px #0002; opacity: 0; transition: opacity .1s; z-index: 10; }

.howto { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-top: 16px; font-size: 13px; }

.foot { color: var(--muted); font-size: 12px; margin-top: 24px; }

.qi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 13px; overflow-wrap: anywhere; }

  return `<div class="tiles">
    <div class="tile"><div class="n">${c.filings}</div><div class="l">filings read by agents</div></div>
    <div class="tile"><div class="n">${c.extractions}</div><div class="l">cells cited (table, row, column, text)</div></div>
    <div class="tile"><div class="n">${c.values}</div><div class="l">quarterly values</div></div>
    <div class="tile ${c.agree === c.values ? "good" : ""}"><div class="n">${c.agree}/${c.values}</div><div class="l">agree with XBRL (SEC answer key)</div></div>
    <div class="tile"><div class="n">${c.open_exceptions}</div><div class="l">open exceptions (block or warn) · ${c.info_notes} info note${c.info_notes === 1 ? "" : "s"}</div></div>
    <div class="tile ${done === c.values ? "good" : ""}"><div class="n" id="done-n">${done}/${c.values}</div><div class="l">hand-checked by you</div></div>
  </div>`;
}

function chart(field) {
  const vs = D.quarters.map((q) => D.values.find((v) => v.ticker === state.company && v.field === field && v.cal_q === q));
  const all = vs.flatMap((v) => v ? [v.value, v.ref] : []).filter((x) => x != null);
  const hi = Math.max(...all, 1), lo = Math.min(0, ...all);
  const W = 300, H = 150, L = 4, B = 18, T = 8, bw = (W - L) / vs.length;
  const y = (v) => T + (H - B - T) * (1 - (v - lo) / (hi - lo || 1));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(D.field_label[field])}: agent vs XBRL by quarter">`;
  [0.5, 1].forEach((f) => s += `<line class="grid" x1="0" x2="${W}" y1="${y(hi * f)}" y2="${y(hi * f)}"/><text x="2" y="${y(hi * f) - 3}">${short(hi * f)}</text>`);
  vs.forEach((v, i) => {
    const x = L + i * bw, w = bw * 0.58;
    if (v) {
      const bad = v.label === "unresolved";
      s += `<rect class="bar ${bad ? "bad" : ""}" x="${x + (bw - w) / 2}" y="${Math.min(y(v.value), y(0))}" width="${w}" height="${Math.max(1, Math.abs(y(v.value) - y(0)))}" rx="2"/>`;
      if (v.ref != null) s += `<circle class="mark" cx="${x + bw / 2}" cy="${y(v.ref)}" r="4"/>`;
      s += `<rect class="hit" data-k="${key(v)}" x="${x}" y="0" width="${bw}" height="${H}"/>`;
    }
    if (i === 0 || i === vs.length - 1 || i % 2 === 1) s += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${qLabel(D.quarters[i])}</text>`;
  });
  const agree = vs.filter((v) => v && v.label === "agree").length;
  return `<div class="chart"><h3>${esc(D.field_label[field])} <span>${agree}/${vs.filter(Boolean).length} agree</span></h3>${s}</svg></div>`;
}

function formula(v) {
  const s = v.sources, sum = (a) => a.reduce((x, y) => x + y.value, 0);
  const term = (x) => `${usd(x.value)} <span class="eq">(${x.days > 300 ? "12" : Math.round(x.days / 30.4)} mo to ${x.end})</span>`;
  let calc, body;
  if (s.length === 1) { calc = s[0].value; body = `${usd(v.value)} <span class="eq">=</span> ${esc(s[0].cell)} × ${s[0].scale.toLocaleString("en-US")}`; }
  else { calc = s[0].value - sum(s.slice(1)); body = `${usd(v.value)} <span class="eq">=</span> ${term(s[0])} ${s.slice(1).map((x) => `<span class="eq">−</span> ${term(x)}`).join(" ")}`; }
  const ok = calc === v.value;
  return `<div class="formula">${body} ${ok ? `<span class="ok">✓ adds up</span>` : `<span style="color:var(--bad)">✗ arithmetic gives ${usd(calc)}</span>`}</div>`;
}

function miniTable(src) {
  const t = D.tables[src.table];
  if (!t) return "";
  const ci = t.columns.indexOf(src.col);
  const head = `<tr><th>${esc(t.unit || "")}</th>${t.columns.map((c, i) => `<th${i === ci ? ' style="color:var(--ink)"' : ""}>${esc(c)}</th>`).join("")}</tr>`;
  const body = t.rows.map((r) => {
    const cited = r.l === src.row;
    const cells = t.columns.map((_, i) => {
      const c = r.c.find((x) => x[0] === i);
      return `<td class="${cited && i === ci ? "cell" : ""}">${c ? esc(c[1]) : ""}</td>`;
    }).join("");
    return `<tr class="${cited ? "cited" : ""}"${cited ? ' data-cited="1"' : ""}><td>${esc(r.l)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="tbl"><table>${head}${body}</table></div>`;
}

function detail(v) {
  const srcs = v.sources.map((s) => `<div class="src">
      <div class="meta"><span><b>${s.form}</b> for the period ended <b>${s.doc_period}</b>, filed ${s.filed}</span><span>accession ${s.accession}</span><span>prompt ${s.prompt}, confidence ${s.confidence}</span></div>
      <div class="cite">Table <code>${s.table_id}</code> · row <code>${esc(s.row)}</code> · column <code>${esc(s.col)}</code> · cell <code>${esc(s.cell)}</code> × ${esc(s.unit)}${s.unit_source !== "table" ? ` <span class="pill na">unit from ${s.unit_source}</span>` : ""}
        → <b>${usd(s.value)}</b> for ${s.start} to ${s.end}. <a href="${esc(s.deep)}" target="_blank" rel="noopener">Open the filing at this row ↗</a></div>
      ${s.notes ? `<div class="cite" style="color:var(--muted)">Agent note: ${esc(s.notes)}</div>` : ""}
      ${miniTable(s)}
    </div>`).join("");
  return `<div style="font-size:13px;margin-bottom:8px"><b>${esc(D.method_label[v.method] || v.method)}.</b> XBRL (SEC answer key): ${usd(v.ref)} from <code>${esc(v.ref_concept || "–")}</code>, ${v.ref_accession || ""}. Difference ${v.ref == null ? "–" : usd(v.value - v.ref)}.</div>
    ${formula(v)}<div class="sources">${srcs}</div>`;
}

function rows() {
  const order = (v) => D.fields.indexOf(v.field) * 100 + D.quarters.indexOf(v.cal_q);
  const list = [...D.values].sort((a, b) => order(a) - order(b)).filter((v) => v.ticker === state.company && (state.field === "all" || v.field === state.field)
    && (state.show === "all" || (state.show === "todo" ? !checks[key(v)]?.verified : v.label !== "agree")));
  return list.map((v) => {
    const k = key(v), c = checks[k] || {}, open = state.open.has(k);
    const pill = v.label === "agree" ? `<span class="pill ok" title="agrees with XBRL"><span class="full">agree</span><span class="abbr">✓</span></span>` : v.label === "no_reference" ? `<span class="pill na">no XBRL</span>` : `<span class="pill bad">${v.label}</span>`;
    return `<tr class="main ${open ? "open" : ""} ${c.verified ? "done" : ""}" data-k="${k}">
      <td><span class="caret">▸</span> ${qLabel(v.cal_q)}<div style="color:var(--muted);font-size:11px">${esc(v.fiscal_period)}</div></td><td>${esc(D.field_label[v.field])}</td>
      <td class="num"><span class="full">${usd(v.value)}</span><span class="abbr">${short(v.value)}</span></td><td class="num hide-sm">${usd(v.ref)}</td><td>${pill}</td>
      <td class="hide-sm" style="color:var(--muted);font-size:12px">${esc(D.method_label[v.method] || v.method)} · ${v.sources.length} cell${v.sources.length > 1 ? "s" : ""}</td>
      <td><label class="check" onclick="event.stopPropagation()"><input type="checkbox" data-check="${k}" ${c.verified ? "checked" : ""} aria-label="Verified against filing"> verified</label></td>
      <td class="hide-sm" onclick="event.stopPropagation()"><input class="note" data-note="${k}" value="${esc(c.note || "")}" placeholder="note"></td>
    </tr>${open ? `<tr class="detail"><td colspan="8">${detail(v)}</td></tr>` : ""}`;
  }).join("") || `<tr><td colspan="8" style="color:var(--muted)">Nothing in this view.</td></tr>`;
}

function seg(name, opts) {
  return `<div class="seg">${Object.entries(opts).map(([k, l]) => `<button data-${name}="${k}" aria-pressed="${state[name] === k}">${l}</button>`).join("")}</div>`;
}

function story() {
  const c = D.counts, block = D.exceptions.filter((e) => e.severity === "block").length, warn = D.exceptions.filter((e) => e.severity === "warn").length;
  return `<div class="story">
    <p><b>What this is.</b> Companies on the US stock market file quarterly reports (10-Q) and annual reports (10-K) with the SEC. AI readers opened ${c.filings} of these reports for ${D.tickers.join(", ")} and copied out four numbers per period: <b>revenue</b>, <b>cost of revenue</b>, <b>operating income</b> (profit from the business itself) and <b>capex</b> (money spent on buildings and equipment). For every number they wrote down exactly where they found it: the table, the row and the column.</p>
    <p><b>How we check them.</b> Companies also file a machine-readable copy of the same numbers, called <b>XBRL</b>. The AI never sees it, so it works as an answer key: ${c.agree} of ${c.values} quarterly numbers match it. Automatic rules also look for problems a person would spot: totals that don't add up, impossible values, sudden jumps.</p>
    <p><b>Your job.</b> The AI does the reading. A person decides what we stand behind. ${block ? `<b>${block} item${block > 1 ? "s" : ""} need${block > 1 ? "" : "s"} your decision</b> before this data can be released, plus ${warn} smaller warning${warn === 1 ? "" : "s"}.` : "Nothing is blocking."} Each item below says what happened and what to do. Your decision is recorded with your name and reason.</p>
    <ol class="steps">
      <li><b>Decide each item</b> in "Needs your decision": read the card, open the filing if needed, then accept, override or reject.</li>
      <li><b>Spot-check the numbers</b> in "Every value": open a row, click "Open the filing at this row", confirm the number, and tick "verified".</li>
      <li><b>Download the hand-check</b> and save it as <code>golden/stage${D.stage}-handcheck.json</code>.</li>
      <li><b>Release</b>: <code>python -m ledger release v0.${D.stage}.0 --stage ${D.stage}</code>. It refuses until steps 1–3 are done.</li>
    </ol>
    <details><summary>Words used on this page</summary><dl class="gloss">
      <dt>Filing</dt><dd>A report a company sends to the SEC. A 10-Q covers a quarter; a 10-K covers a year.</dd>
      <dt>Cited cell</dt><dd>The exact table, row and column a number was copied from.</dd>
      <dt>XBRL</dt><dd>The machine-readable copy of a filing's numbers; our answer key.</dd>
      <dt>Year-to-date</dt><dd>A running total since the start of the company's year (6 or 9 months). A single quarter is often worked out by subtracting one running total from the next.</dd>
      <dt>Restatement</dt><dd>When a company rewrites past numbers, for example after selling part of its business. The old and new reports then disagree, and both are "correct" for their own basis.</dd>
      <dt>Accept / override / reject</dt><dd>Accept: the number is right as it is. Override: replace it with the right number. Reject: ship it blank, with your reason.</dd>
    </dl></details>
  </div>`;
}

function decisions() {
  const sev = (s) => D.exceptions.filter((e) => e.severity === s);
  const item = (e) => {
    const r = D.rules[e.rule_id] || { title: "The AI's answer for this filing could not be used", plain: "The output was missing or didn't follow the required format.", action: "Tell the data owner; the filing needs to be re-run." };
    return `<div class="qi"><div class="top"><span class="pill ${e.severity === "info" ? "na" : "bad"}">${e.severity}</span><b>${esc(r.title)}</b></div>
      <div class="cap2">${esc(e.ticker)} · ${esc(D.field_label[e.field] || e.field || "")} ${e.cal_q ? "· " + qLabel(e.cal_q) : ""}</div>
      <div><b>What happened:</b> ${esc(r.plain)}</div><div><b>The numbers:</b> ${esc(e.message)}</div><div><b>What to do:</b> ${esc(r.action)}</div>
      <details><summary class="cap2">Technical detail</summary><div class="cap2">Rule <code>${esc(e.rule_id)}</code> · id <code>${esc(e.exception_id)}</code></div></details></div>`;
  };
  const block = sev("block"), warn = sev("warn"), info = sev("info");
  return `<h2>Needs your decision (${block.length} blocking)</h2>
    ${block.length ? `<div class="queue">${block.map(item).join("")}</div>` : `<p class="foot">Nothing blocking.</p>`}
    <p class="foot">Decide each with <code>python -m ledger review --stage ${D.stage} decide &lt;id&gt; accept|override|reject --reason "…" --by "Kenny Geiler"</code>.</p>
    <details><summary><b>${warn.length} warnings</b>: also need a decision, usually accept</summary><div class="queue" style="margin-top:8px">${warn.map(item).join("")}</div></details>
    <details style="margin-top:8px"><summary><b>${info.length} notes</b>: no decision needed</summary><div class="queue" style="margin-top:8px">${info.map(item).join("")}</div></details>`;
}

function render() {
  $("#app").innerHTML = `
    <h1>${esc(document.title)}</h1>
    ${story()}
    ${tiles()}
    ${decisions()}
    <h2>Company</h2>
    <div class="toolbar">${seg("company", Object.fromEntries(D.tickers.map((t) => [t, `${t}${blocked.includes(t) ? " · needs decisions" : ""}`])))}</div>
    <h2>Agent vs XBRL, by quarter · ${esc(state.company)}</h2>
    <div class="charts">${D.fields.map(chart).join("")}</div>
    <div class="legend"><span><span class="sw" style="background:var(--agent)"></span>Agent value (read from the filing)</span><span><span class="ring"></span>XBRL value (answer key)</span><span><span class="sw" style="background:var(--bad)"></span>Disagreement</span></div>
    <h2>Every value</h2>
    <div class="toolbar">${seg("field", { all: "All", ...D.field_label })}${seg("show", { all: "All", todo: "Not yet checked", bad: "Disagreements" })}
      <span class="spacer"></span><button class="btn" id="expand">Expand all</button><button class="btn primary" id="export">Download hand-check</button></div>
    <table class="vals"><colgroup><col class="c-q"><col class="c-f"><col class="c-a"><col class="c-x hide-sm"><col class="c-m"><col class="c-h hide-sm"><col class="c-c"><col class="c-n hide-sm"></colgroup>
      <thead><tr><th>Quarter</th><th>Field</th><th style="text-align:right">Agent</th><th class="hide-sm" style="text-align:right">XBRL</th><th>Match</th><th class="hide-sm">How it was built</th><th>Your check</th><th class="hide-sm">Note</th></tr></thead>
      <tbody id="rows">${rows()}</tbody></table>
    <p class="foot">Release candidate ${D.release} · generated ${D.generated} UTC by <code>python -m ledger report --stage ${D.stage}</code> · hand-check record saved in this browser under “${KEY}”.</p>`;
  document.querySelectorAll("tr.detail [data-cited]").forEach((r) => r.closest(".tbl").scrollTop = r.offsetTop - 40);
}

function updateTiles() { const n = D.values.filter((v) => checks[key(v)]?.verified).length; $("#done-n").textContent = `${n}/${D.values.length}`; }

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-field],[data-show],[data-company]");
  if (b) { if (b.dataset.company) { state.company = b.dataset.company; state.open.clear(); } if (b.dataset.field) state.field = b.dataset.field; if (b.dataset.show) state.show = b.dataset.show; return render(); }
  if (e.target.closest("#expand")) { const vis = [...document.querySelectorAll("tr.main")].map((r) => r.dataset.k); const all = vis.every((k) => state.open.has(k)); vis.forEach((k) => all ? state.open.delete(k) : state.open.add(k)); return render(); }
  if (e.target.closest("#export")) {
    const out = { stage: D.stage, release: D.release, exported_at: new Date().toISOString(), checker: prompt("Your name, for the record:", "Kenny Geiler") || "",
      values: D.values.map((v) => ({ ticker: v.ticker, field: v.field, cal_q: v.cal_q, value: v.value, input_hash: v.input_hash, ...(checks[key(v)] || { verified: false }) })) };
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
    a.download = `stage${D.stage}-handcheck.json`; a.click(); return;
  }
  const hit = e.target.closest(".hit");
  if (hit) { state.open.add(hit.dataset.k); state.field = "all"; state.show = "all"; render(); document.querySelector(`tr.main[data-k="${CSS.escape(hit.dataset.k)}"]`)?.scrollIntoView({ block: "center" }); return; }
  const r = e.target.closest("tr.main");
  if (r) { state.open.has(r.dataset.k) ? state.open.delete(r.dataset.k) : state.open.add(r.dataset.k); render(); }
});
document.addEventListener("change", (e) => {
  const c = e.target.closest("[data-check]");
  if (c) { const k = c.dataset.check; checks[k] = { ...(checks[k] || {}), verified: c.checked, checked_at: new Date().toISOString() }; save(); c.closest("tr").classList.toggle("done", c.checked); updateTiles(); }
});
document.addEventListener("input", (e) => {
  const n = e.target.closest("[data-note]");
  if (n) { const k = n.dataset.note; checks[k] = { ...(checks[k] || {}), note: n.value }; save(); }
});
const tip = $("#tip");
document.addEventListener("pointermove", (e) => {
  const h = e.target.closest(".hit");
  if (!h) return tip.classList.remove("on");
  const v = D.values.find((x) => key(x) === h.dataset.k);
  tip.innerHTML = `<b>${esc(D.field_label[v.field])} ${qLabel(v.cal_q)}</b><br>Agent ${short(v.value)} · XBRL ${short(v.ref)}<br><span style="color:var(--muted)">click for evidence</span>`;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 180) + "px"; tip.style.top = e.clientY + 12 + "px"; tip.classList.add("on");
});
render();
</script>
</body>
</html>
