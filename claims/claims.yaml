# The claims register: one entry per claim the product makes on a page, in the API or in a release (docs/BUILD.md).
# ledger/claims.py loads it, checks every backed_by entry, and COMPUTES the status wherever a fact can decide it. A row
# with `checks` gets its status from the facts; a row without checks starts from its declared status and can only get
# worse. docs/CLAIMS.md and the Gaps page are written from this file and claims/findings.jsonl.
#
# Fields (ledger/claims.py refuses an entry that lacks one, or has an unknown status or check):
#   id          short, never reused.
#   claim       the claim as the product shows it, in its own words.
#   where       pages (ledger/pages/<name>.js), the Python that writes the words (ledger/cards.py, ...), API routes, files.
#   shown       the exact source strings of this claim. The page scan (ledger/claims.py scan) reads every page's label
#               maps and status texts and the cards' and causes' sentences; each string it finds needs a row listing it
#               here, and each string here must be in one of the ledger/ files under `where`. A built row with nothing
#               here fails too: name a string (a label, a function name) in one of its files.
#   backed_by   functions (module.name, must import) and tests (tests.<module>.<Class>.<method>, must exist, and must
#               not have been skipped or failed in the last `ledger test` run).
#   status      the declared status: proven | partial | stub | stale | planned.
#   checks      the facts that compute a status (ledger/claims.py CHECKS): gold, edgar_watch, hosted_copy,
#               mappings_confirmed, golden_report. Open findings on a claim (claims/findings.jsonl) cap it at partial.
#   gaps        what is not yet true and no check measures, in product words. A claim with any gap is never proven.
#               Gaps a check measures (counts, dates, versions) are written by the check, never typed here.
#   ticket      the ticket that closes the gaps (docs/TICKETS.md), or none.

- id: verified_xbrl
  claim: "Verified · matches SEC XBRL"
  where: [ledger/pages/trail.js, ledger/pages/_shared.js, ledger/cards.py, /api/v1/proof/<ticker>]
  shown: ["Verified", "Matches SEC XBRL", "matches SEC data", "agrees with XBRL", "XBRL"]
  backed_by:
    functions: [ledger.status.state, ledger.cards._how, ledger.ties.fact_state]
    tests:
      - tests.test_status.Definition.test_the_four_answer_keys_check_a_row_the_same_way
      - tests.test_cards.How.test_the_ladder_in_plain_words
      - tests.test_status.OneLadder.test_every_fact_reads_the_same_on_every_page
  status: partial
  gaps:
    - The SEC XBRL copy comes from the same company as the 10-K; a match is one source read twice.
  ticket: T86

